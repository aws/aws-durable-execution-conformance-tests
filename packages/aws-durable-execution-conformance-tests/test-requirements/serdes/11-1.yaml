---
# 11.1: Filesystem SerDes persists and rehydrates payloads across replay
description: Filesystem SerDes offloads durable payloads and rehydrates a completed step after replay
handler: |
  Configure the handler's global serializer/deserializer pipeline with the SDK's filesystem-backed
  SerDes in ALWAYS mode, using a durable mounted filesystem shared by reinvocations. Configure its
  checkpoint preview to expose the payload kind, operation name, input id, value length, and the
  verification result's SHA-256 checksum.
  A step named "store-payload" returns the structured input. The handler then waits for 1 second to
  force reinvocation. After replay, a step named "verify-payload" reads the completed first step's
  rehydrated result and returns an object containing the same id, value length, and the SHA-256
  checksum of the rehydrated value.
invocations: |
  - Handler runs "store-payload". The filesystem SerDes writes the serialized structured value to
    the mounted filesystem and checkpoints a versioned file-reference envelope with preview
    metadata. The handler starts "force-filesystem-replay", checkpoints WaitStarted, and suspends.
  - Replay 1: The SDK reads the first step's file-reference envelope, validates and deserializes the
    stored payload, and completes the wait. "verify-payload" receives the reconstructed value and
    returns its id, length, and SHA-256 checksum. Its result and the execution output are also
    checkpointed as filesystem file-reference envelopes whose previews contain the checksum of the
    original deterministic input.
Variables:
  PAYLOAD: filesystem-serdes-round-trip-payload-11-1
Input:
  id: payload-1
  value: ${PAYLOAD}
ExpectedResult:
  ExecutionStatus: SUCCEEDED
ExpectedExecutionHistory:
  - EventType: StepStarted
    SubType: Step
    EventId: 2
    Id: ${STORE_STEP}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepSucceeded
    SubType: Step
    EventId: 3
    Id: ${STORE_STEP}
    EventTimestamp: '*'
    StepSucceededDetails:
      Result:
        Payload: >-
          ${/(?x)\A\s*\{
          \s*"__durable_execution_filesystem_serdes"\s*:\s*1\s*,
          \s*"ownerDurableExecutionArn"\s*:\s*"(?:\\.|[^"\\])+"\s*,
          \s*"ownerEntityId"\s*:\s*"(?:\\.|[^"\\])+"\s*,
          \s*"payloadType"\s*:\s*"UTF8"\s*,
          \s*"payloadDigest"\s*:\s*"[0-9a-f]{64}"\s*,
          \s*"file"\s*:\s*"(?:\\.|[^"\\])+"\s*,
          \s*"preview"\s*:\s*\{
          (?=[^{}]*"payloadKind"\s*:\s*"RESULT"\s*(?:,|\}))
          (?=[^{}]*"operationName"\s*:\s*"store-payload"\s*(?:,|\}))
          (?=[^{}]*"id"\s*:\s*"payload-1"\s*(?:,|\}))
          (?=[^{}]*"length"\s*:\s*41\s*(?:,|\}))
          [^{}]*\}\s*\}\s*\Z/}
  - EventType: WaitStarted
    SubType: Wait
    EventId: 4
    Id: ${REPLAY_WAIT}
    EventTimestamp: '*'
    WaitStartedDetails:
      Duration: 1
  - EventType: InvocationCompleted
    EventId: 5
    EventTimestamp: '*'
    InvocationCompletedDetails: {}
  - EventType: WaitSucceeded
    SubType: Wait
    EventId: 6
    Id: ${REPLAY_WAIT}
    EventTimestamp: '*'
    WaitSucceededDetails:
      Duration: 1
  - EventType: StepStarted
    SubType: Step
    EventId: 7
    Id: ${VERIFY_STEP}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepSucceeded
    SubType: Step
    EventId: 8
    Id: ${VERIFY_STEP}
    EventTimestamp: '*'
    StepSucceededDetails:
      Result:
        Payload: >-
          ${/(?x)\A\s*\{
          \s*"__durable_execution_filesystem_serdes"\s*:\s*1\s*,
          \s*"ownerDurableExecutionArn"\s*:\s*"(?:\\.|[^"\\])+"\s*,
          \s*"ownerEntityId"\s*:\s*"(?:\\.|[^"\\])+"\s*,
          \s*"payloadType"\s*:\s*"UTF8"\s*,
          \s*"payloadDigest"\s*:\s*"[0-9a-f]{64}"\s*,
          \s*"file"\s*:\s*"(?:\\.|[^"\\])+"\s*,
          \s*"preview"\s*:\s*\{
          (?=[^{}]*"payloadKind"\s*:\s*"RESULT"\s*(?:,|\}))
          (?=[^{}]*"operationName"\s*:\s*"verify-payload"\s*(?:,|\}))
          (?=[^{}]*"id"\s*:\s*"payload-1"\s*(?:,|\}))
          (?=[^{}]*"length"\s*:\s*41\s*(?:,|\}))
          (?=[^{}]*"checksum"\s*:\s*"3ae2b07fb25ce0c7057d0b08c9b89e96aacf499b1a666c11e5dfe4d9b29544de"\s*(?:,|\}))
          [^{}]*\}\s*\}\s*\Z/}
  - EventType: InvocationCompleted
    EventId: 9
    EventTimestamp: '*'
    InvocationCompletedDetails: {}
  - EventType: ExecutionSucceeded
    EventId: 10
    EventTimestamp: '*'
    ExecutionSucceededDetails:
      Result:
        Payload: >-
          ${/(?x)\A\s*\{
          \s*"__durable_execution_filesystem_serdes"\s*:\s*1\s*,
          \s*"ownerDurableExecutionArn"\s*:\s*"(?:\\.|[^"\\])+"\s*,
          \s*"ownerEntityId"\s*:\s*"(?:\\.|[^"\\])+"\s*,
          \s*"payloadType"\s*:\s*"UTF8"\s*,
          \s*"payloadDigest"\s*:\s*"[0-9a-f]{64}"\s*,
          \s*"file"\s*:\s*"(?:\\.|[^"\\])+"\s*,
          \s*"preview"\s*:\s*\{
          (?=[^{}]*"payloadKind"\s*:\s*"OUTPUT"\s*(?:,|\}))
          (?=[^{}]*"id"\s*:\s*"payload-1"\s*(?:,|\}))
          (?=[^{}]*"length"\s*:\s*41\s*(?:,|\}))
          (?=[^{}]*"checksum"\s*:\s*"3ae2b07fb25ce0c7057d0b08c9b89e96aacf499b1a666c11e5dfe4d9b29544de"\s*(?:,|\}))
          [^{}]*\}\s*\}\s*\Z/}
