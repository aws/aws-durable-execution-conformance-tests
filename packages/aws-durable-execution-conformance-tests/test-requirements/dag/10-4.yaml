---
# 10.4: DAG in-graph Wait task (suspend and resume)
description: DAG with an in-graph Wait task that suspends the invocation and resumes it
handler: |
  A DAG named "waitresume" with three tasks in a linear chain: start -> pause ->
  finish. start is a step task that returns "started". pause is a Wait task
  (5 seconds) that depends on start, so it suspends the whole invocation without
  compute charges until the wait elapses, then resumes in a fresh invocation.
  finish is a step task that depends on pause and returns "resumed", proving the
  DAG ran to completion across the suspend/resume boundary. All tasks succeed, so
  the DAG completes with reason ALL_COMPLETED. The handler returns a summary with
  the completion reason, per-task terminal statuses, the [succeeded, failed,
  skipped, total] counts, and the post-resume marker.
invocations: |
  - Handler invokes the DAG operation. The SDK checkpoints ContextStarted
    (SubType Dag). Each task delegates to its native operation checkpointed
    directly under the Dag container (flat, name-based). start runs first: its
    step succeeds returning "started" (StepStarted / StepSucceeded, SubType Step,
    ParentId = the Dag op). pause then runs: the SDK checkpoints WaitStarted
    (SubType Wait, ParentId = the Dag op) and the invocation suspends
    (InvocationCompleted). When the wait elapses the invocation resumes and
    checkpoints WaitSucceeded. finish then runs its step directly under the Dag
    container, which succeeds returning "resumed". Finally the DAG checkpoints
    ContextSucceeded (SubType Dag) and the invocation completes returning the
    summary.
AsyncInvoke: true
Input: {}
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result:
    reason: ALL_COMPLETED
    statuses:
      start: SUCCEEDED
      pause: SUCCEEDED
      finish: SUCCEEDED
    counts:
      - 3
      - 0
      - 0
      - 3
    marker: resumed
# Direct op-count guard (flat N+1): EXACT total event count, MEASURED from the
# real captured cloud histories and identical across all four SDKs over two
# rounds. Fails directly on a reintroduced per-task wrapper op (2N+1) or any
# stray trailing op the EventId-keyed matcher would otherwise ignore.
ExpectedEventCount: 12
ExpectedExecutionHistory:
  - EventType: ContextStarted
    SubType: Dag
    EventId: 2
    Id: ${DAG}
    Name: waitresume
    EventTimestamp: '*'
    ContextStartedDetails: {}
  - EventType: StepStarted
    SubType: Step
    EventId: 3
    Id: ${S_START}
    Name: start
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepSucceeded
    SubType: Step
    EventId: 4
    Id: ${S_START}
    Name: start
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepSucceededDetails:
      Result:
        Payload: '"started"'
  - EventType: WaitStarted
    SubType: Wait
    EventId: 5
    Id: ${W_PAUSE}
    Name: pause
    ParentId: ${DAG}
    EventTimestamp: '*'
    WaitStartedDetails: {}
  - EventType: InvocationCompleted
    EventId: 6
    EventTimestamp: '*'
    InvocationCompletedDetails: {}
  - EventType: WaitSucceeded
    SubType: Wait
    EventId: 7
    Id: ${W_PAUSE}
    Name: pause
    ParentId: ${DAG}
    EventTimestamp: '*'
    WaitSucceededDetails: '*'
  - EventType: StepStarted
    SubType: Step
    EventId: 8
    Id: ${S_FINISH}
    Name: finish
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepSucceeded
    SubType: Step
    EventId: 9
    Id: ${S_FINISH}
    Name: finish
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepSucceededDetails:
      Result:
        Payload: '"resumed"'
  - EventType: ContextSucceeded
    SubType: Dag
    EventId: 10
    Id: ${DAG}
    Name: waitresume
    EventTimestamp: '*'
    ContextSucceededDetails: '*'
  - EventType: InvocationCompleted
    EventId: 11
    EventTimestamp: '*'
    InvocationCompletedDetails: {}
