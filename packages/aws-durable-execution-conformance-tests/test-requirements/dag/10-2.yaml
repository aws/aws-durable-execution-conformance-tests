---
# 10.2: DAG trigger-rule compensation (COMPLETED_WITH_FAILURES)
description: DAG saga where an upstream failure drives trigger-rule compensation
handler: |
  A DAG named "compensation" with four tasks: charge (root) and three tasks that
  depend on charge with different trigger rules. charge always fails ("payment
  declined"). fulfill uses the default trigger (all dependencies succeeded), so
  because charge failed it is SKIPPED and emits no events. refund uses the
  AllFailed trigger, so it runs because charge failed and returns "refunded".
  audit uses the AllDone trigger, so it runs regardless and returns "logged".
  charge exhausts the default retry policy before failing terminally. Because a
  task failed but the DAG still ran its compensating tasks to completion, the DAG
  completes with reason COMPLETED_WITH_FAILURES (the container does not throw).
  The handler returns a summary with the completion reason, per-task terminal
  statuses, and the [succeeded, failed, skipped, total] counts.
invocations: |
  - Handler invokes the DAG operation. The SDK checkpoints ContextStarted
    (SubType Dag). Each task delegates to its native operation checkpointed
    directly under the Dag container (flat, name-based). charge runs first: its
    step is attempted and fails, retrying under the default retry policy across
    suspend/resume boundaries until the attempts are exhausted and the charge
    step checkpoints a terminal StepFailed (SubType Step, ParentId = the Dag op).
    The skipped fulfill task emits no events at all. refund (AllFailed trigger)
    then runs its step directly under the Dag container and succeeds, and audit
    (AllDone trigger) runs its step and succeeds. Finally the DAG checkpoints
    ContextSucceeded (SubType Dag) with reason COMPLETED_WITH_FAILURES and the
    invocation completes returning the summary.
AsyncInvoke: true
AsyncConfig:
  NoProgressTimeoutSeconds: 90
Input: {}
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result:
    reason: COMPLETED_WITH_FAILURES
    statuses:
      charge: FAILED
      fulfill: SKIPPED
      refund: SUCCEEDED
      audit: SUCCEEDED
    counts:
      - 2
      - 1
      - 1
      - 4
# Direct op-count guard (flat N+1): the EXACT total event count, MEASURED from
# the real captured cloud histories and identical across all four SDKs
# (js/python/java/go) over two independent rounds -- including the 6-attempt
# retry footprint on charge (StepFailed x6). Fails directly if a per-task
# wrapper op reappears (2N+1) or any stray op is appended past the last pinned
# EventId, which the EventId-keyed matcher would otherwise ignore.
ExpectedEventCount: 26
ExpectedExecutionHistory:
  - EventType: ContextStarted
    SubType: Dag
    EventId: 2
    Id: ${DAG}
    Name: compensation
    EventTimestamp: '*'
    ContextStartedDetails: {}
  - EventType: StepStarted
    SubType: Step
    EventId: 3
    Id: ${S_CHARGE}
    Name: charge
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepFailed
    SubType: Step
    EventId: 19
    Id: ${S_CHARGE}
    Name: charge
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepFailedDetails: '*'
  - EventType: StepStarted
    SubType: Step
    EventId: 20
    Id: ${S_REFUND}
    Name: refund
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepSucceeded
    SubType: Step
    EventId: 21
    Id: ${S_REFUND}
    Name: refund
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepSucceededDetails:
      Result:
        Payload: '"refunded"'
  - EventType: StepStarted
    SubType: Step
    EventId: 22
    Id: ${S_AUDIT}
    Name: audit
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepSucceeded
    SubType: Step
    EventId: 23
    Id: ${S_AUDIT}
    Name: audit
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepSucceededDetails:
      Result:
        Payload: '"logged"'
  - EventType: ContextSucceeded
    SubType: Dag
    EventId: 24
    Id: ${DAG}
    Name: compensation
    EventTimestamp: '*'
    # Pin the converged, customer-facing DAG container envelope (rendered in the
    # AWS console) so the four SDKs cannot silently drift back to four shapes.
    # The payload is carried on the wire as a JSON string, so ${JSON} decodes it
    # before structural matching. Only genuinely-variable / language-specific
    # values are wildcarded: timestamps, and the failed task's ErrorType /
    # ErrorMessage / StackTrace (JS/Python/Go emit ErrorType "StepError" while
    # Java emits the thrown class "java.lang.RuntimeException"; message/stack are
    # runtime-specific too). Field NAMES, statuses, skipReason, counts,
    # completionReason and failedTaskNames are pinned.
    ContextSucceededDetails:
      Result:
        Payload:
          ${JSON}:
            type: DagResult
            totalCount: 4
            successCount: 2
            failureCount: 1
            skippedCount: 1
            completionReason: COMPLETED_WITH_FAILURES
            startedTaskNames: []
            failedTaskNames:
              - charge
            # Fields the convergence deleted from the old JS envelope stay gone.
            completedCount: ${ABSENT}
            terminalTaskNames: ${ABSENT}
            summary: ${ABSENT}
            # Registration order: charge, fulfill, refund, audit.
            tasks:
              - name: charge
                status: FAILED
                skipReason: null
                # resultKind describes how to read `result`, so a task with no
                # result carries null for both. Converged in all four SDKs.
                resultKind: null
                result: null
                error:
                  ErrorType: '*'
                  ErrorMessage: '*'
                  StackTrace: '*'
                startedAt: '*'
                completedAt: '*'
              - name: fulfill
                status: SKIPPED
                skipReason: TRIGGER_RULE
                resultKind: null
                result: null
                error: null
                startedAt: null
                completedAt: null
              - name: refund
                status: SUCCEEDED
                skipReason: null
                resultKind: plain
                result: refunded
                error: null
                startedAt: '*'
                completedAt: '*'
              - name: audit
                status: SUCCEEDED
                skipReason: null
                resultKind: plain
                result: logged
                error: null
                startedAt: '*'
                completedAt: '*'
  - EventType: InvocationCompleted
    EventId: 25
    EventTimestamp: '*'
    InvocationCompletedDetails: {}
