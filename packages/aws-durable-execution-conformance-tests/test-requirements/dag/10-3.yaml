---
# 10.3: DAG per-task conditional execution (WithRunIf)
description: DAG where per-task runIf predicates skip non-matching branches with no events
handler: |
  A DAG named "runif" with a classify root task and three branch tasks (publish,
  review, block), each depending on classify and each guarded by a per-task runIf
  predicate that runs the branch only when classify's result equals the branch's
  own name. classify returns "review". Only the review branch's predicate is
  satisfied, so classify and review run and succeed while publish and block are
  SKIPPED and emit no events. All non-skipped tasks succeed, so the DAG completes
  with reason ALL_COMPLETED. The handler returns a summary with the completion
  reason, per-task terminal statuses, the [succeeded, failed, skipped, total]
  counts, and the name of the branch that ran.
invocations: |
  - Handler invokes the DAG operation. The SDK checkpoints ContextStarted
    (SubType Dag). Each non-skipped task delegates to its native operation
    checkpointed directly under the Dag container (flat, name-based). classify
    runs first: its step succeeds returning "review" (StepStarted / StepSucceeded,
    SubType Step, ParentId = the Dag op). The runIf predicates are then evaluated:
    publish and block do not match and are skipped, emitting no events; review
    matches and runs its step directly under the Dag container, which succeeds
    returning "review". Finally the DAG checkpoints ContextSucceeded (SubType Dag)
    and the invocation completes returning the summary.
AsyncInvoke: true
Input: {}
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result:
    reason: ALL_COMPLETED
    statuses:
      classify: SUCCEEDED
      review: SUCCEEDED
      publish: SKIPPED
      block: SKIPPED
    counts:
      - 2
      - 0
      - 2
      - 4
    branch: review
# Direct op-count guard (flat N+1): EXACT total event count, MEASURED from the
# real captured cloud histories and identical across all four SDKs over two
# rounds. Fails directly on a reintroduced per-task wrapper op (2N+1) or any
# stray trailing op the EventId-keyed matcher would otherwise ignore. Also pins
# that the two runIf-skipped branches emit NO events (a skip must be silent).
ExpectedEventCount: 9
ExpectedExecutionHistory:
  - EventType: ContextStarted
    SubType: Dag
    EventId: 2
    Id: ${DAG}
    Name: runif
    EventTimestamp: '*'
    ContextStartedDetails: {}
  - EventType: StepStarted
    SubType: Step
    EventId: 3
    Id: ${S_CLASSIFY}
    Name: classify
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepSucceeded
    SubType: Step
    EventId: 4
    Id: ${S_CLASSIFY}
    Name: classify
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepSucceededDetails:
      Result:
        Payload: '"review"'
  - EventType: StepStarted
    SubType: Step
    EventId: 5
    Id: ${S_REVIEW}
    Name: review
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepSucceeded
    SubType: Step
    EventId: 6
    Id: ${S_REVIEW}
    Name: review
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepSucceededDetails:
      Result:
        Payload: '"review"'
  - EventType: ContextSucceeded
    SubType: Dag
    EventId: 7
    Id: ${DAG}
    Name: runif
    EventTimestamp: '*'
    ContextSucceededDetails: '*'
  - EventType: InvocationCompleted
    EventId: 8
    EventTimestamp: '*'
    InvocationCompletedDetails: {}
