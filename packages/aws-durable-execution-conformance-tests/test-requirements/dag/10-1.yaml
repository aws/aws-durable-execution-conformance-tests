---
# 10.1: DAG diamond fan-out/fan-in (all tasks complete)
description: DAG diamond fan-out/fan-in where a root task feeds two parallel tasks that merge
handler: |
  A DAG named "diamond" with four tasks forming a diamond dependency graph:
  fetch (root) -> {ta, tb} -> merge. fetch returns 10; ta depends on fetch and
  returns fetch+1 (=11); tb depends on fetch and returns fetch*2 (=20); merge
  depends on both ta and tb and returns ta+tb (=31). Max-concurrency is 1 so the
  ready tasks run sequentially in a deterministic topological order
  (fetch, ta, tb, merge). Every task succeeds, so the DAG completes with reason
  ALL_COMPLETED. The handler returns a summary: the completion reason, the
  per-task terminal statuses, the [succeeded, failed, skipped, total] counts,
  and the merge result.
invocations: |
  - Handler invokes the DAG operation. The SDK checkpoints ContextStarted
    (SubType Dag) for the DAG container. Each task delegates to its native
    operation checkpointed directly under the Dag container (flat, name-based):
    in topological order fetch, ta, tb and merge each checkpoint StepStarted /
    StepSucceeded (SubType Step, Name = the task name, ParentId = the Dag op).
    After all four steps succeed the SDK checkpoints ContextSucceeded (SubType
    Dag) and the invocation completes returning the summary.
AsyncInvoke: true
Input: {}
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result:
    reason: ALL_COMPLETED
    statuses:
      fetch: SUCCEEDED
      ta: SUCCEEDED
      tb: SUCCEEDED
      merge: SUCCEEDED
    counts:
      - 4
      - 0
      - 0
      - 4
    merge: 31
ExpectedExecutionHistory:
  - EventType: ContextStarted
    SubType: Dag
    EventId: 2
    Id: ${DAG}
    Name: diamond
    EventTimestamp: '*'
    ContextStartedDetails: {}
  - EventType: StepStarted
    SubType: Step
    EventId: 3
    Id: ${S_FETCH}
    Name: fetch
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepSucceeded
    SubType: Step
    EventId: 4
    Id: ${S_FETCH}
    Name: fetch
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepSucceededDetails:
      Result:
        Payload: '10'
  - EventType: StepStarted
    SubType: Step
    EventId: 5
    Id: ${S_TA}
    Name: ta
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepSucceeded
    SubType: Step
    EventId: 6
    Id: ${S_TA}
    Name: ta
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepSucceededDetails:
      Result:
        Payload: '11'
  - EventType: StepStarted
    SubType: Step
    EventId: 7
    Id: ${S_TB}
    Name: tb
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepSucceeded
    SubType: Step
    EventId: 8
    Id: ${S_TB}
    Name: tb
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepSucceededDetails:
      Result:
        Payload: '20'
  - EventType: StepStarted
    SubType: Step
    EventId: 9
    Id: ${S_MERGE}
    Name: merge
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepSucceeded
    SubType: Step
    EventId: 10
    Id: ${S_MERGE}
    Name: merge
    ParentId: ${DAG}
    EventTimestamp: '*'
    StepSucceededDetails:
      Result:
        Payload: '31'
  - EventType: ContextSucceeded
    SubType: Dag
    EventId: 11
    Id: ${DAG}
    Name: diamond
    EventTimestamp: '*'
    ContextSucceededDetails: '*'
  - EventType: InvocationCompleted
    EventId: 12
    EventTimestamp: '*'
    InvocationCompletedDetails: {}
