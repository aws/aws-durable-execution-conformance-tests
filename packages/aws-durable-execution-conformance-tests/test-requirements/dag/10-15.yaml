---
# 10.15: DAG large payload — offloaded aggregate replayed across a suspend
description: DAG whose aggregate result exceeds the 256KB checkpoint limit is offloaded, then a
  completed container is replayed after a suspend and proven byte-identical across the offload
handler: |
  A DAG named "bigdag" with eight step tasks p1..p8, each a root with no
  dependencies, and max-concurrency 1 for determinism. Task pN returns a string
  of 51200 repetitions of its own letter: p1 returns "a" x 51200, p2 "b" x
  51200, through p8 "h" x 51200. The aggregate DagResult is therefore ~409600
  characters (~400KB), comfortably over the 256KB checkpoint threshold, while
  every individual task result (~51KB) stays well under it -- so only the
  aggregate container result is offloaded, never an individual task.

  Post-convergence the four SDKs share ONE replay strategy (superseding the
  divergence recorded in DAG_SPEC_CROSS_LANGUAGE.md 2.A.4 / 2.B.6): the container
  checkpoints the converged aggregate envelope with `tasks` DROPPED -- its
  absence is the offload signal -- and sets ReplayChildren so the per-task
  results stay in the retained child operations; on replay the aggregate is
  reconstructed from that envelope plus the per-task checkpoints. This scenario
  PINS that offloaded envelope shape (below) and also asserts one language-neutral
  round-trip fact via the digest.

  Handler flow, in order:
    1. dag(...) runs all eight tasks and resolves with the ~400KB aggregate. The
       SDK checkpoints the container result, which exceeds 256KB and is
       offloaded.
    2. A step (outside the DAG) computes a digest from the DagResult:
       "<taskCount>:<totalLength>:<firstCharOfEachTaskInOrder>" -- here exactly
       "8:409600:abcdefgh". Call it digestBefore. Because it is a step it is
       checkpointed, so its FIRST-invocation value survives the suspend.
    3. A wait of 2 seconds. This is the whole point: it forces the invocation to
       end so the next one must REPLAY the completed, offloaded DAG container --
       the only path on which the reconstruct-vs-re-execute divergence fires.
    4. After the resume the handler recomputes the same digest from the REPLAYED
       DagResult (plain handler code, not a checkpointed step) -> digestAfter.

  The handler returns a small summary: { reason, counts[8,0,0,8], digestBefore,
  digestAfter, match } where match is whether digestBefore equals digestAfter.
  The payload itself is NEVER returned -- only the digest -- to keep the result
  small. All eight tasks succeed, so the DAG completes with reason ALL_COMPLETED.

  The assertion that matters is
  digestBefore == digestAfter == "8:409600:abcdefgh". digestBefore is frozen
  from the first invocation (before the offload); digestAfter is computed on the
  resumed invocation from the container the SDK reconstructed from its offloaded
  aggregate envelope plus the retained per-task checkpoints. Their equality
  proves the ~400KB aggregate survived the offload and came back byte-identical
  through the converged replay strategy -- one check that holds for all four.

  This scenario does NOT combine with completionConfig: Python has a documented
  early-completion divergence (in-flight tasks restart, inherited from
  map/parallel) that a large-payload + early-completion combination would walk
  into. All eight tasks run to completion, so that path is never entered.
invocations: |
  - Fresh invoke: the SDK checkpoints ContextStarted (SubType Dag) for the
    "bigdag" container. With max-concurrency 1 the eight step tasks run serially
    in registration order p1..p8, each checkpointed directly under the Dag
    container (StepStarted / StepSucceeded, SubType Step, ParentId = the Dag op),
    each returning its ~51KB string. The DAG resolves and the SDK checkpoints the
    container result (ContextSucceeded, SubType Dag); the aggregate exceeds 256KB
    and is offloaded. The digestBefore step then runs outside the DAG and
    succeeds returning "8:409600:abcdefgh". The wait (2s) starts (WaitStarted)
    and the invocation completes, so the execution suspends.
  - Resume (the 2s timer fires): the invocation replays. The completed DAG
    container is reconstructed from its checkpointed aggregate envelope plus the
    retained per-task child checkpoints (ReplayChildren); each task fast-paths
    from its own checkpoint and no task body is re-invoked. The
    digestBefore step fast-paths from its checkpoint (still "8:409600:abcdefgh").
    The wait's timer has elapsed (WaitSucceeded). The handler then recomputes the
    digest from the replayed DagResult -> digestAfter == "8:409600:abcdefgh", so
    match is true. The execution succeeds and the invocation completes returning
    the summary.
AsyncInvoke: true
Input: {}
# Event count MEASURED, not derived (the offload's event footprint was not
# established when this scenario was authored). All four SDKs captured exactly 26
# on their first cloud run of this scenario: 2 framing + 2 container + 16 for the
# eight tasks + 2 digest step + 2 wait + 2 invocations. The converged aggregate
# envelope rides INSIDE the container's ContextSucceeded payload rather than
# emitting an event of its own, so pinning that payload (below) adds no events.
ExpectedEventCount: 26
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result:
    reason: ALL_COMPLETED
    counts:
      - 8
      - 0
      - 0
      - 8
    digestBefore: "8:409600:abcdefgh"
    digestAfter: "8:409600:abcdefgh"
    match: true
# The OFFLOADED container payload is now PINNED -- the half of the envelope
# contract no scenario checked before. Post-convergence all four SDKs checkpoint
# the SAME aggregate envelope for the container result: the inline envelope with
# `tasks` DROPPED (its absence is the offload signal; the per-task detail lives
# in the retained child operations). Only this ONE container event is pinned and
# only its shape -- no per-event topology or counts around the offload -- so the
# assertion stays language-neutral. The digest equality asserted in
# ExpectedResult above remains the complementary language-neutral proof that the
# ~400KB aggregate round-tripped byte-identically through the offload.
ExpectedExecutionHistory:
  - EventType: ContextSucceeded
    SubType: Dag
    EventId: 19
    Name: bigdag
    EventTimestamp: '*'
    # Payload is an opaque JSON string on the wire; ${JSON} decodes it first.
    ContextSucceededDetails:
      Result:
        Payload:
          ${JSON}:
            type: DagResult
            totalCount: 8
            successCount: 8
            failureCount: 0
            skippedCount: 0
            completionReason: ALL_COMPLETED
            startedTaskNames: []
            failedTaskNames: []
            # Offloaded: the per-task array is DROPPED. Its absence IS the
            # signal, so assert it is genuinely absent (not just unpinned).
            tasks: ${ABSENT}
            # Fields the convergence deleted from the old JS envelope stay gone.
            completedCount: ${ABSENT}
            terminalTaskNames: ${ABSENT}
            summary: ${ABSENT}
