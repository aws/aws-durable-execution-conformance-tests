---
# 13.36: Distributed map accepts S3 destinations with a non-default include selection
description: Distributed map S3 destinations whose include selection differs from the default are
  accepted and a one-item run succeeds
handler: |
  Handler invokes the distributed map operation over an inline source of one item, "a", with an S3
  success destination that includes the input and an S3 failure destination that includes the error,
  under different key prefixes in one bucket. Max-concurrency is 1, max retry attempts is 0, and the
  completion config tolerates one failure. The processor reports a per-item outcome and succeeds
  every item. The handler returns {status, successCount, readCount} from the summary.
invocations: |
  - Handler invokes the distributed map. The SDK checkpoints DistributedMapStarted (SubType
    DistributedMap) carrying both destinations and their include selections, then the invocation
    completes and the execution suspends. The service records the terminal event. The invocation
    completes returning the projection.
AsyncInvoke: true
Input: null
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result:
    status: SUCCEEDED
    successCount: 1
    readCount: 1
ExpectedExecutionHistory:
  - EventType: DistributedMapStarted
    SubType: DistributedMap
    EventId: 2
    Id: ${ID1}
    EventTimestamp: '*'
    DistributedMapStartedDetails:
      MaxConcurrency: 1
      Source:
        Type: INLINE
      Processor:
        FunctionName: '*'
        FunctionResponseTypes:
          - REPORT_BATCH_ITEM_OUTCOMES
        MaxRetryAttempts: 0
      Destination:
        OnSuccess:
          Type: S3
          Include:
            - INPUT
          S3DestinationConfig:
            Bucket: '*'
            KeyPrefix: '*'
        OnFailure:
          Type: S3
          Include:
            - ERROR
          S3DestinationConfig:
            Bucket: '*'
            KeyPrefix: '*'
      CompletionConfig:
        ToleratedFailureCount: 1
  - EventType: InvocationCompleted
    EventId: 3
    EventTimestamp: '*'
    InvocationCompletedDetails: '*'
  - EventType: DistributedMapSucceeded
    SubType: DistributedMap
    EventId: 4
    Id: ${ID1}
    EventTimestamp: '*'
    DistributedMapSucceededDetails:
      SuccessCount: 1
      ReadCount: 1
  - EventType: InvocationCompleted
    EventId: 5
    EventTimestamp: '*'
    InvocationCompletedDetails: '*'
