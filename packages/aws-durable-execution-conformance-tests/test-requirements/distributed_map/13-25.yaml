---
# 13.25: Distributed map rejects a tolerated failure percentage above 100
description: Distributed map given a completion config with a tolerated failure percentage of 101
  is rejected before any checkpoint and the execution fails
handler: |
  Handler invokes the distributed map operation over an inline source of a few small items, with a
  batch processor, a positive max-concurrency, and a completion config that sets a tolerated
  failure percentage of 101. A tolerated failure percentage must be from 0 through 100, so the SDK
  rejects the configuration before writing any checkpoint. The error is not caught, so the
  execution fails.
invocations: |
  - Handler invokes the distributed map with a tolerated failure percentage of 101. The SDK rejects
    the completion config before starting the operation, so no DistributedMap event is
    checkpointed. The error propagates uncaught and the execution fails.
Input: null
ExpectedResult:
  ExecutionStatus: FAILED
  Error:
    ErrorType: '*'
    ErrorMessage: '${/(?i).*tolerated.?failure.?percentage.*100.*/}'
ExpectedExecutionHistory:
  - EventType: InvocationCompleted
    EventId: 2
    EventTimestamp: '*'
    InvocationCompletedDetails: '*'
  - EventType: ExecutionFailed
    EventId: 3
    EventTimestamp: '*'
    ExecutionFailedDetails:
      Error:
        Payload:
          ErrorType: '*'
          ErrorMessage: '${/(?i).*tolerated.?failure.?percentage.*100.*/}'
