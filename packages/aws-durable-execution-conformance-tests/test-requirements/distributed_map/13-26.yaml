---
# 13.26: Distributed map rejects a minimum sample size with a tolerated failure count
description: Distributed map given a completion config that sets a minimum sample size together
  with a tolerated failure count is rejected before any checkpoint and the execution fails
handler: |
  Handler invokes the distributed map operation over an inline source of a few small items, with a
  batch processor, a positive max-concurrency, and a completion config that sets a tolerated
  failure count of 1 and a minimum sample size of 10. A minimum sample size may only be set with a
  tolerated failure percentage, so the SDK rejects the configuration before writing any
  checkpoint. The error is not caught, so the execution fails.
invocations: |
  - Handler invokes the distributed map with a tolerated failure count and a minimum sample size.
    The SDK rejects the completion config before starting the operation, so no DistributedMap event
    is checkpointed. The error propagates uncaught and the execution fails.
Input: null
ExpectedResult:
  ExecutionStatus: FAILED
  Error:
    ErrorType: '*'
    ErrorMessage: '${/(?i).*minimum.?sample.?size.*only valid with tolerated.?failure.?percentage.*/}'
ExpectedExecutionHistory:
  - EventType: InvocationCompleted
    EventId: 2
    EventTimestamp: '*'
    InvocationCompletedDetails: '*'
  - EventType: ExecutionFailed
    EventId: 3
    EventTimestamp: '*'
    ExecutionFailedDetails:
      Error:
        Payload:
          ErrorType: '*'
          ErrorMessage: '${/(?i).*minimum.?sample.?size.*only valid with tolerated.?failure.?percentage.*/}'
