---
# 13.31: Distributed map sends a minimum sample size with a tolerated failure percentage
description: Distributed map given a completion config with a tolerated failure percentage and a
  minimum sample size sends both and a one-item run succeeds
handler: |
  Handler invokes the distributed map operation over an inline source of one item, with
  max-concurrency 1 and a completion config that sets a tolerated failure percentage of 0 and a
  minimum sample size of 5. The processor reports a per-item outcome for each item. The item succeeds.
  The handler returns {status, successCount, readCount} from the summary.
invocations: |
  - Handler invokes the distributed map. The SDK checkpoints DistributedMapStarted (SubType
    DistributedMap) carrying a tolerated failure percentage of 0 and a minimum sample size of 5, then
    the invocation completes and the execution suspends. The service records the terminal event. The
    invocation completes returning the projection.
AsyncInvoke: true
Input: null
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result:
    status: SUCCEEDED
    successCount: 1
    readCount: 1
ExpectedExecutionHistory:
  - EventType: DistributedMapStarted
    SubType: DistributedMap
    EventId: 2
    Id: ${ID1}
    EventTimestamp: '*'
    DistributedMapStartedDetails:
      MaxConcurrency: 1
      Source:
        Type: INLINE
      Processor:
        FunctionName: '*'
        FunctionResponseTypes:
          - REPORT_BATCH_ITEM_OUTCOMES
      CompletionConfig:
        ToleratedFailurePercentage: 0
        MinimumSampleSize: 5
  - EventType: InvocationCompleted
    EventId: 3
    EventTimestamp: '*'
    InvocationCompletedDetails: '*'
  - EventType: DistributedMapSucceeded
    SubType: DistributedMap
    EventId: 4
    Id: ${ID1}
    EventTimestamp: '*'
    DistributedMapSucceededDetails:
      SuccessCount: 1
      ReadCount: 1
  - EventType: InvocationCompleted
    EventId: 5
    EventTimestamp: '*'
    InvocationCompletedDetails: '*'
