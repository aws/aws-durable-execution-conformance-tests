---
# 13.20: Distributed map rejects a timeout of zero
description: Distributed map given a timeout of 0 seconds is rejected before any checkpoint and the
  execution fails
handler: |
  Handler invokes the distributed map operation over an inline source of a few small items, with a
  processor function that succeeds every item, a positive max-concurrency, and a timeout of 0
  seconds. A timeout must be positive, so the SDK rejects the configuration before writing any
  checkpoint. The error is not caught, so the execution fails.
invocations: |
  - Handler invokes the distributed map with a timeout of 0 seconds. The SDK rejects the timeout
    before starting the operation, so no DistributedMap event is checkpointed. The error propagates
    uncaught and the execution fails.
Input: null
ExpectedResult:
  ExecutionStatus: FAILED
  Error:
    ErrorType: '*'
    ErrorMessage: '${/(?i).*timeout.*positive.*/}'
ExpectedExecutionHistory:
  - EventType: InvocationCompleted
    EventId: 2
    EventTimestamp: '*'
    InvocationCompletedDetails: '*'
  - EventType: ExecutionFailed
    EventId: 3
    EventTimestamp: '*'
    ExecutionFailedDetails:
      Error:
        Payload:
          ErrorType: '*'
          ErrorMessage: '${/(?i).*timeout.*positive.*/}'
