---
# 13.24: Distributed map rejects a negative tolerated failure count
description: Distributed map given a completion config with a tolerated failure count of -1 is
  rejected before any checkpoint and the execution fails
handler: |
  Handler invokes the distributed map operation over an inline source of a few small items, with a
  batch processor, a positive max-concurrency, and a completion config that sets a tolerated
  failure count of -1. A tolerated failure count must be a non-negative integer, so the SDK rejects
  the configuration before writing any checkpoint. The error is not caught, so the execution fails.
invocations: |
  - Handler invokes the distributed map with a tolerated failure count of -1. The SDK rejects the
    completion config before starting the operation, so no DistributedMap event is checkpointed.
    The error propagates uncaught and the execution fails.
Input: null
ExpectedResult:
  ExecutionStatus: FAILED
  Error:
    ErrorType: '*'
    ErrorMessage: '${/(?i).*tolerated.?failure.?count.*non.?negative.*/}'
ExpectedExecutionHistory:
  - EventType: InvocationCompleted
    EventId: 2
    EventTimestamp: '*'
    InvocationCompletedDetails: '*'
  - EventType: ExecutionFailed
    EventId: 3
    EventTimestamp: '*'
    ExecutionFailedDetails:
      Error:
        Payload:
          ErrorType: '*'
          ErrorMessage: '${/(?i).*tolerated.?failure.?count.*non.?negative.*/}'
