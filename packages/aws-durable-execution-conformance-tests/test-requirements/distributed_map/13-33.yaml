---
# 13.33: Distributed map S3 prefix listing of JSON array objects
description: Distributed map over the parsed contents of JSON array objects under an S3 key prefix
  is accepted and the run succeeds
handler: |
  Handler invokes the distributed map operation over the objects under one S3 key prefix, read in
  JSON_ARRAY format, with inline result collection and max-concurrency 1. The prefix holds one small
  object that holds [1, 2]. The processor reports a per-item outcome and succeeds every item. The handler
  returns {status, successCount, readCount} from the summary.
invocations: |
  - Handler invokes the distributed map. The SDK checkpoints DistributedMapStarted (SubType
    DistributedMap) carrying the S3 prefix source and the JSON_ARRAY format, then the invocation
    completes and the execution suspends. The service records the terminal event. The invocation
    completes returning the projection.
AsyncInvoke: true
Input: null
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result:
    status: SUCCEEDED
    successCount: 2
    readCount: 2
ExpectedExecutionHistory:
  - EventType: DistributedMapStarted
    SubType: DistributedMap
    EventId: 2
    Id: ${ID1}
    EventTimestamp: '*'
    DistributedMapStartedDetails:
      MaxConcurrency: 1
      Source:
        Type: S3
        S3SourceConfig:
          Type: LISTED_OBJECTS
          Bucket: '*'
          ListedObjectsConfig:
            KeyPrefix: '*'
            Format: JSON_ARRAY
      Processor:
        FunctionName: '*'
        FunctionResponseTypes:
          - REPORT_BATCH_ITEM_OUTCOMES
      ResultCollection:
        Mode: INLINE
  - EventType: InvocationCompleted
    EventId: 3
    EventTimestamp: '*'
    InvocationCompletedDetails: '*'
  - EventType: DistributedMapSucceeded
    SubType: DistributedMap
    EventId: 4
    Id: ${ID1}
    EventTimestamp: '*'
    DistributedMapSucceededDetails:
      SuccessCount: 2
      ReadCount: 2
  - EventType: InvocationCompleted
    EventId: 5
    EventTimestamp: '*'
    InvocationCompletedDetails: '*'
