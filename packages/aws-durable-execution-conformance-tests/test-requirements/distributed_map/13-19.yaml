---
# 13.19: Distributed map rejects a batch size of zero
description: Distributed map given a processor batch size of 0, below the minimum of 1, is rejected
  before any checkpoint and the execution fails
handler: |
  Handler invokes the distributed map operation over an inline source of a few small items, with a
  positive max-concurrency and a processor function that succeeds every item, using a batch size of
  0. The minimum batch size is 1, so the SDK rejects the configuration before writing any
  checkpoint. The error is not caught, so the execution fails.
invocations: |
  - Handler invokes the distributed map with a processor batch size of 0. The SDK rejects the batch
    size before starting the operation, so no DistributedMap event is checkpointed. The error
    propagates uncaught and the execution fails.
Input: null
ExpectedResult:
  ExecutionStatus: FAILED
  Error:
    ErrorType: '*'
    ErrorMessage: '${/(?i).*batch.?size.*/}'
ExpectedExecutionHistory:
  - EventType: InvocationCompleted
    EventId: 2
    EventTimestamp: '*'
    InvocationCompletedDetails: '*'
  - EventType: ExecutionFailed
    EventId: 3
    EventTimestamp: '*'
    ExecutionFailedDetails:
      Error:
        Payload:
          ErrorType: '*'
          ErrorMessage: '${/(?i).*batch.?size.*/}'
