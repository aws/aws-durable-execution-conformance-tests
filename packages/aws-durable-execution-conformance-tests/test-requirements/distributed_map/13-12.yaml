---
# 13.12: Distributed map S3 CSV source (header from the first row)
description: Distributed map reads items from an S3 CSV object taking column names from the first row
handler: |
  Handler invokes the distributed map operation over one S3 object in CSV format, with the column
  names taken from the first row and max-concurrency 1. The object holds the lines "id,name",
  "1,alpha" and "2,beta".
  The processor reports a per-item outcome and succeeds every item.
  The handler returns {status, successCount, readCount} from the summary.
invocations: |
  - Handler invokes the distributed map. The SDK checkpoints DistributedMapStarted (SubType
    DistributedMap) with the S3 source, the invocation completes, and the execution suspends until
    the service records the terminal event. The invocation then completes returning the projection.
AsyncInvoke: true
Input: null
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result:
    status: SUCCEEDED
    successCount: 2
    readCount: 2
ExpectedExecutionHistory:
  - EventType: DistributedMapStarted
    SubType: DistributedMap
    EventId: 2
    Id: ${ID1}
    EventTimestamp: '*'
    DistributedMapStartedDetails:
      MaxConcurrency: 1
      Source:
        Type: S3
        S3SourceConfig:
          Type: OBJECT
          Bucket: '*'
          ObjectConfig:
            Key: '*'
            Format: CSV
            CsvFormatOptions:
              HeaderLocation: FIRST_ROW
      Processor:
        FunctionName: '*'
        FunctionResponseTypes:
          - REPORT_BATCH_ITEM_OUTCOMES
  - EventType: InvocationCompleted
    EventId: 3
    EventTimestamp: '*'
    InvocationCompletedDetails: '*'
  - EventType: DistributedMapSucceeded
    SubType: DistributedMap
    EventId: 4
    Id: ${ID1}
    EventTimestamp: '*'
    DistributedMapSucceededDetails:
      SuccessCount: 2
      ReadCount: 2
  - EventType: InvocationCompleted
    EventId: 5
    EventTimestamp: '*'
    InvocationCompletedDetails: '*'
