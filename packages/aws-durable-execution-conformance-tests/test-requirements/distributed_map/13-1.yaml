---
# 13.1: Distributed map rejects a max-concurrency of zero
description: Distributed map invoked with a max-concurrency of 0 is rejected before any checkpoint
  and the execution fails
handler: |
  Handler invokes the distributed map operation over an inline source of a few small items, with a
  processor function that succeeds every item and a max-concurrency of 0. A positive max-concurrency
  is required, so the SDK rejects the configuration before writing any checkpoint. The error is not
  caught, so the execution fails.
invocations: |
  - Handler invokes the distributed map with max-concurrency 0. The SDK rejects the max-concurrency
    before starting the operation, so no DistributedMap event is checkpointed. The error propagates
    uncaught and the execution fails.
Input: null
ExpectedResult:
  ExecutionStatus: FAILED
  Error:
    ErrorType: '*'
    ErrorMessage: '${/(?i).*max.?concurrency.*/}'
ExpectedExecutionHistory:
  - EventType: InvocationCompleted
    EventId: 2
    EventTimestamp: '*'
    InvocationCompletedDetails: '*'
  - EventType: ExecutionFailed
    EventId: 3
    EventTimestamp: '*'
    ExecutionFailedDetails:
      Error:
        Payload:
          ErrorType: '*'
          ErrorMessage: '${/(?i).*max.?concurrency.*/}'
