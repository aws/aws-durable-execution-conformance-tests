---
# 10.6: Plugin first-invocation flag across replay
description: Plugin sees is-first-invocation true once, then false on replay
handler: |
  A handler with a single 2-second wait, configured with an instrumentation
  plugin. The plugin logs a JSON object to plain stdout from each hook:
  `{"plugin": "CONFPLUGIN", "hook": "invocation-start", "first": <is_first_invocation>}`
  and `{"plugin": "CONFPLUGIN", "hook": "invocation-end", "status": "<status enum token>"}`.
  Every emitted record also carries a `durableExecutionArn` field — the
  execution ARN received via the invocation-start hook's info parameter
  (captured by the plugin and stamped on subsequent records) — so
  CloudWatch's execution-scoped log retrieval locates plugin records.
invocations: |
  - Handler invokes `context.wait(2 seconds)`, plugin logs
    `invocation-start first=true`, SDK checkpoints WaitStarted, invocation
    completes, execution suspends (an invocation-end fired here, if any,
    carries a non-terminal status and is not asserted).
  - Replay 1: Re-invoked because the wait completed, plugin logs
    `invocation-start first=false`, SDK checkpoints WaitSucceeded, execution
    succeeds, plugin logs `invocation-end status=SUCCEEDED`.
Input:
ExpectedResult:
  ExecutionStatus: SUCCEEDED
ExpectedExecutionHistory:
  - EventType: WaitStarted
    SubType: Wait
    EventId: 2
    Id: ${ID1}
    EventTimestamp: '*'
    WaitStartedDetails:
      Duration: 2
  - EventType: InvocationCompleted
    EventId: 3
    EventTimestamp: '*'
    InvocationCompletedDetails: {}
  - EventType: WaitSucceeded
    SubType: Wait
    EventId: 4
    Id: ${ID1}
    EventTimestamp: '*'
    WaitSucceededDetails:
      Duration: 2
  - EventType: InvocationCompleted
    EventId: 5
    EventTimestamp: '*'
    InvocationCompletedDetails: {}
ExpectedLogs:
  # First invocation reports first=true, exactly once across the execution
  - match:
      plugin: CONFPLUGIN
      hook: invocation-start
      first: true
    count: 1
  # Replay invocation reports first=false, after the first invocation
  - match:
      plugin: CONFPLUGIN
      hook: invocation-start
      first: false
    count: 1
    after:
      - plugin: CONFPLUGIN
        hook: invocation-start
        first: true
  # Terminal invocation-end carries SUCCEEDED, exactly once, last
  - match:
      plugin: CONFPLUGIN
      hook: invocation-end
      status: SUCCEEDED
    count: 1
    after:
      - plugin: CONFPLUGIN
        hook: invocation-start
        first: false
