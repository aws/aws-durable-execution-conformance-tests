---
# 10.19: Invocation hook info field shape
description: Invocation-start and invocation-end hook info carries the full invocation field set
handler: |
  A single 2-second wait, then return "done-" concatenated with the execution
  input. The instrumentation plugin logs ONE single-line JSON record per
  invocation hook event: a CANONICAL DUMP of that hook's OWN info parameter.
  Every field the SDK's info type exposes is mapped one-to-one to the
  canonical camelCase name; unset or unexposed fields are OMITTED (a missing
  key fails its assertion — the parity signal); map-typed fields are emitted
  as `<name>Count` integers; timestamps as ISO-8601 strings; errors as their
  message string. One derived scalar is added: `terminal` := status in
  (SUCCEEDED, FAILED). No cross-hook reconstruction — `isFirstInvocation` on
  the end record MUST come from the invocation-end info itself.
  Canonical schemas:
  `{"plugin": "CONFPLUGIN", "hook": "invocation-start", "isFirstInvocation": <bool>, "requestId": "<id>", "executionInput": <input value>, "operationsCount": <int>, "updatedOperationsCount": <int>, "executionStartTimestamp": "<ISO-8601>"}`
  `{"plugin": "CONFPLUGIN", "hook": "invocation-end", "isFirstInvocation": <bool>, "requestId": "<id>", "executionInput": <input value>, "operationsCount": <int>, "executionStartTimestamp": "<ISO-8601>", "status": "<token>", "terminal": <bool>, "executionResult": <result value>, "executionError": "<message>"}`.
  Every record also carries a `durableExecutionArn` field (ARN captured at
  invocation-start, unasserted) so the runner's CloudWatch filter can scope
  logs to the execution.
invocations: |
  - Invocation 1: the wait starts and the execution suspends. The
    invocation-start record carries isFirstInvocation=true, the execution
    input value, a requestId, an operations count, and the execution start
    timestamp. The invocation-end record carries isFirstInvocation=true (from
    the end info itself) and a NON-terminal status (terminal=false).
  - Replay 1 (~2s): the wait completed externally between invocations, so the
    replay invocation-start record carries a non-zero updatedOperationsCount
    and still carries the execution input value (isFirstInvocation=false).
    The handler returns "done-<input>"; the terminal invocation-end record
    carries isFirstInvocation=false, terminal=true with status SUCCEEDED, the
    execution input, and the final execution result BY VALUE.
  An SDK whose info type omits any probed field fails the corresponding
  assertion — that red result is the parity signal this requirement exists to
  produce (the reference field set is the union across SDKs, anchored on the
  richest current surface).
Variables:
  INPUT_1: ${GEN_STR:8}
Input: ${INPUT_1}
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result: done-${INPUT_1}
ExpectedExecutionHistory:
  - EventType: WaitStarted
    SubType: Wait
    EventId: 2
    Id: ${ID1}
    EventTimestamp: '*'
    WaitStartedDetails:
      Duration: 2
  - EventType: InvocationCompleted
    EventId: 3
    EventTimestamp: '*'
    InvocationCompletedDetails: {}
  - EventType: WaitSucceeded
    SubType: Wait
    EventId: 4
    Id: ${ID1}
    EventTimestamp: '*'
    WaitSucceededDetails:
      Duration: 2
  - EventType: InvocationCompleted
    EventId: 5
    EventTimestamp: '*'
    InvocationCompletedDetails: {}
ExpectedLogs:
  # First invocation-start: full field set including the execution input value
  - match:
      plugin: CONFPLUGIN
      hook: invocation-start
      isFirstInvocation: true
      requestId: /.+/
      executionInput: ${INPUT_1}
      operationsCount: /^\d+$/
      executionStartTimestamp: /^\d{4}-/
    count: 1
  # Replay invocation-start: externally-completed wait appears in the info's
  # updated-operations collection, and the input is still exposed
  - match:
      plugin: CONFPLUGIN
      hook: invocation-start
      isFirstInvocation: false
      executionInput: ${INPUT_1}
      updatedOperationsCount: /^[1-9]\d*$/
    count: 1
  # Suspending invocation-end: first flag read from the END info itself
  - match:
      plugin: CONFPLUGIN
      hook: invocation-end
      isFirstInvocation: true
      terminal: false
    count: 1
  # Terminal invocation-end, probe 1: first flag from the end info
  - match:
      plugin: CONFPLUGIN
      hook: invocation-end
      isFirstInvocation: false
      terminal: true
      status: SUCCEEDED
    count: 1
  # Terminal invocation-end, probe 2 (decoupled from the first flag so each
  # red identifies exactly one missing field): the end info exposes the
  # execution input and the final result BY VALUE
  - match:
      plugin: CONFPLUGIN
      hook: invocation-end
      terminal: true
      status: SUCCEEDED
      executionInput: ${INPUT_1}
      executionResult: done-${INPUT_1}
    count: 1
  # The execution never surfaces an invocation-end error
  - match:
      plugin: CONFPLUGIN
      hook: invocation-end
      executionError: /.+/
    count: 0
  # Inherited base fields on the END info (decoupled — one probe per field so
  # each red identifies exactly one missing surface). Both invocation-end
  # records must carry them.
  - match:
      plugin: CONFPLUGIN
      hook: invocation-end
      requestId: /.+/
    count: 2
  - match:
      plugin: CONFPLUGIN
      hook: invocation-end
      operationsCount: /^\d+$/
    count: 2
  - match:
      plugin: CONFPLUGIN
      hook: invocation-end
      executionStartTimestamp: /^\d{4}-/
    count: 2
