---
# 10.7: Plugin sees terminal failure
description: Plugin invocation-end hook receives FAILED status when execution fails
handler: |
  A handler with a single step that always throws, configured with no retries
  (max attempts 1) and an instrumentation plugin. The plugin logs a JSON object to plain stdout from each hook:
  `{"plugin": "CONFPLUGIN", "hook": "invocation-start", "first": <is_first_invocation>}`
  and `{"plugin": "CONFPLUGIN", "hook": "invocation-end", "status": "<status enum token>"}`.
  Every emitted record also carries a `durableExecutionArn` field — the
  execution ARN received via the invocation-start hook's info parameter
  (captured by the plugin and stamped on subsequent records) — so
  CloudWatch's execution-scoped log retrieval locates plugin records.
invocations: |
  - Handler invokes `context.step(failing_func, config=no-retry strategy)`, the
    plugin logs `invocation-start first=true`, the step throws, no retry is
    attempted, the step is checkpointed as failed and the execution fails. The
    plugin's invocation-end hook fires with the FAILED status.
Input:
ExpectedResult:
  ExecutionStatus: FAILED
ExpectedExecutionHistory:
  - EventType: StepStarted
    SubType: Step
    EventId: 2
    Id: ${ID1}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepFailed
    SubType: Step
    EventId: 3
    Id: ${ID1}
    EventTimestamp: '*'
    StepFailedDetails:
      Error:
        Payload:
          ErrorMessage: '*'
          ErrorType: '*'
  - EventType: InvocationCompleted
    EventId: 4
    EventTimestamp: '*'
    InvocationCompletedDetails: {}
ExpectedLogs:
  # Invocation starts normally
  - match:
      plugin: CONFPLUGIN
      hook: invocation-start
      first: true
    count: 1
  # Invocation-end hook fires with the FAILED terminal status
  - match:
      plugin: CONFPLUGIN
      hook: invocation-end
      status: FAILED
    count: 1
    after:
      - plugin: CONFPLUGIN
        hook: invocation-start
        first: true
  # The invocation never reports success
  - match:
      plugin: CONFPLUGIN
      hook: invocation-end
      status: SUCCEEDED
    count: 0
