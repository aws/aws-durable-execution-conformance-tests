---
# 10.18: Slow plugin hook work is reliably delivered
description: Slow work in a plugin hook completes and its record is present in the execution logs
handler: |
  A handler with a single step that returns a greeting string, configured with an
  instrumentation plugin. The plugin, filtering to step-type operations, performs
  ~1 second of deliberately slow work inside its operation-end hook using the
  hook's natural completion mechanism for the SDK and only THEN logs a JSON
  object to plain stdout:
  `{"plugin": "CONFPLUGIN", "hook": "slow-operation-end", "op": "<operation_id>", "status": "<status enum token>"}`.
  The plugin also logs
  `{"plugin": "CONFPLUGIN", "hook": "invocation-end", "status": "<status enum token>"}`
  from its invocation-end hook. The slow record MUST be reliably delivered to
  the execution's logs rather than lost when the execution environment freezes.
  The current log matcher observes eventual record presence; it does not compare
  record timestamps with the Lambda response boundary and therefore does not
  assert that the SDK waited for the slow hook before returning. No ordering
  between the slow record and the invocation-end record is asserted because hook
  dispatch threading varies per SDK.
  Every emitted record also carries a `durableExecutionArn` field — the
  execution ARN received via the invocation-start hook's info parameter
  (captured by the plugin and stamped on subsequent records) — so
  CloudWatch's execution-scoped log retrieval locates plugin records.
invocations: |
  - Handler invokes `context.step(greet(event))`, step succeeds on its first
    attempt, and execution succeeds in one invocation. The plugin's
    operation-end hook performs its ~1s of work and emits the slow record. The
    validator subsequently retrieves that record from the execution's logs,
    demonstrating reliable eventual delivery without making an assertion about
    its timing relative to the Lambda response boundary.
Variables:
  INPUT_1: ${GEN_STR:8}
Input: ${INPUT_1}
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result: Hello, ${INPUT_1}!
ExpectedExecutionHistory:
  - EventType: StepStarted
    SubType: Step
    EventId: 2
    Id: ${ID1}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepSucceeded
    SubType: Step
    EventId: 3
    Id: ${ID1}
    EventTimestamp: '*'
    StepSucceededDetails:
      Result: {}
  - EventType: InvocationCompleted
    EventId: 4
    EventTimestamp: '*'
    InvocationCompletedDetails: {}
ExpectedLogs:
  # The slow hook's record is eventually present despite the ~1s delay
  - match:
      plugin: CONFPLUGIN
      hook: slow-operation-end
      op: ${ID1}
      status: SUCCEEDED
    count: 1
  # The invocation-end hook also fired with the terminal status
  - match:
      plugin: CONFPLUGIN
      hook: invocation-end
      status: SUCCEEDED
    count: 1
