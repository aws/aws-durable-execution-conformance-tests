---
# 10.22: Operation-change hook info field shape
description: Operation-change hook info carries full operation items in the delta and their membership in the full map
handler: |
  A single step named "greet" that returns "task-a". The instrumentation
  plugin implements the operation-change hook and, for each step-type
  operation in the updated-operations delta, logs ONE single-line JSON
  record: a CANONICAL DUMP of that DELTA ITEM (the hook info's own map
  entry). Every field the item type exposes is mapped one-to-one to the
  canonical camelCase name; unset or unexposed fields are OMITTED (a missing
  key fails its assertion — the parity signal); the reference item shape is
  the full operation info, not a reduced change-item record. The record also
  carries the hook-level fields: `executionArn` (from the change info
  itself), `updatedOperationsCount` and `operationsCount` (map sizes), and
  one derived scalar `inFullMap` := the same id also appears in the info's
  full operations map.
  Canonical schema (per delta item):
  `{"plugin": "CONFPLUGIN", "hook": "operation-change", "executionArn": "<arn>", "updatedOperationsCount": <int>, "operationsCount": <int>, "inFullMap": <bool>, "id": "<operation_id>", "name": "<name>", "type": "<TYPE>", "subType": "<token>", "parentId": "<id>", "status": "<token>", "startTimestamp": "<ISO-8601>", "endTimestamp": "<ISO-8601>", "error": "<message>", "attempt": <int>, "isReplay": <bool>}`.
  Replay indicators on items are asserted by PRESENCE only (their value
  semantics inside change maps are SDK-divergent). Every record also
  carries a `durableExecutionArn` field (ARN captured at invocation-start,
  unasserted) so the runner's CloudWatch filter can scope logs to the
  execution.
invocations: |
  - Handler invokes the named step "greet"; it succeeds on the first attempt.
    When the step's terminal SUCCEEDED checkpoint response is merged, the
    operation-change hook fires with the step in the updated delta: the
    logged record carries the history-checkpointed operation id, item name
    "greet", type STEP, status SUCCEEDED, start and end timestamps, attempt 1,
    inFullMap=true, the change info's execution ARN, and a non-zero
    updated-operations count. A STARTED change
    is not asserted (START may batch with the terminal status).
  An SDK whose change-info items omit any probed field (e.g. a reduced item
  record without attempt or timestamps) fails the corresponding assertion —
  that red result is the parity signal this requirement exists to produce.
Input:
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result: task-a
ExpectedExecutionHistory:
  - EventType: StepStarted
    SubType: Step
    EventId: 2
    Id: ${ID1}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepSucceeded
    SubType: Step
    EventId: 3
    Id: ${ID1}
    EventTimestamp: '*'
    StepSucceededDetails:
      Result: {}
  - EventType: InvocationCompleted
    EventId: 4
    EventTimestamp: '*'
    InvocationCompletedDetails: {}
ExpectedLogs:
  # The terminal change delta item carries the operation field surface
  - match:
      plugin: CONFPLUGIN
      hook: operation-change
      id: ${ID1}
      name: greet
      type: STEP
      status: SUCCEEDED
      endTimestamp: /^\d{4}-/
      attempt: 1
      inFullMap: true
      executionArn: /^arn:/
      updatedOperationsCount: /^[1-9]\d*$/
      operationsCount: /^[1-9]\d*$/
      startTimestamp: /^\d{4}-/
      isReplay: /.*/
    count: 1
  # The step never surfaces a FAILED change
  - match:
      plugin: CONFPLUGIN
      hook: operation-change
      id: ${ID1}
      status: FAILED
    count: 0
