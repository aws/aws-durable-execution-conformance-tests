---
# 10.23: Context-typed hook info field shape
description: Context operations expose subType tokens and user-function hooks expose the children-replay indicator
handler: |
  A parallel operation named "ctx" with max-concurrency 1 and two NAMED
  branches: branch "branch-a" runs a step named "inner" returning "x", then a
  2-second wait, and returns "a-done"; branch "branch-b" returns "b-done"
  directly. The instrumentation
  plugin (filtering to CONTEXT-type operations) logs ONE single-line JSON
  record per hook event: a CANONICAL camelCase DUMP of that hook's OWN info
  parameter — unset or unexposed fields OMITTED (a missing key fails its
  assertion, the parity signal); tokens dumped as the SDK reports them.
  Canonical schemas:
  `{"plugin": "CONFPLUGIN", "hook": "operation-start", "id": "<operation_id>", "name": "<name>", "type": "<TYPE>", "subType": "<token>", "parentId": "<id>", "isReplay": <bool>, ...}`
  `{"plugin": "CONFPLUGIN", "hook": "fn-start", "id": "<operation_id>", "name": "<name>", "type": "<TYPE>", "subType": "<token>", "parentId": "<id>", "isReplayingChildren": <bool>, ...}`
  where fn-start is the SDK's per-attempt / user-function start hook fired for
  the CONTEXT-type branch functions, and `isReplayingChildren` is the info's
  own children-replay indicator (true when the context function re-runs so its
  checkpointed child operations replay). subType tokens vary in casing/style
  per SDK and are asserted case-insensitively. Attempt-end hooks are NOT
  probed here: end-hook semantics for a suspending context run are
  SDK-divergent and out of scope. Every record also carries a
  `durableExecutionArn` field (ARN captured at invocation-start, unasserted)
  so the runner's CloudWatch filter can scope logs to the execution.
invocations: |
  - Invocation 1: the parallel context "ctx" starts (operation-start for the
    parent with a Parallel subType token, isReplay=false). With
    max-concurrency 1, branch-a's function runs LIVE
    (fn-start isReplayingChildren=false): the "inner" step executes, the
    2-second wait starts, and the execution suspends mid-branch.
  - Replay 1 (~2s): branch-a's function RE-RUNS so its checkpointed children
    (the step and the wait) replay. The wait has completed, branch-a returns
    "a-done"; branch-b's function then runs LIVE and returns "b-done"; the
    execution succeeds returning ["a-done", "b-done"]. Whether the re-run's
    record reports isReplayingChildren=true depends on service-side
    checkpoint timing (observed nondeterministic live), so the indicator is
    asserted by KEY PRESENCE, correlated per branch by name: branch-a must
    produce at least 2 key-bearing fn-start records (live + replay) and
    branch-b at least 1, so neither branch's records can stand in for the
    other's and branch-a's replayed re-run must itself bear the key.
  Because branch event ids are deterministic only for the parent under
  suspension-driven replays, only the parent ContextStarted event is asserted
  in the history; the behavior under test is asserted through the log
  records. An SDK whose context/user-function infos omit the subType token or
  the children-replay indicator fails the corresponding assertion — that red
  result is the parity signal this requirement exists to produce.
Input:
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result: [a-done, b-done]
ExpectedExecutionHistory:
  - EventType: ContextStarted
    SubType: Parallel
    EventId: 2
    Id: ${CTX_P}
    EventTimestamp: '*'
    ContextStartedDetails: {}
ExpectedLogs:
  # The parent parallel context starts live with its subType token
  - match:
      plugin: CONFPLUGIN
      hook: operation-start
      id: ${CTX_P}
      type: /(?i)context/
      subType: /(?i)^parallel$/
      isReplay: false
    count: 1
  # Each named branch context starts live exactly once with a branch subType
  # token (name-bound: one probe per branch)
  - match:
      plugin: CONFPLUGIN
      hook: operation-start
      name: branch-a
      type: /(?i)context/
      subType: /(?i)branch/
      isReplay: false
    count: 1
  - match:
      plugin: CONFPLUGIN
      hook: operation-start
      name: branch-b
      type: /(?i)context/
      subType: /(?i)branch/
      isReplay: false
    count: 1
  # Each branch function runs live at least once (branch-a in invocation 1,
  # branch-b in the replay invocation) with children-replay=false. At-least:
  # some SDKs also re-run a COMPLETED childless branch function during replay,
  # legitimately reporting false again.
  - match:
      plugin: CONFPLUGIN
      hook: fn-start
      name: branch-a
      isReplayingChildren: false
    min_count: 1
  - match:
      plugin: CONFPLUGIN
      hook: fn-start
      name: branch-b
      isReplayingChildren: false
    min_count: 1
  # THE field-surface probe, correlated per branch by name: branch-a fires
  # fn-start at least twice (live + its replayed re-run) and every one must
  # bear the children-replay indicator key — branch-b's records cannot stand
  # in for branch-a's, so the replayed re-run itself must carry the key.
  # The indicator's TRUE value depends on service-side checkpoint timing
  # (read from the checkpointed context details) and proved nondeterministic
  # across live runs, so values are dumped for observability but only key
  # presence is asserted.
  - match:
      plugin: CONFPLUGIN
      hook: fn-start
      name: branch-a
      isReplayingChildren: /.*/
    min_count: 2
  - match:
      plugin: CONFPLUGIN
      hook: fn-start
      name: branch-b
      isReplayingChildren: /.*/
    min_count: 1
