---
# 10.17: Faulty plugin does not affect a healthy plugin
description: A plugin that throws in every hook never blocks another plugin's hooks or the execution
handler: |
  A handler with a single step that returns a greeting string, configured with
  TWO instrumentation plugins registered together, in order: first a faulty
  plugin whose EVERY hook logs a line and then throws an error, then a healthy
  plugin that logs normally. Each faulty-plugin hook logs a JSON object
  `{"plugin": "CONFPLUGIN-FAULTY", "hook": "<hook name>"}` to plain stdout
  before throwing, with hook names invocation-start and invocation-end. The
  healthy plugin logs
  `{"plugin": "CONFPLUGIN-HEALTHY", "hook": "invocation-start", "first": <is_first_invocation>}`,
  `{"plugin": "CONFPLUGIN-HEALTHY", "hook": "invocation-end", "status": "<status enum token>"}`, and,
  filtering to step-type operations,
  `{"plugin": "CONFPLUGIN-HEALTHY", "hook": "operation-start", "op": "<operation_id>"}` and
  `{"plugin": "CONFPLUGIN-HEALTHY", "hook": "operation-end", "op": "<operation_id>", "status": "<status enum token>"}`.
  The SDK must isolate each plugin: the faulty plugin's exceptions are swallowed
  and the healthy plugin still receives every hook. Hooks across multiple
  plugins may be dispatched concurrently, so no cross-plugin ordering is
  asserted.
  Every emitted record also carries a `durableExecutionArn` field — the
  execution ARN received via the invocation-start hook's info parameter
  (captured by the plugin and stamped on subsequent records) — so
  CloudWatch's execution-scoped log retrieval locates plugin records.
invocations: |
  - Handler invokes `context.step(greet(event))`, step succeeds on first
    attempt, execution succeeds in a single invocation. The faulty plugin logs
    and throws from both invocation hooks; the SDK swallows its exceptions. The
    healthy plugin receives invocation-start, operation-start, operation-end,
    and invocation-end exactly once each, and the execution result and history
    are identical to running without the faulty plugin.
Variables:
  INPUT_1: ${GEN_STR:8}
Input: ${INPUT_1}
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result: Hello, ${INPUT_1}!
ExpectedExecutionHistory:
  - EventType: StepStarted
    SubType: Step
    EventId: 2
    Id: ${ID1}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepSucceeded
    SubType: Step
    EventId: 3
    Id: ${ID1}
    EventTimestamp: '*'
    StepSucceededDetails:
      Result: {}
  - EventType: InvocationCompleted
    EventId: 4
    EventTimestamp: '*'
    InvocationCompletedDetails: {}
ExpectedLogs:
  # Faulty plugin ran (each hook logged before throwing)
  - match:
      plugin: CONFPLUGIN-FAULTY
      hook: invocation-start
    count: 1
  - match:
      plugin: CONFPLUGIN-FAULTY
      hook: invocation-end
    count: 1
  # Healthy plugin received every hook exactly once despite the faulty peer
  - match:
      plugin: CONFPLUGIN-HEALTHY
      hook: invocation-start
      first: true
    count: 1
  - match:
      plugin: CONFPLUGIN-HEALTHY
      hook: operation-start
      op: ${ID1}
    count: 1
  - match:
      plugin: CONFPLUGIN-HEALTHY
      hook: operation-end
      op: ${ID1}
      status: SUCCEEDED
    count: 1
  - match:
      plugin: CONFPLUGIN-HEALTHY
      hook: invocation-end
      status: SUCCEEDED
    count: 1
    after:
      - plugin: CONFPLUGIN-HEALTHY
        hook: invocation-start
        first: true
