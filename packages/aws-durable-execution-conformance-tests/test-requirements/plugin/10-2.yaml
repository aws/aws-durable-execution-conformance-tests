---
# 10.2: Plugin operation lifecycle hooks
description: Plugin operation lifecycle hooks (step start and terminal end)
handler: |
  A handler with a single step that returns a greeting string, configured with an
  instrumentation plugin. The plugin, filtering to step-type operations only, logs
  `CONFPLUGIN operation-start op=<operation_id>` from its operation-start hook and
  `CONFPLUGIN operation-end op=<operation_id> status=<status>` from its
  operation-end hook, where `<operation_id>` is the operation id received in the
  hook's info parameter (status as the operation-status enum token, e.g.
  SUCCEEDED). The logged id must equal the id the execution history checkpointed
  for the step.
invocations: |
  - Handler invokes `context.step(greet(event))`, step succeeds on first attempt.
    The plugin's operation-start hook fires when the step's STARTED checkpoint is
    observed and its operation-end hook fires when the step reaches its terminal
    SUCCEEDED status. Operation hooks may be dispatched asynchronously, so their
    relative log order is not asserted — only that each fires exactly once and
    carries the history-consistent operation id.
Variables:
  INPUT_1: ${GEN_STR:8}
Input: ${INPUT_1}
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result: Hello, ${INPUT_1}!
ExpectedExecutionHistory:
  - EventType: StepStarted
    SubType: Step
    EventId: 2
    Id: ${ID1}
    EventTimestamp: '*'
    StepStartedDetails: {}
  - EventType: StepSucceeded
    SubType: Step
    EventId: 3
    Id: ${ID1}
    EventTimestamp: '*'
    StepSucceededDetails: {}
  - EventType: InvocationCompleted
    EventId: 4
    EventTimestamp: '*'
    InvocationCompletedDetails: {}
ExpectedLogs:
  # Both operation hooks fire exactly once and carry the operation id the
  # history checkpointed (${ID1}); dispatch may be async, so no ordering
  # is asserted (no before/after)
  - match:
      message: CONFPLUGIN operation-start op=${ID1}
    count: 1
  - match:
      message: CONFPLUGIN operation-end op=${ID1} status=SUCCEEDED
    count: 1
  # The step never reaches a FAILED terminal status
  - match:
      message: CONFPLUGIN operation-end op=${ID1} status=FAILED
    count: 0
