---
id: lmi-lifecycle-11
description: Platform timeout retries preserve completed work
capability: lifecycle
mandatory: true
runtimes:
  - python
coverageProfiles:
  - python-lifecycle
requiredScenarios:
  - timeout-retry
scheduling: exclusive
minimumNativeConcurrency: 1
contract: Cross the configured platform invocation timeout and observe a service-started retry with a
  different request ID for the same durable execution. Completed successful side effects remain checkpointed
  and are not repeated. Record interrupted work per attempt without imposing exactly-once execution on
  at-least-once steps; an independently invoked replacement execution cannot satisfy retry.
limits: Budgets are explicit test configuration, not product SLAs. Do not require hard termination of
  non-cooperative I/O or exactly-once interrupted steps. Missing placement, dispatch, settlement or retirement
  evidence cannot pass.
roles:
  - victim
pythonLifecycle:
  sourceRepository: aws/aws-durable-execution-sdk-python
  sourcePullRequest: 743
  sourceRevision: 2179e011cc6a5c0d3620b11cbe8eec77ed1ff24f
  scenarios:
    - scenario: timeout-retry
      roles:
        - victim
        - retry
      minimumNativeConcurrency: 1
      exclusive: true
      sourceTests:
        - lmi_tests/tests/e2e/test_lifecycle.py::test_service_timeout_retry_does_not_repeat_completed_step
      budgetNames:
        - observationGraceMs
        - cleanupMs
        - retryMs
  otelScenarios:
    - scenario: timeout-retry
      roles:
        - victim
        - retry
      minimumNativeConcurrency: 1
      exclusive: true
      sourceTests:
        - lmi_tests/tests/e2e/test_lifecycle.py::test_service_timeout_retry_does_not_repeat_completed_step
        - lmi_tests/tests/e2e/test_observability.py::test_plugin_enabled_lifecycle_boundaries
      budgetNames:
        - observationGraceMs
        - cleanupMs
        - retryMs
        - exportMs
