---
id: lmi-lifecycle-16
description: Synchronous and bounded asynchronous export lifecycle
capability: otel
mandatory: true
runtimes:
  - javascript
  - java
  - python
coverageProfiles:
  - export-lifecycle
requiredScenarios:
  - export-success
  - export-failure-recovery
  - held-export
scheduling: per-scenario
minimumNativeConcurrency: 1
roles:
  - victim
contract: Exercise successful export, exporter failure followed by a healthy invocation, and a controlled
  held export independently with synchronous and asynchronous bounded-flush behavior. Every supported
  runtime must cover both modes in each OTel view on actual native concurrency one and two deployments.
  Prove the configured mode with queue, export, flush and wrapper-boundary observations as applicable,
  preserving invocation attribution and provider ownership. Synchronous completion evidence cannot fill
  an asynchronous-flush slot or vice versa. Use the SDK's real public instrumentation path and an
  invocation-local fixture or immutable registered variant; never change shared provider configuration
  to switch concurrent cases. These cases do not claim native overlap merely because the deployment
  allows two invocations.
limits: Declare observation, export and applicable flush budgets before admission and preserve their
  values in retained evidence. Export failure and incomplete collection remain distinct. Do not require
  unconditional telemetry delivery after timeout, exactly-once export, or one processor implementation.
  Process-wide provider faults and held exporters require exclusive resource ownership. A missing mode
  is missing coverage, not a runtime-specific exemption.
exportLifecycle:
  references:
    - https://github.com/aws/aws-durable-execution-sdk-python/pull/743
    - https://github.com/aws/aws-durable-execution-sdk-java/pull/823
  referenceScope: SDK fixture examples motivate both exporter configurations; neither mode belongs to
    one programming language and the shared contract does not depend on those implementations.
  modeBudgetNames:
    sync: []
    async-bounded-flush:
      - flushWaitMs
  scenarios:
    - scenario: export-success
      roles:
        - victim
      minimumNativeConcurrency: 1
      exclusive: false
      budgetNames:
        - observationGraceMs
        - exportCompletionMs
    - scenario: export-failure-recovery
      roles:
        - victim
        - warm
      minimumNativeConcurrency: 1
      exclusive: true
      budgetNames:
        - observationGraceMs
        - exportCompletionMs
    - scenario: held-export
      roles:
        - victim
      minimumNativeConcurrency: 1
      exclusive: true
      budgetNames:
        - observationGraceMs
        - exportCompletionMs
