---
id: lmi-lifecycle-9
description: Early completion closes losing branch scopes
capability: lifecycle
mandatory: true
runtimes:
  - python
coverageProfiles:
  - python-lifecycle
requiredScenarios:
  - early-completion-parallel
  - early-completion-map
  - early-completion-nested
scheduling: exclusive
minimumNativeConcurrency: 1
contract: For parallel, map and nested public operations configured to finish after a winning branch,
  observe the winner and controlled losing user work separately. The supported wrapper and branch cleanup
  boundaries must satisfy the declared cleanup budget before the driver releases the fault. Record actual
  task and request dispatch observations; final success alone cannot prove cleanup.
limits: Budgets are explicit test configuration, not product SLAs. Do not require hard termination of
  non-cooperative I/O or exactly-once interrupted steps. Missing placement, dispatch, settlement or retirement
  evidence cannot pass.
roles:
  - victim
pythonLifecycle:
  sourceRepository: aws/aws-durable-execution-sdk-python
  sourcePullRequest: 743
  sourceRevision: 2179e011cc6a5c0d3620b11cbe8eec77ed1ff24f
  scenarios:
    - scenario: early-completion-parallel
      roles:
        - victim
      minimumNativeConcurrency: 1
      exclusive: true
