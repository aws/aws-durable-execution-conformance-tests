---
id: lmi-lifecycle-1
description: Native overlap and execution isolation
capability: lifecycle
mandatory: true
runtimes:
  - javascript
  - java
  - python
requiredScenarios:
  - native-overlap
scheduling: shared-cohort
minimumNativeConcurrency: 2
contract: Establish overlapping distinct original requests in the runtime sharing boundary before releasing
  the bounded barrier. Check results, failures, service histories, SDK requests and invocation-owned state
  against independently captured request ownership. A replacement environment or retry is not evidence
  for the selected cohort.
limits: Budgets are agreed test configuration, not product SLAs. Hard termination of arbitrary non-cooperative
  user I/O is outside this contract. Collection and retirement must be complete; an unavailable fixture
  is NOT_IMPLEMENTED, never not applicable.
roles:
  - victim
  - peer
coverageProfiles:
  - standard
  - python-lifecycle
pythonLifecycle:
  sourceRepository: aws/aws-durable-execution-sdk-python
  sourcePullRequest: 743
  sourceRevision: 2179e011cc6a5c0d3620b11cbe8eec77ed1ff24f
  scenarios:
    - scenario: native-concurrency
      roles:
        - victim
      minimumNativeConcurrency: 1
      exclusive: true
      sourceTests:
        - lmi_tests/tests/e2e/test_lifecycle.py::test_actual_environment_process_concurrency
      budgetNames:
        - observationGraceMs
      rolesAtConcurrencyTwo:
        - victim
        - peer
      slotsAtConcurrencyTwo: 2
  otelScenarios: []
  description: Configured native worker capacity and execution isolation
  contract: Verify genuine native concurrency one and two deployments independently. Establish one original
    request per configured worker under a bounded barrier; at concurrency two require distinct worker
    processes overlapping in the same environment. Preserve the selected original requests, results and
    service histories. A single request to a concurrency-two deployment cannot replace the concurrency-one
    baseline.
