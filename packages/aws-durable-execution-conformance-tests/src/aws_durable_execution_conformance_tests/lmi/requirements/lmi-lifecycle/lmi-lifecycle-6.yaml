---
id: lmi-lifecycle-6
description: Identified warm reuse and late activity
capability: lifecycle
mandatory: true
runtimes:
  - javascript
  - java
  - python
requiredScenarios:
  - warm-reuse
scheduling: shared-cohort
minimumNativeConcurrency: 1
contract: Identify sequential reuse of the same original worker/process and observe delayed callbacks,
  requests and tasks. Attribute every late observation to its original request and execution, with no
  stale invocation state admitted into the reused worker. Retain resource ownership until late work and
  retries are quiescent.
limits: Budgets are agreed test configuration, not product SLAs. Hard termination of arbitrary non-cooperative
  user I/O is outside this contract. Collection and retirement must be complete; an unavailable fixture
  is NOT_IMPLEMENTED, never not applicable.
roles:
  - victim
  - warm
coverageProfiles:
  - standard
  - python-lifecycle
pythonLifecycle:
  sourceRepository: aws/aws-durable-execution-sdk-python
  sourcePullRequest: 743
  sourceRevision: 2179e011cc6a5c0d3620b11cbe8eec77ed1ff24f
  scenarios:
    - scenario: warm-lifecycle
      roles:
        - victim
        - warm
        - warm-2
        - warm-2-resume
        - warm-3
        - warm-4
        - warm-5
        - warm-5-resume
        - warm-6
        - warm-7
        - warm-8
        - warm-8-resume
      minimumNativeConcurrency: 1
      exclusive: true
      sourceTests:
        - lmi_tests/tests/e2e/test_lifecycle.py::test_warm_success_failure_and_suspension_cleanup
      budgetNames:
        - observationGraceMs
        - maxThreadGrowth
        - maxFdGrowth
        - maxRssGrowthBytes
  otelScenarios: []
  description: Warm success, failure and suspension resource cleanup
  contract: Exercise a repeated sequence of successful, failed and suspended/resumed public handlers.
    Identify actual process reuse and compare invocation-owned state and process resource baselines over
    the sequence. Verify branch/thread ownership and cleanup, preserving failure and replay outcomes;
    an unrelated process cannot replace the observed warm worker.
