---
id: lmi-lifecycle-5
description: Real suspension, replay and retry
capability: lifecycle
mandatory: true
runtimes:
  - javascript
  - java
  - python
requiredScenarios:
  - suspension-retry
scheduling: shared
minimumNativeConcurrency: 1
contract: Use public durable waits or callbacks to reach PENDING and resume through the service. Retain
  all attempts. Compare stable operation identity, parent/nesting and stored success/failure outcomes;
  completed bodies are skipped and observed side-effect counts match retry semantics. Preserve each language
  suspension model. Operation names remain static; run/case/cohort IDs only namespace diagnostics and
  controls.
limits: Budgets are agreed test configuration, not product SLAs. Hard termination of arbitrary non-cooperative
  user I/O is outside this contract. Collection and retirement must be complete; an unavailable fixture
  is NOT_IMPLEMENTED, never not applicable.
roles:
  - victim
  - resume
coverageProfiles:
  - standard
  - python-lifecycle
pythonLifecycle:
  sourceRepository: aws/aws-durable-execution-sdk-python
  sourcePullRequest: 743
  sourceRevision: 2179e011cc6a5c0d3620b11cbe8eec77ed1ff24f
  scenarios:
    - scenario: replay-callback-retry
      roles:
        - victim
        - resume
      minimumNativeConcurrency: 1
      exclusive: false
      sourceTests:
        - lmi_tests/tests/e2e/test_lifecycle.py::test_checkpoint_replay_callback_and_retry
      budgetNames:
        - observationGraceMs
  otelScenarios: []
  description: Callback suspension and retry preserve checkpointed work
  contract: Exercise real durable callback suspension, operation retry and stored success and failure
    results. Resume the same durable execution through the service callback path, retaining every invocation
    and checkpoint history. Completed user bodies and side effects must not repeat on replay, and retry
    effects follow the configured per-attempt contract.
