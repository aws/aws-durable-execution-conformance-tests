---
id: lmi-lifecycle-4
description: Healthy peer progress and original worker recovery
capability: lifecycle
mandatory: true
runtimes:
  - javascript
  - java
  - python
requiredScenarios:
  - peer-recovery
scheduling: exclusive
minimumNativeConcurrency: 2
contract: Select the original victim and established peer before applying a contained fault. Keep peer
  capacity occupied through the recovery measurement. Prove healthy-peer progress and the supported recovery
  policy on the original environment and worker, using actual task exit and capacity observations. Complete
  assertions before releasing the fault. Emergency cleanup, a later retry or replacement placement cannot
  satisfy recovery.
limits: Budgets are agreed test configuration, not product SLAs. Hard termination of arbitrary non-cooperative
  user I/O is outside this contract. Collection and retirement must be complete; an unavailable fixture
  is NOT_IMPLEMENTED, never not applicable.
roles:
  - victim
  - peer
  - recovery
coverageProfiles:
  - standard
  - python-lifecycle
pythonLifecycle:
  sourceRepository: aws/aws-durable-execution-sdk-python
  sourcePullRequest: 743
  sourceRevision: 2179e011cc6a5c0d3620b11cbe8eec77ed1ff24f
  scenarios:
    - scenario: deadline-recovery
      roles:
        - victim
        - recovery
      minimumNativeConcurrency: 1
      exclusive: true
      sourceTests:
        - lmi_tests/tests/e2e/test_lifecycle.py::test_invocation_deadline_isolation_and_capacity_recovery
      budgetNames:
        - observationGraceMs
        - cleanupMs
        - recoveryMs
      rolesAtConcurrencyTwo:
        - victim
        - peer
        - recovery
        - recovery-peer
      slotsAtConcurrencyTwo: 2
  otelScenarios:
    - scenario: deadline-recovery
      roles:
        - victim
        - recovery
      minimumNativeConcurrency: 1
      exclusive: true
      sourceTests:
        - lmi_tests/tests/e2e/test_lifecycle.py::test_invocation_deadline_isolation_and_capacity_recovery
        - lmi_tests/tests/e2e/test_observability.py::test_plugin_enabled_lifecycle_boundaries
      budgetNames:
        - observationGraceMs
        - cleanupMs
        - recoveryMs
        - exportMs
      rolesAtConcurrencyTwo:
        - victim
        - peer
        - recovery
        - recovery-peer
      slotsAtConcurrencyTwo: 2
  description: Deadline admission and original environment capacity recovery
  contract: Observe a real platform timeout of the original victim with controlled work in flight. At
    native concurrency two, establish a healthy peer in the same environment and verify its progress and
    successful completion. Before fault release, demand every configured worker slot in the original environment
    and prove full capacity recovers within the declared deadline-relative cleanup budget. Preserve victim
    admission and stale-side-effect assertions independently of recovery and final retirement.
