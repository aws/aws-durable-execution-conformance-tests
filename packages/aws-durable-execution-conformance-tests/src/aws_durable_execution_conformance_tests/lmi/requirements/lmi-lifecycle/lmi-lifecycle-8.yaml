---
id: lmi-lifecycle-8
description: Provider lifetime and bounded export fixtures
capability: otel
mandatory: true
runtimes:
  - javascript
  - java
  - python
requiredScenarios:
  - otel-provider
scheduling: exclusive
minimumNativeConcurrency: 2
contract: Reuse the canonical OTel model and existing backend adapters. Verify process/environment-owned
  providers and exporters survive invocation completion and identified reuse. Observe bounded flush and
  export failure fixtures without resetting another case provider. Keep expected unsampled output, exporter
  failures and absent collection distinct. No unconditional timeout delivery or exactly-once export is
  required.
limits: Budgets are agreed test configuration, not product SLAs. Hard termination of arbitrary non-cooperative
  user I/O is outside this contract. Collection and retirement must be complete; an unavailable fixture
  is NOT_IMPLEMENTED, never not applicable.
roles:
  - victim
  - peer
  - warm
coverageProfiles:
  - standard
  - python-lifecycle
pythonLifecycle:
  sourceRepository: aws/aws-durable-execution-sdk-python
  sourcePullRequest: 743
  sourceRevision: 2179e011cc6a5c0d3620b11cbe8eec77ed1ff24f
  scenarios: []
  otelScenarios:
    - scenario: export-error-recovery
      roles:
        - victim
        - warm
      minimumNativeConcurrency: 1
      exclusive: true
      sourceTests:
        - lmi_tests/tests/e2e/test_observability.py::test_export_failure_then_healthy_invocation
      budgetNames:
        - observationGraceMs
        - exportMs
    - scenario: held-export
      roles:
        - victim
      minimumNativeConcurrency: 1
      exclusive: true
      sourceTests:
        - lmi_tests/tests/e2e/test_observability.py::test_held_export_must_settle_before_successful_cleanup
      budgetNames:
        - observationGraceMs
        - exportMs
  description: Exporter failure recovery and held-export settlement
  contract: In both OTel views and both native configurations, separately observe an exporter failure
    followed by a healthy invocation and an intentionally held export. Record provider/exporter ownership
    and all export outcomes. Successful wrapper/OTel cleanup cannot precede the held export settlement;
    driver release does not turn an earlier failure or incomplete collection into a pass.
