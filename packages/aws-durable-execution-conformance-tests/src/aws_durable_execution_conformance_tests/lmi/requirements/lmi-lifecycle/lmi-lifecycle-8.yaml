---
id: lmi-lifecycle-8
description: Provider lifetime and bounded export fixtures
capability: otel
mandatory: true
runtimes:
  - javascript
  - java
  - python
requiredScenarios:
  - otel-provider
scheduling: exclusive
minimumNativeConcurrency: 2
contract: Reuse the canonical OTel model and existing backend adapters. Verify process/environment-owned
  providers and exporters survive invocation completion and identified reuse. Observe bounded flush and
  export failure fixtures without resetting another case provider. Keep expected unsampled output, exporter
  failures and absent collection distinct. No unconditional timeout delivery or exactly-once export is
  required.
limits: Budgets are agreed test configuration, not product SLAs. Hard termination of arbitrary non-cooperative
  user I/O is outside this contract. Collection and retirement must be complete; an unavailable fixture
  is NOT_IMPLEMENTED, never not applicable.
roles:
  - victim
  - peer
  - warm
