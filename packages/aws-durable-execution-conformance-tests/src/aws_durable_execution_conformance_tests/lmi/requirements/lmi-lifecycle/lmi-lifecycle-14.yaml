---
id: lmi-lifecycle-14
description: Pending waits for root cleanup before replay
capability: lifecycle
mandatory: true
runtimes:
  - python
coverageProfiles:
  - python-lifecycle
requiredScenarios:
  - pending-cleanup
scheduling: exclusive
minimumNativeConcurrency: 1
contract: Suspend through the public durable API while controlled work remains in the root cleanup path.
  Observe root-finally entry and exit, actual PENDING wrapper completion, service resume and stable checkpoint
  history. The wrapper must honor the supported scope-cleanup boundary and replay must not repeat the
  completed operation body. Native concurrency two includes an established healthy peer.
limits: Budgets are explicit test configuration, not product SLAs. Do not require hard termination of
  non-cooperative I/O or exactly-once interrupted steps. Missing placement, dispatch, settlement or retirement
  evidence cannot pass.
roles:
  - victim
pythonLifecycle:
  sourceRepository: aws/aws-durable-execution-sdk-python
  sourcePullRequest: 743
  sourceRevision: 2179e011cc6a5c0d3620b11cbe8eec77ed1ff24f
  scenarios:
    - scenario: pending-cleanup
      roles:
        - victim
        - resume
      minimumNativeConcurrency: 1
      exclusive: true
      sourceTests:
        - lmi_tests/tests/e2e/test_lifecycle.py::test_pending_waits_for_root_finally_and_then_replays
      budgetNames:
        - observationGraceMs
      rolesAtConcurrencyTwo:
        - victim
        - resume
        - peer
      slotsAtConcurrencyTwo: 2
  otelScenarios:
    - scenario: pending-cleanup
      roles:
        - victim
        - resume
      minimumNativeConcurrency: 1
      exclusive: true
      sourceTests:
        - lmi_tests/tests/e2e/test_lifecycle.py::test_pending_waits_for_root_finally_and_then_replays
        - lmi_tests/tests/e2e/test_observability.py::test_plugin_enabled_lifecycle_boundaries
      budgetNames:
