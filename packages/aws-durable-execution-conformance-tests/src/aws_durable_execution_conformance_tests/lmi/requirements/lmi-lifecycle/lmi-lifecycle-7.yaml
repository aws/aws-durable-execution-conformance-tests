---
id: lmi-lifecycle-7
description: Failure and disposal
scenario: normal-failure
scheduling: shared
minimumNativeConcurrency: 1
contract: Observe root completion and actual wrapper return independently for failing handlers.
  For the selected invocation, require a rejected checkpoint probe at or after actual wrapper return,
  and verify no SDK request is dispatched at or after the invocation's first closure. At actual wrapper
  return, an operation probe is optional diagnostic evidence and may be accepted or rejected. This does
  not relax admission at an earlier close or a raised wrapper exit. Previously dispatched I/O need
  not be forcibly terminated.
limits: Budgets are agreed test configuration, not product SLAs. Hard termination of arbitrary non-cooperative
  user I/O is outside this contract. Collection and retirement must be complete; an unavailable fixture
  is NOT_IMPLEMENTED, never not applicable.
roles:
  - victim
