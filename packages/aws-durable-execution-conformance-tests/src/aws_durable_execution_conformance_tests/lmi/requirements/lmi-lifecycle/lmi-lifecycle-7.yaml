---
id: lmi-lifecycle-7
description: Failure and disposal
scenario: normal-failure
scheduling: shared
minimumNativeConcurrency: 1
contract: Observe root completion and actual wrapper return independently for failing handlers.
  Probe operation admission after the wrapper closes and observe SDK request dispatch separately. Closed
  invocations admit no new durable work or checkpoint dispatch. Previously dispatched I/O need not be
  forcibly terminated.
limits: Budgets are agreed test configuration, not product SLAs. Hard termination of arbitrary non-cooperative
  user I/O is outside this contract. Collection and retirement must be complete; an unavailable fixture
  is NOT_IMPLEMENTED, never not applicable.
roles:
  - victim
