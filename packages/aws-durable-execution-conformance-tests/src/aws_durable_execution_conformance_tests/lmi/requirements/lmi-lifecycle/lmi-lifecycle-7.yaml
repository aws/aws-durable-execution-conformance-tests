---
id: lmi-lifecycle-7
description: LMI OTel attribution and genuine runtime carriers
capability: otel
mandatory: true
runtimes:
  - javascript
  - java
  - python
requiredScenarios:
  - otel-attribution
scheduling: shared-cohort
minimumNativeConcurrency: 2
contract: Reuse existing Invocation and Execution view validators against unfiltered cohort spans before
  execution filtering. Prove attribution during overlap and warm reuse, preserving healthy peers. Capture
  the genuine runtime Root/Parent/Sampled carrier at entry and preserve it through worker dispatch. Label
  injected missing, empty, malformed and compatibility carriers separately. Explicit unsampled expectations
  cannot stand in for missing collection.
limits: Budgets are agreed test configuration, not product SLAs. Hard termination of arbitrary non-cooperative
  user I/O is outside this contract. Collection and retirement must be complete; an unavailable fixture
  is NOT_IMPLEMENTED, never not applicable.
roles:
  - victim
  - peer
  - warm
coverageProfiles:
  - standard
  - python-lifecycle
pythonLifecycle:
  sourceRepository: aws/aws-durable-execution-sdk-python
  sourcePullRequest: 743
  sourceRevision: 2179e011cc6a5c0d3620b11cbe8eec77ed1ff24f
  scenarios: []
  otelScenarios:
    - scenario: runtime-carrier-sampled
      roles:
        - victim
      minimumNativeConcurrency: 1
      exclusive: false
      sourceTests:
        - lmi_tests/tests/e2e/test_observability.py::test_native_runtime_carrier_and_sampling
      budgetNames:
        - observationGraceMs
        - exportMs
    - scenario: runtime-carrier-unsampled
      roles:
        - victim
      minimumNativeConcurrency: 1
      exclusive: false
      sourceTests:
        - lmi_tests/tests/e2e/test_observability.py::test_native_runtime_carrier_and_sampling
      budgetNames:
        - observationGraceMs
        - exportMs
    - scenario: otel-warm-lifecycle
      roles:
        - victim
        - warm-1
        - warm-2
        - warm-2-resume
        - warm-3
        - warm-4
        - warm
        - warm-resume
      minimumNativeConcurrency: 1
      exclusive: true
      sourceTests:
        - lmi_tests/tests/e2e/test_observability.py::test_warm_process_cleanup_and_replay
      budgetNames:
        - observationGraceMs
        - exportMs
    - scenario: otel-concurrent
      roles:
        - victim
      minimumNativeConcurrency: 1
      exclusive: true
      sourceTests:
        - lmi_tests/tests/e2e/test_observability.py::test_concurrent_worker_attribution_and_peer_end
      budgetNames:
        - observationGraceMs
        - exportMs
      rolesAtConcurrencyTwo:
        - victim
        - peer
      slotsAtConcurrencyTwo: 2
  description: Runtime carriers, warm telemetry and native worker attribution
  contract: In both OTel views and both native configurations, separately verify genuine sampled and unsampled
    runtime carriers, identified warm success/failure/replay, and one original request per configured
    worker. Preserve caller Root and sampling correlation and execution attribution. At concurrency two,
    ending one request must not end a held healthy peer; controlled malformed or missing-carrier unit
    fixtures cannot substitute for native runtime evidence.
