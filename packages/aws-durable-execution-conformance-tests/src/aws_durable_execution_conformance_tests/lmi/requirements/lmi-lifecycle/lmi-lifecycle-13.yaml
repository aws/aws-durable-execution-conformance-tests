  sourceRevision: 2179e011cc6a5c0d3620b11cbe8eec77ed1ff24f
  scenarios:
    - scenario: return-inflight
      roles:
        - victim
      minimumNativeConcurrency: 1
      exclusive: true
      sourceTests:
        - lmi_tests/tests/e2e/test_lifecycle.py::test_root_return_or_failure_settles_inflight_work
      budgetNames:
        - observationGraceMs
      rolesAtConcurrencyTwo:
