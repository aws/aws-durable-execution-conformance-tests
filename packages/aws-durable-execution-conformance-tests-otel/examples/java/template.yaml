AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Java SDK examples for the durable execution OTel conformance suite

Parameters:
  LambdaExecutionRoleArn:
    Type: String
    Description: Pre-created execution role for the test functions
  OtelSuite:
    Type: String
    Default: all
    AllowedValues:
      - all
      - otel-invocation
      - otel-execution
    Description: OpenTelemetry view whose functions should be deployed
  OtelLayerArn:
    Type: String
    Description: AWSOpenTelemetryDistroJava Lambda layer
  OtelCollectorLayerArn:
    Type: String
    Default: ""
    Description: Optional OpenTelemetry Collector Lambda extension layer
  OtelCollectorBucket:
    Type: String
    Default: ""
    Description: S3 bucket where the collector writes OTLP trace objects
  OtelCollectorPrefix:
    Type: String
    Default: ""
    Description: S3 key prefix where the collector writes OTLP trace objects
  OtelExecWrapper:
    Type: String
    Default: /opt/otel-instrument
    Description: OpenTelemetry Java agent execution wrapper
  OtelServiceName:
    Type: String
    Default: durable-execution-conformance
    Description: OpenTelemetry resource service name
  OtelTracesExporter:
    Type: String
    Default: otlp
    Description: OpenTelemetry traces exporter selected by the runner
  OtelExporterEndpoint:
    Type: String
    Default: ""
    Description: Non-secret OTLP endpoint used by community exporters
  OtelExporterHeaders:
    Type: String
    Default: ""
    NoEcho: true
    Description: Secret OTLP exporter headers supplied by the runner
  OtelSecretEnvironmentNames:
    Type: String
    Default: ""
    Description: Comma-separated secret environment variable names

Conditions:
  HasOtelCollectorLayer: !Not [!Equals [!Ref OtelCollectorLayerArn, ""]]
  HasOtelExporterEndpoint: !Not [!Equals [!Ref OtelExporterEndpoint, ""]]
  HasOtelExporterHeaders: !Not [!Equals [!Ref OtelExporterHeaders, ""]]
  DeployInvocationView: !Or
    - !Equals [!Ref OtelSuite, all]
    - !Equals [!Ref OtelSuite, otel-invocation]
  DeployExecutionView: !Or
    - !Equals [!Ref OtelSuite, all]
    - !Equals [!Ref OtelSuite, otel-execution]

Globals:
  Function:
    Runtime: java21
    Architectures:
      - x86_64
    Timeout: 60
    MemorySize: 1024
    Tracing: Active
    Layers: !If
      - HasOtelCollectorLayer
      - [!Ref OtelLayerArn, !Ref OtelCollectorLayerArn]
      - [!Ref OtelLayerArn]
    DurableConfig:
      ExecutionTimeout: 300
      RetentionPeriodInDays: 1
    Environment:
      Variables:
        AWS_LAMBDA_EXEC_WRAPPER: !Ref OtelExecWrapper
        JAVA_TOOL_OPTIONS: "-Dotel.javaagent.extensions=/var/task/lib/otel-plugin-extension.jar"
        OTEL_JAVAAGENT_EXTENSIONS: /var/task/lib/otel-plugin-extension.jar
        OTEL_SERVICE_NAME: !Ref OtelServiceName
        OTEL_TRACES_EXPORTER: !Ref OtelTracesExporter
        OTEL_EXPORTER_OTLP_ENDPOINT: !If
          - HasOtelExporterEndpoint
          - !Ref OtelExporterEndpoint
          - !Ref "AWS::NoValue"
        OTEL_EXPORTER_OTLP_HEADERS: !If
          - HasOtelExporterHeaders
          - !Ref OtelExporterHeaders
          - !Ref "AWS::NoValue"
        OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
        OTEL_PLUGIN_MODE: invocation
        OTEL_PROPAGATORS: xray
        OTEL_S3_BUCKET: !Ref OtelCollectorBucket
        OTEL_S3_PREFIX: !Ref OtelCollectorPrefix
        OPENTELEMETRY_COLLECTOR_CONFIG_URI: !If
          - HasOtelCollectorLayer
          - /opt/collector-config/config-s3.yaml
          - !Ref "AWS::NoValue"

Resources:
  Otel1Success:
    Type: AWS::Serverless::Function
    Condition: DeployInvocationView
    TestingMetadata:
      TestDescription:
        - otel-invocation-1
    Properties:
      CodeUri: .
      Handler: software.amazon.lambda.durable.conformance.otel.Otel1Success
      FunctionName: !Sub "${AWS::StackName}-otel-invocation-1"
      Role: !Ref LambdaExecutionRoleArn

