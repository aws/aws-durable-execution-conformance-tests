description: OpenTelemetry emits complete chained-invoke failure telemetry
Input:
  scenario: chained-invoke-failure
AsyncInvoke: true
ExpectedExecutionHistory:
  - EventId: 1
    EventType: ExecutionStarted
  - EventId: 2
    EventType: ChainedInvokeStarted
    SubType: ChainedInvoke
    Id: ${FAILED_INVOKE}
    Name: otel-failed-invoke
    ChainedInvokeStartedDetails:
      DurableExecutionArn: ${TARGET_EXECUTION_ARN}
  - EventId: 4
    EventType: ChainedInvokeFailed
    SubType: ChainedInvoke
    Id: ${FAILED_INVOKE}
    Name: otel-failed-invoke
ExpectedResult:
  ExecutionStatus: FAILED
TelemetryAssertions:
  minimum_spans: 7
  minimum_invocations: 3
  require_execution_correlation: true
  require_single_trace_per_execution: true
  require_parented_spans:
    - name: Workflow
    - name: Invocation
  require_unique_root_per_trace: true
  allowed_execution_arns:
    - ${EXECUTION_ARN}
    - ${TARGET_EXECUTION_ARN}
  require_all_spans: true
  span_assertion_scope:
    - attributes:
        durable.execution.arn: ${EXECUTION_ARN}
    - attributes:
        durable.execution.arn: ${TARGET_EXECUTION_ARN}
  exact_attribute_prefixes:
    - durable.
  span_assertions:
    - select:
        name: Workflow
        status: ERROR
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
      expect:
        parent:
          $allow_unresolved: true
          $allow_outside: true
          name: "Durable Execution Attempt #1"
        status: ERROR
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.execution.status: FAILED
    - select:
        name: Workflow
        status: ERROR
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
      expect:
        parent:
          $allow_unresolved: true
          $allow_outside: true
          name: "Durable Execution Attempt #1"
        status: ERROR
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.execution.status: FAILED
    - select:
        name: Invocation
        status: OK
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
        before:
          name: Invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: FAILED
    - select:
        name: Invocation
        status: ERROR
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: FAILED
      expect:
        status: ERROR
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: FAILED
        after:
          name: Invocation
          attributes:
            durable.execution.arn: ${TARGET_EXECUTION_ARN}
            durable.invocation.first: true
            durable.invocation.status: FAILED
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: FAILED
      expect:
        status: ERROR
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: FAILED
        before:
          name: Invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: FAILED
    - select:
        name: otel-failed-invoke
        attributes:
          durable.operation.status: STARTED
      expect:
        status: UNSET
        service_name: ${SERVICE_NAME}
        links:
          - name: Workflow
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${FAILED_INVOKE}
          durable.operation.type: CHAINED_INVOKE
          durable.operation.subtype: ChainedInvoke
          durable.operation.status: STARTED
          durable.operation.name: otel-failed-invoke
        before:
          name: otel-failed-invoke
          attributes:
            durable.operation.status: FAILED
        parent:
          name: Invocation
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
    - select:
        name: otel-failed-invoke
        attributes:
          durable.operation.status: FAILED
      expect:
        status: ERROR
        service_name: ${SERVICE_NAME}
        links:
          - name: otel-failed-invoke
            attributes:
              durable.operation.id: ${FAILED_INVOKE}
          - name: Workflow
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${FAILED_INVOKE}
          durable.operation.type: CHAINED_INVOKE
          durable.operation.subtype: ChainedInvoke
          durable.operation.status: FAILED
          durable.operation.name: otel-failed-invoke
        after:
          name: otel-failed-invoke
          attributes:
            durable.operation.status: STARTED
        parent:
          name: Invocation
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
