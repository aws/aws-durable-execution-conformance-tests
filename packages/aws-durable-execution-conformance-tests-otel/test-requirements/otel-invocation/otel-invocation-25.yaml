---
description: Invocation view keeps a caught errorless callback failure ERROR through
  replay while the workflow succeeds
Input:
  scenario: caught-callback-failure-replay
AsyncInvoke: true
CallbackActions:
  - CallbackName: '${/^otel-failed-callback(?: create callback id|-callback)?$/}'
    Operation: failure
    AfterInvocationCompleted: true
  - CallbackName: '${/^otel-failed-callback-barrier-one(?: create callback id|-callback)?$/}'
    Operation: success
    Payload: one
    AfterInvocationCompleted: true
  - CallbackName: '${/^otel-failed-callback-barrier-two(?: create callback id|-callback)?$/}'
    Operation: success
    Payload: two
    AfterInvocationCompleted: true
ExpectedExecutionHistory:
  - EventId: 1
    EventType: ExecutionStarted
  - EventId: 2
    EventType: ContextStarted
    SubType: WaitForCallback
    Id: ${FAILED_CALLBACK_CONTEXT}
    Name: otel-failed-callback
  - EventId: 3
    EventType: CallbackStarted
    SubType: Callback
    Id: ${FAILED_CALLBACK}
    ParentId: ${FAILED_CALLBACK_CONTEXT}
    Name: '${/^otel-failed-callback(?: create callback id|-callback)?$/}'
  - EventId: 4
    EventType: StepStarted
    SubType: Step
    Id: ${CALLBACK_SUBMITTER}
    ParentId: ${FAILED_CALLBACK_CONTEXT}
    Name: '${/^otel-failed-callback(?: submitter|-submitter)?$/}'
  - EventId: 5
    EventType: StepSucceeded
    SubType: Step
    Id: ${CALLBACK_SUBMITTER}
    ParentId: ${FAILED_CALLBACK_CONTEXT}
    Name: '${/^otel-failed-callback(?: submitter|-submitter)?$/}'
  - EventId: 6
    EventType: InvocationCompleted
  - EventId: 7
    EventType: CallbackFailed
    SubType: Callback
    Id: ${FAILED_CALLBACK}
    ParentId: ${FAILED_CALLBACK_CONTEXT}
    $absent:
      - [CallbackFailedDetails, Error, Payload, ErrorType]
      - [CallbackFailedDetails, Error, Payload, ErrorMessage]
      - [CallbackFailedDetails, Error, Payload, ErrorData]
      - [CallbackFailedDetails, Error, Payload, StackTrace]
    CallbackFailedDetails:
      Error:
        Payload: ${/^\{\}$/}
        Truncated: false
  - EventId: 8
    EventType: ContextFailed
    SubType: WaitForCallback
    Id: ${FAILED_CALLBACK_CONTEXT}
    Name: otel-failed-callback
  - EventId: 9
    EventType: StepStarted
    SubType: Step
    Id: ${FAILED_CALLBACK_OBSERVED}
    Name: otel-failed-callback-observed
  - EventId: 10
    EventType: StepSucceeded
    SubType: Step
    Id: ${FAILED_CALLBACK_OBSERVED}
    Name: otel-failed-callback-observed
  - EventId: 11
    EventType: ContextStarted
    SubType: WaitForCallback
    Id: ${BARRIER_ONE_CONTEXT}
    Name: otel-failed-callback-barrier-one
  - EventId: 12
    EventType: CallbackStarted
    SubType: Callback
    Id: ${BARRIER_ONE_CALLBACK}
    ParentId: ${BARRIER_ONE_CONTEXT}
  - EventId: 13
    EventType: StepStarted
    SubType: Step
    Id: ${BARRIER_ONE_SUBMITTER}
    ParentId: ${BARRIER_ONE_CONTEXT}
  - EventId: 14
    EventType: StepSucceeded
    SubType: Step
    Id: ${BARRIER_ONE_SUBMITTER}
    ParentId: ${BARRIER_ONE_CONTEXT}
  - EventId: 15
    EventType: InvocationCompleted
  - EventId: 16
    EventType: CallbackSucceeded
    SubType: Callback
    Id: ${BARRIER_ONE_CALLBACK}
    ParentId: ${BARRIER_ONE_CONTEXT}
  - EventId: 17
    EventType: ContextSucceeded
    SubType: WaitForCallback
    Id: ${BARRIER_ONE_CONTEXT}
    Name: otel-failed-callback-barrier-one
  - EventId: 18
    EventType: ContextStarted
    SubType: WaitForCallback
    Id: ${BARRIER_TWO_CONTEXT}
    Name: otel-failed-callback-barrier-two
  - EventId: 19
    EventType: CallbackStarted
    SubType: Callback
    Id: ${BARRIER_TWO_CALLBACK}
    ParentId: ${BARRIER_TWO_CONTEXT}
  - EventId: 20
    EventType: StepStarted
    SubType: Step
    Id: ${BARRIER_TWO_SUBMITTER}
    ParentId: ${BARRIER_TWO_CONTEXT}
  - EventId: 21
    EventType: StepSucceeded
    SubType: Step
    Id: ${BARRIER_TWO_SUBMITTER}
    ParentId: ${BARRIER_TWO_CONTEXT}
  - EventId: 22
    EventType: InvocationCompleted
  - EventId: 23
    EventType: CallbackSucceeded
    SubType: Callback
    Id: ${BARRIER_TWO_CALLBACK}
    ParentId: ${BARRIER_TWO_CONTEXT}
  - EventId: 24
    EventType: ContextSucceeded
    SubType: WaitForCallback
    Id: ${BARRIER_TWO_CONTEXT}
    Name: otel-failed-callback-barrier-two
  - EventId: 25
    EventType: InvocationCompleted
  - EventId: 26
    EventType: ExecutionSucceeded
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result: caught/one/two
TelemetryAssertions:
  quiescence_seconds: 5
  minimum_spans: 25
  minimum_invocations: 4
  require_execution_correlation: true
  require_single_trace_per_execution: true
  require_parented_spans:
    - name: Workflow
    - name: Invocation
  require_unique_root_per_trace: true
  require_all_spans: true
  span_assertion_scope:
    attributes:
      durable.execution.arn: ${EXECUTION_ARN}
  exact_attribute_prefixes: [durable.]
  span_assertions:
    - select:
        name: Workflow
        status: OK
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
      expect:
        parent:
          $allow_unresolved: true
          $allow_outside: true
          $reject_sdk_span: true
        status: OK
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.execution.status: SUCCEEDED
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
      count: 4
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
      expect_by_occurrence:
        - attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: true
            durable.invocation.status: PENDING
          before:
            name: otel-failed-callback-observed attempt 1
            attributes:
              durable.operation.id: ${FAILED_CALLBACK_OBSERVED}
        - attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: PENDING
        - attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: PENDING
          after:
            name: otel-failed-callback-observed attempt 1
            attributes:
              durable.operation.id: ${FAILED_CALLBACK_OBSERVED}
        - attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: SUCCEEDED
          after:
            name: otel-failed-callback-observed attempt 1
            attributes:
              durable.operation.id: ${FAILED_CALLBACK_OBSERVED}
    - select:
        name: otel-failed-callback
        attributes:
          durable.operation.status: STARTED
      expect:
        status: UNSET
        service_name: ${SERVICE_NAME}
        links:
          - name: Workflow
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${FAILED_CALLBACK_CONTEXT}
          durable.operation.type: CONTEXT
          durable.operation.subtype: WaitForCallback
          durable.operation.status: STARTED
          durable.operation.name: otel-failed-callback
        before:
          name: otel-failed-callback
          attributes:
            durable.operation.status: FAILED
        parent:
          $occurrence: 1
          name: Invocation
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
    - select:
        name: otel-failed-callback
        attributes:
          durable.operation.status: FAILED
      expect:
        service_name: ${SERVICE_NAME}
        links:
          - $occurrence: 1
            name: otel-failed-callback
            attributes:
              durable.operation.id: ${FAILED_CALLBACK_CONTEXT}
          - name: Workflow
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${FAILED_CALLBACK_CONTEXT}
          durable.operation.type: CONTEXT
          durable.operation.subtype: WaitForCallback
          durable.operation.status: FAILED
          durable.operation.name: otel-failed-callback
        after:
          name: otel-failed-callback
          attributes:
            durable.operation.status: STARTED
        parent:
          name: Invocation
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
          $occurrence: 2
        before:
          name: otel-failed-callback-observed attempt 1
          attributes:
            durable.operation.id: ${FAILED_CALLBACK_OBSERVED}
        status: ERROR
    - select:
        name: '${/^(?:otel-failed-callback(?: create callback id|-callback)|CALLBACK)$/}'
        attributes:
          durable.operation.status: STARTED
          durable.operation.id: ${FAILED_CALLBACK}
      expect:
        status: UNSET
        service_name: ${SERVICE_NAME}
        links:
          - name: Workflow
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${FAILED_CALLBACK}
          durable.operation.type: CALLBACK
          durable.operation.subtype: Callback
          durable.operation.status: STARTED
          durable.operation.name: '${/^otel-failed-callback(?: create callback id|-callback)$/}'
        before:
          name: '${/^(?:otel-failed-callback(?: create callback id|-callback)|CALLBACK)$/}'
          attributes:
            durable.operation.status: FAILED
            durable.operation.id: ${FAILED_CALLBACK}
        parent:
          name: otel-failed-callback
          kind: INTERNAL
          attributes:
            durable.operation.id: ${FAILED_CALLBACK_CONTEXT}
            durable.operation.status: STARTED
        descendant_of:
          name: Invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
          $occurrence: 1
    - select:
        name: '${/^(?:otel-failed-callback(?: create callback id|-callback)|CALLBACK)$/}'
        attributes:
          durable.operation.status: FAILED
          durable.operation.id: ${FAILED_CALLBACK}
      expect:
        status: ERROR
        service_name: ${SERVICE_NAME}
        links:
          - $occurrence: 1
            name: '${/^(?:otel-failed-callback(?: create callback id|-callback)|CALLBACK)$/}'
            attributes:
              durable.operation.id: ${FAILED_CALLBACK}
          - name: Workflow
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${FAILED_CALLBACK}
          durable.operation.type: CALLBACK
          durable.operation.subtype: Callback
          durable.operation.status: FAILED
          durable.operation.name: '${/^otel-failed-callback(?: create callback id|-callback)$/}'
        after:
          name: '${/^(?:otel-failed-callback(?: create callback id|-callback)|CALLBACK)$/}'
          attributes:
            durable.operation.status: STARTED
            durable.operation.id: ${FAILED_CALLBACK}
        parent:
          name: otel-failed-callback
          kind: INTERNAL
          attributes:
            durable.operation.id: ${FAILED_CALLBACK_CONTEXT}
            durable.operation.status: FAILED
        before:
          name: otel-failed-callback-observed attempt 1
          attributes:
            durable.operation.id: ${FAILED_CALLBACK_OBSERVED}
        descendant_of:
          name: Invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
