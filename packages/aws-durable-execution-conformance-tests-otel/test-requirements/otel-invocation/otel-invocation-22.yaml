description: Invocation view supplies and restores user-function span context across concurrent branches and resume
Input:
  scenario: user-function-context
AsyncInvoke: true
ExpectedExecutionHistory:
  - EventId: 1
    EventType: ExecutionStarted
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result: context-complete
TelemetryAssertions:
  minimum_spans: 20
  minimum_invocations: 2
  require_execution_correlation: true
  require_single_trace_per_execution: true
  require_parented_spans:
    - name: Workflow
    - name: Invocation
  require_unique_root_per_trace: true
  span_assertion_scope:
    attributes:
      durable.execution.arn: ${EXECUTION_ARN}
  span_assertions:
    - select:
        name: Workflow
        status: OK
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
      expect:
        parent:
          $allow_unresolved: true
          $allow_outside: true
          $reject_sdk_span: true
        status: OK
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.execution.status: SUCCEEDED
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
        before:
          name: Invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: SUCCEEDED
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
        after:
          name: Invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: true
            durable.invocation.status: PENDING
    - select:
        name: conformance.handler
        attributes:
          conformance.callback: handler
      expect:
        status: UNSET
        kind: INTERNAL
        service_name: ${SERVICE_NAME}
        attributes:
          conformance.callback: handler
        same_trace_as:
          name: Workflow
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
        parent:
          $any_of:
            - name: Invocation
              attributes:
                durable.execution.arn: ${EXECUTION_ARN}
              $millisecond_precision: true
            - $reject_sdk_span: true
              $allow_unresolved: true
              $millisecond_precision: true
              $not:
                attributes:
                  conformance.callback: '*'
      count: 2
      expect_by_occurrence:
        - inside:
            name: Invocation
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
              durable.invocation.first: true
            $millisecond_precision: true
        - inside:
            name: Invocation
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
              durable.invocation.first: false
            $millisecond_precision: true
    - select:
        name: conformance.step
        attributes:
          conformance.callback: step
      expect:
        status: UNSET
        kind: INTERNAL
        service_name: ${SERVICE_NAME}
        attributes:
          conformance.callback: step
        same_trace_as:
          name: Workflow
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
        parent:
          name: otel-context-step attempt 1
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
          $millisecond_precision: true
    - select:
