description: OpenTelemetry emits complete external callback failure telemetry
Input:
  scenario: wait-for-callback-failure
AsyncInvoke: true
CallbackActions:
  - CallbackName: "${/^otel-failed-callback(?: create callback id|-callback)?$/}"
    Operation: failure
    Payload:
      ErrorType: RejectedError
      ErrorMessage: Intentional callback failure
    Delay: 1
ExpectedExecutionHistory:
  - EventId: 1
    EventType: ExecutionStarted
  - EventId: 2
    EventType: ContextStarted
    SubType: WaitForCallback
    Id: ${FAILED_CALLBACK_CONTEXT}
    Name: otel-failed-callback
  - EventId: 3
    EventType: CallbackStarted
    SubType: Callback
    Id: ${FAILED_CALLBACK}
    ParentId: ${FAILED_CALLBACK_CONTEXT}
    Name: "${/^otel-failed-callback(?: create callback id|-callback)?$/}"
  - EventId: 4
    EventType: StepStarted
    SubType: Step
    Id: ${CALLBACK_SUBMITTER}
    ParentId: ${FAILED_CALLBACK_CONTEXT}
    Name: "${/^otel-failed-callback(?: submitter|-submitter)?$/}"
  - EventId: 5
    EventType: StepSucceeded
    SubType: Step
    Id: ${CALLBACK_SUBMITTER}
    ParentId: ${FAILED_CALLBACK_CONTEXT}
    Name: "${/^otel-failed-callback(?: submitter|-submitter)?$/}"
  - EventId: 8
    EventType: ContextFailed
    SubType: WaitForCallback
    Id: ${FAILED_CALLBACK_CONTEXT}
    Name: otel-failed-callback
ExpectedResult:
  ExecutionStatus: FAILED
TelemetryAssertions:
  minimum_spans: 10
  minimum_invocations: 2
  require_execution_correlation: true
  require_all_spans: true
  span_assertion_scope:
    attributes:
      durable.execution.arn: ${EXECUTION_ARN}
  exact_attribute_prefixes:
    - durable.
  span_assertions:
    - select:
        name: Workflow
        status: ERROR
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
      expect:
        parent_span_id: null
        status: ERROR
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.execution.status: FAILED
    - select:
        name: Invocation
        status: OK
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
        before:
          name: Invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: FAILED
    - select:
        name: Invocation
        status: ERROR
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: FAILED
      expect:
        status: ERROR
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: FAILED
        after:
          name: Invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: true
            durable.invocation.status: PENDING
    - select:
        name: otel-failed-callback
        status: UNSET
      expect:
        status: UNSET
        service_name: ${SERVICE_NAME}
        links:
          - name: Workflow
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${FAILED_CALLBACK_CONTEXT}
          durable.operation.type: CONTEXT
          durable.operation.subtype: WaitForCallback
          durable.operation.status: STARTED
          durable.operation.name: otel-failed-callback
        before:
          name: otel-failed-callback
          status: ERROR
        parent:
          name: Invocation
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
    - select:
        name: otel-failed-callback
        status: ERROR
      expect:
        status: ERROR
        service_name: ${SERVICE_NAME}
        links:
          - name: otel-failed-callback
            attributes:
              durable.operation.id: ${FAILED_CALLBACK_CONTEXT}
          - name: Workflow
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${FAILED_CALLBACK_CONTEXT}
          durable.operation.type: CONTEXT
          durable.operation.subtype: WaitForCallback
          durable.operation.status: FAILED
          durable.operation.name: otel-failed-callback
        after:
          name: otel-failed-callback
          status: UNSET
        parent:
          name: Invocation
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
    - select:
        name: "${/^(?:otel-failed-callback(?: create callback id|-callback)|CALLBACK)$/}"
        attributes:
          durable.operation.status: STARTED
      expect:
        status: UNSET
        service_name: ${SERVICE_NAME}
        links:
          - name: Workflow
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${FAILED_CALLBACK}
          durable.operation.type: CALLBACK
          durable.operation.subtype: Callback
          durable.operation.status: STARTED
          durable.operation.name: "${/^otel-failed-callback(?: create callback id|-callback)?$/}"
        before:
          name: "${/^(?:otel-failed-callback(?: create callback id|-callback)|CALLBACK)$/}"
          attributes:
            durable.operation.status: FAILED
        parent:
          name: otel-failed-callback
          kind: INTERNAL
          attributes:
            durable.operation.id: ${FAILED_CALLBACK_CONTEXT}
    - select:
        name: "${/^(?:otel-failed-callback(?: create callback id|-callback)|CALLBACK)$/}"
        attributes:
          durable.operation.status: FAILED
      expect:
        status: ERROR
        service_name: ${SERVICE_NAME}
        links:
          - name: "${/^(?:otel-failed-callback(?: create callback id|-callback)|CALLBACK)$/}"
            attributes:
              durable.operation.id: ${FAILED_CALLBACK}
          - name: Workflow
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${FAILED_CALLBACK}
          durable.operation.type: CALLBACK
          durable.operation.subtype: Callback
          durable.operation.status: FAILED
          durable.operation.name: "${/^otel-failed-callback(?: create callback id|-callback)?$/}"
        after:
          name: "${/^(?:otel-failed-callback(?: create callback id|-callback)|CALLBACK)$/}"
          attributes:
            durable.operation.status: STARTED
        parent:
          name: otel-failed-callback
          kind: INTERNAL
          attributes:
            durable.operation.id: ${FAILED_CALLBACK_CONTEXT}
    - select:
        name: "${/^(?:otel-failed-callback(?: submitter|-submitter)|STEP)$/}"
        status: OK
        attributes:
          durable.operation.status: SUCCEEDED
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links:
          - name: Workflow
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${CALLBACK_SUBMITTER}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.status: SUCCEEDED
          durable.operation.name: "${/^otel-failed-callback(?: submitter|-submitter)?$/}"
          durable.attempt.number: 1
        parent:
          name: otel-failed-callback
          status: UNSET
          kind: INTERNAL
          attributes:
            durable.operation.id: ${FAILED_CALLBACK_CONTEXT}
    - select:
        name: "${/^(?:otel-failed-callback(?: submitter|-submitter)|STEP) attempt 1$/}"
        attributes:
          durable.attempt.outcome: SUCCEEDED
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links:
          - name: Workflow
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${CALLBACK_SUBMITTER}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.name: "${/^otel-failed-callback(?: submitter|-submitter)?$/}"
          durable.attempt.number: 1
          durable.attempt.outcome: SUCCEEDED
        parent:
          name: "${/^(?:otel-failed-callback(?: submitter|-submitter)|STEP)$/}"
          kind: INTERNAL
          attributes:
            durable.operation.id: ${CALLBACK_SUBMITTER}
            durable.operation.type: STEP
            durable.operation.subtype: Step
