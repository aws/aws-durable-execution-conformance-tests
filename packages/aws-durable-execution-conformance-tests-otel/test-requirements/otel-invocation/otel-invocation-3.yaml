description: OpenTelemetry emits every failed and successful retry attempt across invocations
Input:
  scenario: retry
AsyncInvoke: true
ExpectedExecutionHistory:
  - EventId: 1
    EventType: ExecutionStarted
  - EventId: 2
    EventType: StepStarted
    SubType: Step
    Id: ${RETRY_STEP}
    Name: otel-retry
  - EventId: 3
    EventType: StepFailed
    SubType: Step
    Id: ${RETRY_STEP}
    Name: otel-retry
  - EventId: 5
    EventType: StepStarted
    SubType: Step
    Id: ${RETRY_STEP}
    Name: otel-retry
  - EventId: 6
    EventType: StepSucceeded
    SubType: Step
    Id: ${RETRY_STEP}
    Name: otel-retry
ExpectedResult:
  ExecutionStatus: SUCCEEDED
TelemetryAssertions:
  minimum_spans: 7
  minimum_invocations: 2
  require_execution_correlation: true
  require_single_trace_per_execution: true
  require_parented_spans:
    - name: Workflow
    - name: Invocation
  require_unique_root_per_trace: true
  require_all_spans: true
  span_assertion_scope:
    attributes:
      durable.execution.arn: ${EXECUTION_ARN}
  exact_attribute_prefixes:
    - durable.
  span_assertions:
    - select:
        name: Workflow
        status: OK
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
      expect:
        parent:
          $allow_unresolved: true
          $allow_outside: true
          name: "Durable Execution Attempt #1"
        status: OK
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.execution.status: SUCCEEDED
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
        before:
          name: Invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: SUCCEEDED
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
        after:
          name: Invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: true
            durable.invocation.status: PENDING
    - select:
        name: otel-retry
        attributes:
          durable.operation.status: STARTED
      expect:
        status: UNSET
        service_name: ${SERVICE_NAME}
        links:
          - name: Workflow
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${RETRY_STEP}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.status: STARTED
          durable.operation.name: otel-retry
        before:
          name: otel-retry
          attributes:
            durable.operation.status: SUCCEEDED
        parent:
          name: Invocation
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
    - select:
        name: otel-retry attempt 1
        attributes:
          durable.attempt.number: 1
      expect:
        status: ERROR
        service_name: ${SERVICE_NAME}
        links:
          - name: Workflow
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${RETRY_STEP}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.name: otel-retry
          durable.attempt.number: 1
          durable.attempt.outcome: FAILED
        before:
          name: otel-retry attempt 2
          attributes:
            durable.attempt.number: 2
        parent:
          name: otel-retry
          kind: INTERNAL
          attributes:
            durable.operation.id: ${RETRY_STEP}
            durable.operation.type: STEP
            durable.operation.subtype: Step
    - select:
        name: otel-retry
        attributes:
          durable.operation.status: SUCCEEDED
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links:
          - $occurrence: 1
            name: otel-retry
            attributes:
              durable.operation.id: ${RETRY_STEP}
          - name: Workflow
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${RETRY_STEP}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.status: SUCCEEDED
          durable.operation.name: otel-retry
          durable.attempt.number: 2
        after:
          name: otel-retry
          attributes:
            durable.operation.status: STARTED
        parent:
          name: Invocation
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
    - select:
        name: otel-retry attempt 2
        attributes:
          durable.attempt.number: 2
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links:
          - name: Workflow
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${RETRY_STEP}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.name: otel-retry
          durable.attempt.number: 2
          durable.attempt.outcome: SUCCEEDED
        after:
          name: otel-retry attempt 1
          attributes:
            durable.attempt.number: 1
        parent:
          name: otel-retry
          kind: INTERNAL
          attributes:
            durable.operation.id: ${RETRY_STEP}
            durable.operation.type: STEP
            durable.operation.subtype: Step
