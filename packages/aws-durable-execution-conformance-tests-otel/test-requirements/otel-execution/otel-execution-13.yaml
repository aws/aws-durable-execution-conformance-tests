description: Execution view emits a failed parallel branch under its operation
Input:
  scenario: parallel-failure
AsyncInvoke: true
ExpectedExecutionHistory:
  - EventId: 1
    EventType: ExecutionStarted
  - EventId: 2
    EventType: ContextStarted
    SubType: Parallel
    Id: ${PARALLEL1}
    Name: otel-failed-parallel
  - EventId: 3
    EventType: ContextStarted
    SubType: ParallelBranch
    Id: ${FAILED_BRANCH}
    ParentId: ${PARALLEL1}
    Name: otel-failed-parallel-branch
  - EventId: 4
    EventType: ContextFailed
    SubType: ParallelBranch
    Id: ${FAILED_BRANCH}
    ParentId: ${PARALLEL1}
    Name: otel-failed-parallel-branch
  - EventId: 5
    EventType: ContextSucceeded
    SubType: Parallel
    Id: ${PARALLEL1}
    Name: otel-failed-parallel
ExpectedResult:
  ExecutionStatus: FAILED
TelemetryAssertions:
  minimum_spans: 4
  require_execution_correlation: true
  require_single_trace_per_execution: true
  require_parented_spans:
    - name: Workflow
    - name: Invocation
  require_unique_root_per_trace: true
  span_assertions:
    - select:
        name: Workflow
        status: ERROR
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
      expect:
        parent:
          $allow_unresolved: true
          $allow_outside: true
          $reject_sdk_span: true
        status: ERROR
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.execution.status: FAILED
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: FAILED
      expect:
        status: ERROR
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: FAILED
    - select:
        name: otel-failed-parallel
        attributes:
          durable.operation.id: ${PARALLEL1}
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links:
          - $occurrence: 1
            name: Invocation
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${PARALLEL1}
          durable.operation.type: CONTEXT
          durable.operation.subtype: Parallel
          durable.operation.name: otel-failed-parallel
        parent:
          name: Workflow
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.execution.status: FAILED
    - select:
        name: otel-failed-parallel-branch
        attributes:
          durable.operation.id: ${FAILED_BRANCH}
      expect:
        status: ERROR
        service_name: ${SERVICE_NAME}
        links:
          - $occurrence: 1
            name: Invocation
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${FAILED_BRANCH}
          durable.operation.type: CONTEXT
          durable.operation.subtype: ParallelBranch
          durable.operation.name: otel-failed-parallel-branch
        parent:
          name: otel-failed-parallel
          kind: INTERNAL
          attributes:
            durable.operation.id: ${PARALLEL1}
