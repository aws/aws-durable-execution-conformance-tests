---
description: Execution view exports a successfully completed operation only once across
  a normal wait/resume
Input:
  scenario: completed-step-replay
AsyncInvoke: true
ExpectedExecutionHistory:
  - EventId: 1
    EventType: ExecutionStarted
  - EventId: 2
    EventType: StepStarted
    SubType: Step
    Id: ${COMPLETED_STEP}
    Name: otel-before-wait
  - EventId: 3
    EventType: StepSucceeded
    SubType: Step
    Id: ${COMPLETED_STEP}
    Name: otel-before-wait
  - EventId: 4
    EventType: WaitStarted
    SubType: Wait
    Id: ${REPLAY_WAIT}
    Name: otel-replay-wait
  - EventId: 7
    EventType: StepStarted
    SubType: Step
    Id: ${AFTER_STEP}
    Name: otel-after-wait
  - EventId: 8
    EventType: StepSucceeded
    SubType: Step
    Id: ${AFTER_STEP}
    Name: otel-after-wait
ExpectedResult:
  ExecutionStatus: SUCCEEDED
  Result: before-after
TelemetryAssertions:
  minimum_spans: 8
  minimum_invocations: 2
  require_execution_correlation: true
  require_single_trace_per_execution: true
  require_parented_spans:
    - name: Workflow
    - name: Invocation
  require_unique_root_per_trace: true
  span_assertions:
    - select:
        name: Workflow
        status: OK
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
      expect:
        parent:
          $allow_unresolved: true
          $allow_outside: true
          $reject_sdk_span: true
        status: OK
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.execution.status: SUCCEEDED
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
        before:
          name: Invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: SUCCEEDED
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
        after:
          name: Invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: true
            durable.invocation.status: PENDING
    - select:
        name: otel-replay-wait
        attributes:
          durable.operation.id: ${REPLAY_WAIT}
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links:
          - $occurrence: 2
            name: Invocation
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${REPLAY_WAIT}
          durable.operation.type: WAIT
          durable.operation.subtype: Wait
          durable.operation.name: otel-replay-wait
        before:
          name: otel-after-wait
          attributes:
            durable.operation.id: ${AFTER_STEP}
        parent:
          name: Workflow
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.execution.status: SUCCEEDED
    - select:
        name: otel-after-wait
        attributes:
          durable.operation.id: ${AFTER_STEP}
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links:
          - $occurrence: 2
            name: Invocation
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${AFTER_STEP}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.name: otel-after-wait
        after:
          name: otel-replay-wait
          attributes:
            durable.operation.id: ${REPLAY_WAIT}
        parent:
          name: Workflow
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.execution.status: SUCCEEDED
    - select:
        name: otel-after-wait attempt 1
        attributes:
          durable.operation.id: ${AFTER_STEP}
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links:
          - $occurrence: 2
            name: Invocation
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        inside:
          $linked: true
          name: Invocation
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${AFTER_STEP}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.name: otel-after-wait
          durable.attempt.outcome: SUCCEEDED
        parent:
          name: otel-after-wait
          kind: INTERNAL
          attributes:
            durable.operation.id: ${AFTER_STEP}
    - select:
        name: otel-before-wait
        attributes:
          durable.operation.id: ${COMPLETED_STEP}
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links:
          - $occurrence: 1
            name: Invocation
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${COMPLETED_STEP}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.name: otel-before-wait
        parent:
          name: Workflow
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.execution.status: SUCCEEDED
        before:
          name: otel-after-wait
          attributes:
            durable.operation.id: ${AFTER_STEP}
    - select:
        name: otel-before-wait attempt 1
        attributes:
          durable.operation.id: ${COMPLETED_STEP}
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links:
          - $occurrence: 1
            name: Invocation
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        inside:
          $linked: true
          name: Invocation
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${COMPLETED_STEP}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.name: otel-before-wait
          durable.attempt.outcome: SUCCEEDED
        parent:
          name: otel-before-wait
          kind: INTERNAL
          attributes:
            durable.operation.id: ${COMPLETED_STEP}
        before:
          name: otel-after-wait
          attributes:
            durable.operation.id: ${AFTER_STEP}
