description: Execution view emits linked workflow roots for a successful chained invoke
Input:
  scenario: chained-invoke
AsyncInvoke: true
ExpectedExecutionHistory:
  - EventId: 1
    EventType: ExecutionStarted
  - EventId: 2
    EventType: ChainedInvokeStarted
    SubType: ChainedInvoke
    Id: ${INVOKE1}
    Name: otel-invoke
    ChainedInvokeStartedDetails:
      DurableExecutionArn: ${TARGET_EXECUTION_ARN}
  - EventId: 4
    EventType: ChainedInvokeSucceeded
    SubType: ChainedInvoke
    Id: ${INVOKE1}
    Name: otel-invoke
ExpectedResult:
  ExecutionStatus: SUCCEEDED
TelemetryAssertions:
  minimum_spans: 6
  require_execution_correlation: true
  minimum_invocations: 3
  allowed_execution_arns:
    - ${EXECUTION_ARN}
    - ${TARGET_EXECUTION_ARN}
  span_assertions:
    - select:
        name: Workflow
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
      expect:
        parent_span_id: null
        status: ${/^(?:OK|UNSET)$/}
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.execution.status: SUCCEEDED
    - select:
        name: Workflow
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
      expect:
        parent_span_id: null
        status: ${/^(?:OK|UNSET)$/}
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.execution.status: SUCCEEDED
    - select:
        name: otel-invoke
        attributes:
          durable.operation.id: ${INVOKE1}
      expect:
        status: ${/^(?:OK|UNSET)$/}
        service_name: invocation
        links:
          - attributes:
              $any_of:
                - faas.invocation_id: '*'
                - aws.lambda.invocation_id: '*'
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${INVOKE1}
          durable.operation.type: CHAINED_INVOKE
          durable.operation.subtype: ChainedInvoke
          durable.operation.name: otel-invoke
        parent:
          name: Workflow
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.execution.status: SUCCEEDED
