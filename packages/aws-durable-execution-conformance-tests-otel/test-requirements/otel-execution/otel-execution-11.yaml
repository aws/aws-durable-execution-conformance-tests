---
description: Execution view preserves first-invoke parent ancestry across target execution
  and completed replay
Input:
  scenario: chained-invoke
AsyncInvoke: true
ExpectedExecutionHistory:
  - EventId: 1
    EventType: ExecutionStarted
  - EventId: 2
    EventType: ChainedInvokeStarted
    SubType: ChainedInvoke
    Id: ${INVOKE1}
    Name: otel-invoke
    ChainedInvokeStartedDetails:
      DurableExecutionArn: ${TARGET_EXECUTION_ARN}
    $absent:
      - [ParentId]
  - EventId: 3
    EventType: InvocationCompleted
  - EventId: 4
    EventType: ChainedInvokeSucceeded
    SubType: ChainedInvoke
    Id: ${INVOKE1}
    Name: otel-invoke
    $absent:
      - [ParentId]
  - EventId: 5
    EventType: ContextStarted
    SubType: WaitForCallback
    Id: ${INVOKE_BARRIER_CONTEXT}
    Name: otel-invoke-replay-barrier
  - EventId: 6
    EventType: CallbackStarted
    SubType: Callback
    Id: ${INVOKE_BARRIER_CALLBACK}
    ParentId: ${INVOKE_BARRIER_CONTEXT}
    Name: '${/^otel-invoke-replay-barrier(?: create callback id|-callback)?$/}'
  - EventId: 7
    EventType: StepStarted
    SubType: Step
    Id: ${INVOKE_BARRIER_SUBMITTER}
    ParentId: ${INVOKE_BARRIER_CONTEXT}
    Name: '${/^otel-invoke-replay-barrier(?: submitter|-submitter)?$/}'
  - EventId: 8
    EventType: StepSucceeded
    SubType: Step
    Id: ${INVOKE_BARRIER_SUBMITTER}
    ParentId: ${INVOKE_BARRIER_CONTEXT}
    Name: '${/^otel-invoke-replay-barrier(?: submitter|-submitter)?$/}'
  - EventId: 9
    EventType: InvocationCompleted
  - EventId: 10
    EventType: CallbackSucceeded
    SubType: Callback
    Id: ${INVOKE_BARRIER_CALLBACK}
    ParentId: ${INVOKE_BARRIER_CONTEXT}
  - EventId: 11
    EventType: ContextSucceeded
    SubType: WaitForCallback
    Id: ${INVOKE_BARRIER_CONTEXT}
    Name: otel-invoke-replay-barrier
  - EventId: 12
    EventType: InvocationCompleted
  - EventId: 13
    EventType: ExecutionSucceeded
ExpectedResult:
  ExecutionStatus: SUCCEEDED
TelemetryAssertions:
  minimum_spans: 11
  require_execution_correlation: true
  require_single_trace_per_execution: true
  require_parented_spans:
    - name: Workflow
    - name: Invocation
  require_unique_root_per_trace: true
  minimum_invocations: 4
  allowed_execution_arns: ['${EXECUTION_ARN}', '${TARGET_EXECUTION_ARN}']
  span_assertions:
    - select:
        name: Workflow
        status: OK
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
      expect:
        parent:
          $allow_unresolved: true
          $allow_outside: true
          $reject_sdk_span: true
        status: OK
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.execution.status: SUCCEEDED
    - select:
        name: Workflow
        status: OK
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
      expect:
        parent:
          $allow_unresolved: true
          $allow_outside: true
        status: OK
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.execution.status: SUCCEEDED
        same_trace_as: &id001
          name: otel-invoke
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.operation.id: ${INVOKE1}
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
      count: 3
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
      expect_by_occurrence:
        - attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: true
            durable.invocation.status: PENDING
          before:
            name: Invocation
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
              durable.invocation.first: false
              durable.invocation.status: SUCCEEDED
        - attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: PENDING
        - attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: SUCCEEDED
          after:
            name: Invocation
            attributes:
              durable.execution.arn: ${TARGET_EXECUTION_ARN}
              durable.invocation.first: true
              durable.invocation.status: SUCCEEDED
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: SUCCEEDED
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: SUCCEEDED
        before:
          name: Invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: SUCCEEDED
        same_trace_as:
          name: otel-invoke
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.operation.id: ${INVOKE1}
    - select:
        name: otel-invoke
        attributes:
          durable.operation.id: ${INVOKE1}
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links:
          - $occurrence: 2
            name: Invocation
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${INVOKE1}
          durable.operation.type: CHAINED_INVOKE
          durable.operation.subtype: ChainedInvoke
          durable.operation.name: otel-invoke
          durable.operation.status: SUCCEEDED
        parent:
          name: Workflow
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.execution.status: SUCCEEDED
    - select:
        name: otel-invoke-replay-barrier
        attributes:
          durable.operation.id: ${INVOKE_BARRIER_CONTEXT}
      expect:
        service_name: ${SERVICE_NAME}
        links:
          - name: Invocation
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
            $occurrence: 3
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${INVOKE_BARRIER_CONTEXT}
          durable.operation.type: CONTEXT
          durable.operation.subtype: WaitForCallback
          durable.operation.name: otel-invoke-replay-barrier
          durable.operation.status: SUCCEEDED
        parent:
          name: Workflow
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.execution.status: SUCCEEDED
        status: OK
    - select:
        name: '${/^(?:otel-invoke-replay-barrier(?: create callback id|-callback)|CALLBACK)$/}'
        attributes:
          durable.operation.id: ${INVOKE_BARRIER_CALLBACK}
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links:
          - name: Invocation
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
            $occurrence: 3
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${INVOKE_BARRIER_CALLBACK}
          durable.operation.type: CALLBACK
          durable.operation.subtype: Callback
          durable.operation.name: '${/^otel-invoke-replay-barrier(?: create callback
            id|-callback)$/}'
          durable.operation.status: SUCCEEDED
        parent:
          $allow_outside: true
          name: otel-invoke-replay-barrier
          kind: INTERNAL
          attributes:
            durable.operation.id: ${INVOKE_BARRIER_CONTEXT}
    - select:
        name: '${/^(?:otel-invoke-replay-barrier(?: submitter|-submitter)|STEP)$/}'
        status: OK
        attributes:
          durable.operation.id: ${INVOKE_BARRIER_SUBMITTER}
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links:
          - name: Invocation
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
            $occurrence: 2
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${INVOKE_BARRIER_SUBMITTER}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.name: '${/^otel-invoke-replay-barrier(?: submitter|-submitter)$/}'
        parent:
          $allow_outside: true
          name: otel-invoke-replay-barrier
          kind: INTERNAL
          attributes:
            durable.operation.id: ${INVOKE_BARRIER_CONTEXT}
    - select:
        name: '${/^(?:otel-invoke-replay-barrier(?: submitter|-submitter)|STEP) attempt
          1$/}'
        attributes:
          durable.operation.id: ${INVOKE_BARRIER_SUBMITTER}
          durable.attempt.outcome: SUCCEEDED
      expect:
        status: OK
        service_name: ${SERVICE_NAME}
        links:
          - name: Invocation
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
            $occurrence: 2
        inside:
          $linked: true
          name: Invocation
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${INVOKE_BARRIER_SUBMITTER}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.name: '${/^otel-invoke-replay-barrier(?: submitter|-submitter)$/}'
          durable.attempt.outcome: SUCCEEDED
        parent:
          $allow_outside: true
          name: '${/^(?:otel-invoke-replay-barrier(?: submitter|-submitter)|STEP)$/}'
          kind: INTERNAL
          attributes:
            durable.operation.id: ${INVOKE_BARRIER_SUBMITTER}
  require_all_spans: true
  span_assertion_scope:
    - attributes:
        durable.execution.arn: ${EXECUTION_ARN}
    - attributes:
        durable.execution.arn: ${TARGET_EXECUTION_ARN}
  quiescence_seconds: 5
  chained_invokes:
    - child_execution_arn: ${TARGET_EXECUTION_ARN}
      parent: *id001
      sampled: true
CallbackActions:
  - CallbackName: '${/^otel-invoke-replay-barrier(?: create callback id|-callback)?$/}'
    Operation: success
    Payload: resume
    AfterInvocationCompleted: true
