description: Execution view emits failed wait-for-condition operation and attempt spans
Input:
  scenario: wait-for-condition-failure
AsyncInvoke: true
ExpectedExecutionHistory:
  - EventId: 1
    EventType: ExecutionStarted
  - EventId: 2
    EventType: StepStarted
    SubType: WaitForCondition
    Id: ${FAILED_CONDITION}
    Name: otel-failed-condition
  - EventId: 3
    EventType: StepFailed
    SubType: WaitForCondition
    Id: ${FAILED_CONDITION}
    Name: otel-failed-condition
ExpectedResult:
  ExecutionStatus: FAILED
TelemetryAssertions:
  minimum_spans: 4
  require_execution_correlation: true
  require_single_trace_per_execution: true
  require_parented_spans:
    - name: Workflow
    - name: Invocation
  require_unique_root_per_trace: true
  span_assertions:
    - select:
        name: Workflow
        status: ERROR
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
      expect:
        parent:
          $allow_unresolved: true
          $allow_outside: true
          name: "Durable Execution Attempt #1"
        status: ERROR
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.execution.status: FAILED
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: FAILED
      expect:
        status: ERROR
        service_name: ${SERVICE_NAME}
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: FAILED
    - select:
        name: otel-failed-condition
        attributes:
          durable.operation.id: ${FAILED_CONDITION}
      expect:
        status: ERROR
        service_name: ${SERVICE_NAME}
        links:
          - $occurrence: 1
            name: Invocation
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${FAILED_CONDITION}
          durable.operation.type: STEP
          durable.operation.subtype: WaitForCondition
          durable.operation.name: otel-failed-condition
        parent:
          name: Workflow
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.execution.status: FAILED
    - select:
        name: otel-failed-condition attempt 1
        attributes:
          durable.operation.id: ${FAILED_CONDITION}
          durable.attempt.outcome: FAILED
      expect:
        status: ERROR
        service_name: ${SERVICE_NAME}
        links:
          - $occurrence: 1
            name: Invocation
            attributes:
              durable.execution.arn: ${EXECUTION_ARN}
        inside:
          $linked: true
          name: Invocation
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${FAILED_CONDITION}
          durable.operation.type: STEP
          durable.operation.subtype: WaitForCondition
          durable.operation.name: otel-failed-condition
          durable.attempt.outcome: FAILED
        parent:
          name: otel-failed-condition
          kind: INTERNAL
          attributes:
            durable.operation.id: ${FAILED_CONDITION}
