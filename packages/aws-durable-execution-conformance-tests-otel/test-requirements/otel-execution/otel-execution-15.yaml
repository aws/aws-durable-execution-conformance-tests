description: Execution view emits a pending invocation when an interrupted workflow does not complete
Input:
  scenario: wait-interrupted
AsyncInvoke: true
ExpectedExecutionHistory:
  - EventId: 1
    EventType: ExecutionStarted
  - EventId: 2
    EventType: WaitStarted
    SubType: Wait
    Id: ${INTERRUPTED_WAIT}
    Name: otel-interrupted-wait
ExpectedResult:
  ExecutionStatus: TIMED_OUT
TelemetryAssertions:
  minimum_spans: 1
  require_execution_correlation: true
  span_assertions:
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
      expect:
        status: OK
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
