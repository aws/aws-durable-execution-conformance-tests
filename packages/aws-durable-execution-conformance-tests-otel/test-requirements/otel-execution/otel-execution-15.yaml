description: Execution view emits an incomplete workflow and its interrupted wait
Input:
  scenario: wait-interrupted
AsyncInvoke: true
ExpectedExecutionHistory:
  - EventId: 1
    EventType: ExecutionStarted
  - EventId: 2
    EventType: WaitStarted
    SubType: Wait
    Id: ${INTERRUPTED_WAIT}
    Name: otel-interrupted-wait
ExpectedResult:
  ExecutionStatus: TIMED_OUT
TelemetryAssertions:
  minimum_spans: 3
  require_execution_correlation: true
  span_assertions:
    - select:
        name: Workflow
        status: UNSET
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
      expect:
        parent_span_id: null
        status: UNSET
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
      expect:
        status: UNSET
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
    - select:
        name: otel-interrupted-wait
        attributes:
          durable.operation.id: ${INTERRUPTED_WAIT}
      expect:
        status: UNSET
        service_name: invocation
        links:
          - name: invocation
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${INTERRUPTED_WAIT}
          durable.operation.type: WAIT
          durable.operation.subtype: Wait
          durable.operation.name: otel-interrupted-wait
        parent:
          name: Workflow
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
