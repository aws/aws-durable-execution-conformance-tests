description: Execution view preserves failed and recovery steps under one successful workflow
Input:
  scenario: handled-failure
AsyncInvoke: true
ExpectedExecutionHistory:
  - EventId: 1
    EventType: ExecutionStarted
  - EventId: 2
    EventType: StepStarted
    SubType: Step
    Id: ${FAILED_STEP}
    Name: otel-handled-failure
  - EventId: 3
    EventType: StepFailed
    SubType: Step
    Id: ${FAILED_STEP}
    Name: otel-handled-failure
  - EventId: 4
    EventType: StepStarted
    SubType: Step
    Id: ${RECOVERY_STEP}
    Name: otel-recovery-step
  - EventId: 5
    EventType: StepSucceeded
    SubType: Step
    Id: ${RECOVERY_STEP}
    Name: otel-recovery-step
ExpectedResult:
  ExecutionStatus: SUCCEEDED
TelemetryAssertions:
  minimum_spans: 6
  require_execution_correlation: true
  span_assertions:
    - select:
        name: Workflow
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
      expect:
        parent_span_id: null
        status: OK
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.execution.status: SUCCEEDED
    - select:
        name: otel-handled-failure
        attributes:
          durable.operation.id: ${FAILED_STEP}
      expect:
        status: ERROR
        service_name: invocation
        links:
          - name: invocation
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${FAILED_STEP}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.name: otel-handled-failure
        before:
          name: otel-recovery-step
          attributes:
            durable.operation.id: ${RECOVERY_STEP}
        parent:
          name: Workflow
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.execution.status: SUCCEEDED
    - select:
        name: otel-handled-failure attempt 1
        attributes:
          durable.operation.id: ${FAILED_STEP}
          durable.attempt.outcome: FAILED
      expect:
        status: ERROR
        service_name: invocation
        links:
          - name: invocation
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${FAILED_STEP}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.name: otel-handled-failure
          durable.attempt.outcome: FAILED
        parent:
          name: otel-handled-failure
          kind: INTERNAL
          attributes:
            durable.operation.id: ${FAILED_STEP}
    - select:
        name: otel-recovery-step
        attributes:
          durable.operation.id: ${RECOVERY_STEP}
      expect:
        status: ${/^(?:OK|UNSET)$/}
        service_name: invocation
        links:
          - name: invocation
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${RECOVERY_STEP}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.name: otel-recovery-step
        after:
          name: otel-handled-failure
          attributes:
            durable.operation.id: ${FAILED_STEP}
        parent:
          name: Workflow
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.execution.status: SUCCEEDED
    - select:
        name: otel-recovery-step attempt 1
        attributes:
          durable.operation.id: ${RECOVERY_STEP}
          durable.attempt.outcome: SUCCEEDED
      expect:
        status: ${/^(?:OK|UNSET)$/}
        service_name: invocation
        links:
          - name: invocation
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${RECOVERY_STEP}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.name: otel-recovery-step
          durable.attempt.outcome: SUCCEEDED
        parent:
          name: otel-recovery-step
          kind: INTERNAL
          attributes:
            durable.operation.id: ${RECOVERY_STEP}
