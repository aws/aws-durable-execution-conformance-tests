description: Execution view emits callback, submitter, and attempt spans under one workflow
Input:
  scenario: wait-for-callback
AsyncInvoke: true
CallbackActions:
  - CallbackName: '${/^otel-callback(?: create callback id|-callback)$/}'
    Operation: success
    Payload: callback-complete
    Delay: 1
ExpectedExecutionHistory:
  - EventId: 1
    EventType: ExecutionStarted
  - EventId: 2
    EventType: ContextStarted
    SubType: WaitForCallback
    Id: ${CALLBACK_CONTEXT}
    Name: otel-callback
  - EventId: 3
    EventType: CallbackStarted
    SubType: Callback
    Id: ${CALLBACK1}
    ParentId: ${CALLBACK_CONTEXT}
    Name: '${/^otel-callback(?: create callback id|-callback)$/}'
  - EventId: 4
    EventType: StepStarted
    SubType: Step
    Id: ${SUBMITTER_STEP}
    ParentId: ${CALLBACK_CONTEXT}
    Name: '${/^otel-callback(?: submitter|-submitter)$/}'
  - EventId: 5
    EventType: StepSucceeded
    SubType: Step
    Id: ${SUBMITTER_STEP}
    ParentId: ${CALLBACK_CONTEXT}
    Name: '${/^otel-callback(?: submitter|-submitter)$/}'
  - EventId: 8
    EventType: ContextSucceeded
    SubType: WaitForCallback
    Id: ${CALLBACK_CONTEXT}
    Name: otel-callback
ExpectedResult:
  ExecutionStatus: SUCCEEDED
TelemetryAssertions:
  minimum_spans: 8
  require_execution_correlation: true
  minimum_invocations: 2
  span_assertions:
    - select:
        name: Workflow
        status: OK
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
      expect:
        parent_span_id: null
        status: OK
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.execution.status: SUCCEEDED
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
      expect:
        status: OK
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
        before:
          name: Invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: SUCCEEDED
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
      expect:
        status: OK
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
        after:
          name: Invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: true
            durable.invocation.status: PENDING
    - select:
        name: otel-callback
        attributes:
          durable.operation.id: ${CALLBACK_CONTEXT}
      expect:
        status: OK
        service_name: invocation
        links:
          - name: ${/^[Ii]nvocation$/}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${CALLBACK_CONTEXT}
          durable.operation.type: CONTEXT
          durable.operation.subtype: WaitForCallback
          durable.operation.name: otel-callback
        parent:
          name: Workflow
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.execution.status: SUCCEEDED
    - select:
        name: '${/^otel-callback(?: create callback id|-callback)$/}'
        attributes:
          durable.operation.id: ${CALLBACK1}
      expect:
        status: OK
        service_name: invocation
        links:
          - name: ${/^[Ii]nvocation$/}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${CALLBACK1}
          durable.operation.type: CALLBACK
          durable.operation.subtype: Callback
          durable.operation.name: '${/^otel-callback(?: create callback id|-callback)$/}'
        parent:
          $allow_outside: true
          name: otel-callback
          kind: INTERNAL
          attributes:
            durable.operation.id: ${CALLBACK_CONTEXT}
    - select:
        name: '${/^otel-callback(?: submitter|-submitter)$/}'
        status: OK
        attributes:
          durable.operation.id: ${SUBMITTER_STEP}
      expect:
        status: OK
        service_name: invocation
        links:
          - name: ${/^[Ii]nvocation$/}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${SUBMITTER_STEP}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.name: '${/^otel-callback(?: submitter|-submitter)$/}'
        parent:
          $allow_outside: true
          name: otel-callback
          kind: INTERNAL
          attributes:
            durable.operation.id: ${CALLBACK_CONTEXT}
    - select:
        name: '${/^otel-callback(?: submitter|-submitter) attempt 1$/}'
        attributes:
          durable.operation.id: ${SUBMITTER_STEP}
          durable.attempt.outcome: SUCCEEDED
      expect:
        status: OK
        service_name: invocation
        links:
          - name: ${/^[Ii]nvocation$/}
        inside:
          $linked: true
          name: ${/^[Ii]nvocation$/}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${SUBMITTER_STEP}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.name: '${/^otel-callback(?: submitter|-submitter)$/}'
          durable.attempt.outcome: SUCCEEDED
        parent:
          $allow_outside: true
          name: '${/^otel-callback(?: submitter|-submitter)$/}'
          kind: INTERNAL
          attributes:
            durable.operation.id: ${SUBMITTER_STEP}
