description: Execution view preserves workflow hierarchy across a wait and resumed invocation
Input:
  scenario: wait-resume
AsyncInvoke: true
ExpectedExecutionHistory:
  - EventId: 1
    EventType: ExecutionStarted
  - EventId: 2
    EventType: WaitStarted
    SubType: Wait
    Id: ${WAIT1}
    Name: otel-wait
  - EventId: 5
    EventType: StepStarted
    SubType: Step
    Id: ${STEP1}
    Name: otel-after-resume
  - EventId: 6
    EventType: StepSucceeded
    SubType: Step
    Id: ${STEP1}
    Name: otel-after-resume
ExpectedResult:
  ExecutionStatus: SUCCEEDED
TelemetryAssertions:
  minimum_spans: 6
  minimum_invocations: 2
  require_execution_correlation: true
  span_assertions:
    - select:
        name: Workflow
        status: OK
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
      expect:
        parent_span_id: null
        status: OK
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.execution.status: SUCCEEDED
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
      expect:
        status: OK
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
        before:
          name: Invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: SUCCEEDED
    - select:
        name: Invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
      expect:
        status: OK
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
        after:
          name: Invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: true
            durable.invocation.status: PENDING
    - select:
        name: otel-wait
        attributes:
          durable.operation.id: ${WAIT1}
      expect:
        status: OK
        service_name: invocation
        links:
          - name: ${/^[Ii]nvocation$/}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${WAIT1}
          durable.operation.type: WAIT
          durable.operation.subtype: Wait
          durable.operation.name: otel-wait
        before:
          name: otel-after-resume
          attributes:
            durable.operation.id: ${STEP1}
        parent:
          name: Workflow
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.execution.status: SUCCEEDED
    - select:
        name: otel-after-resume
        attributes:
          durable.operation.id: ${STEP1}
      expect:
        status: OK
        service_name: invocation
        links:
          - name: ${/^[Ii]nvocation$/}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${STEP1}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.name: otel-after-resume
        after:
          name: otel-wait
          attributes:
            durable.operation.id: ${WAIT1}
        parent:
          name: Workflow
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.execution.status: SUCCEEDED
    - select:
        name: otel-after-resume attempt 1
        attributes:
          durable.operation.id: ${STEP1}
      expect:
        status: OK
        service_name: invocation
        links:
          - name: ${/^[Ii]nvocation$/}
        inside:
          $linked: true
          name: ${/^[Ii]nvocation$/}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${STEP1}
          durable.operation.type: STEP
          durable.operation.subtype: Step
          durable.operation.name: otel-after-resume
          durable.attempt.outcome: SUCCEEDED
        parent:
          name: otel-after-resume
          kind: INTERNAL
          attributes:
            durable.operation.id: ${STEP1}
