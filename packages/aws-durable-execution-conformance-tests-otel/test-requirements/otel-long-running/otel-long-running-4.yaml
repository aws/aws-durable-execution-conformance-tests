description: OpenTelemetry preserves chained-invoke telemetry while the target remains suspended for a long delay
Variables:
  LONG_DELAY_SECONDS: 1
Input:
  scenario: long-chained-invoke
  delay_seconds: ${LONG_DELAY_SECONDS}
AsyncInvoke: true
ExpectedExecutionHistory:
  - EventId: 1
    EventType: ExecutionStarted
  - EventId: 2
    EventType: ChainedInvokeStarted
    SubType: ChainedInvoke
    Id: ${INVOKE1}
    Name: otel-long-invoke
    ChainedInvokeStartedDetails:
      DurableExecutionArn: ${TARGET_EXECUTION_ARN}
  - EventId: 4
    EventType: ChainedInvokeSucceeded
    SubType: ChainedInvoke
    Id: ${INVOKE1}
    Name: otel-long-invoke
ExpectedResult:
  ExecutionStatus: SUCCEEDED
TelemetryAssertions:
  minimum_spans: 8
  minimum_invocations: 4
  require_execution_correlation: true
  allowed_execution_arns:
    - ${EXECUTION_ARN}
    - ${TARGET_EXECUTION_ARN}
  require_all_spans: true
  span_assertion_scope:
    - attributes:
        durable.execution.arn: ${EXECUTION_ARN}
    - attributes:
        durable.execution.arn: ${TARGET_EXECUTION_ARN}
  exact_attribute_prefixes:
    - durable.
  span_assertions:
    - select:
        name: invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
      expect:
        status: UNSET
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
        before:
          name: invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: SUCCEEDED
    - select:
        name: invocation
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
      expect:
        status: UNSET
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
        before:
          name: invocation
          attributes:
            durable.execution.arn: ${TARGET_EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: SUCCEEDED
    - select:
        name: invocation
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
      expect:
        status: OK
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
        after:
          name: invocation
          attributes:
            durable.execution.arn: ${TARGET_EXECUTION_ARN}
            durable.invocation.first: true
            durable.invocation.status: PENDING
        before:
          name: invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: SUCCEEDED
    - select:
        name: invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
      expect:
        status: OK
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
        after:
          name: invocation
          attributes:
            durable.execution.arn: ${TARGET_EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: SUCCEEDED
    - select:
        name: otel-long-invoke
        attributes:
          durable.operation.status: STARTED
      expect:
        status: UNSET
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${INVOKE1}
          durable.operation.type: CHAINED_INVOKE
          durable.operation.subtype: ChainedInvoke
          durable.operation.status: STARTED
          durable.operation.name: otel-long-invoke
        before:
          name: otel-long-invoke
          attributes:
            durable.operation.status: SUCCEEDED
        parent:
          name: invocation
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
    - select:
        name: otel-long-invoke
        attributes:
          durable.operation.status: SUCCEEDED
      expect:
        status: OK
        service_name: invocation
        links:
          - name: otel-long-invoke
            attributes:
              durable.operation.id: ${INVOKE1}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${INVOKE1}
          durable.operation.type: CHAINED_INVOKE
          durable.operation.subtype: ChainedInvoke
          durable.operation.status: SUCCEEDED
          durable.operation.name: otel-long-invoke
        after:
          name: otel-long-invoke
          attributes:
            durable.operation.status: STARTED
        parent:
          name: invocation
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
    - select:
        name: otel-long-invoke-target-wait
        attributes:
          durable.operation.status: STARTED
      expect:
        status: UNSET
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.operation.id: '*'
          durable.operation.type: WAIT
          durable.operation.subtype: Wait
          durable.operation.status: STARTED
          durable.operation.name: otel-long-invoke-target-wait
        before:
          name: otel-long-invoke-target-wait
          attributes:
            durable.operation.status: SUCCEEDED
        parent:
          name: invocation
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${TARGET_EXECUTION_ARN}
    - select:
        name: otel-long-invoke-target-wait
        attributes:
          durable.operation.status: SUCCEEDED
      expect:
        status: OK
        service_name: invocation
        links:
          - name: otel-long-invoke-target-wait
            attributes:
              durable.operation.id: '*'
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.operation.id: '*'
          durable.operation.type: WAIT
          durable.operation.subtype: Wait
          durable.operation.status: SUCCEEDED
          durable.operation.name: otel-long-invoke-target-wait
        after:
          name: otel-long-invoke-target-wait
          attributes:
            durable.operation.status: STARTED
        parent:
          name: invocation
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${TARGET_EXECUTION_ARN}
