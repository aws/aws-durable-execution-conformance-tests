---
description: OpenTelemetry preserves chained-invoke telemetry while the target remains
  suspended for a long delay
Variables:
  LONG_DELAY_SECONDS: 1
Input:
  scenario: long-chained-invoke
  delay_seconds: ${LONG_DELAY_SECONDS}
AsyncInvoke: true
ExpectedExecutionHistory:
  - EventId: 1
    EventType: ExecutionStarted
  - EventId: 2
    EventType: ChainedInvokeStarted
    SubType: ChainedInvoke
    Id: ${INVOKE1}
    Name: otel-long-invoke
    ChainedInvokeStartedDetails:
      DurableExecutionArn: ${TARGET_EXECUTION_ARN}
  - EventId: 4
    EventType: ChainedInvokeSucceeded
    SubType: ChainedInvoke
    Id: ${INVOKE1}
    Name: otel-long-invoke
ExpectedResult:
  ExecutionStatus: SUCCEEDED
TelemetryAssertions:
  minimum_spans: 8
  minimum_invocations: 4
  require_execution_correlation: true
  allowed_execution_arns: ['${EXECUTION_ARN}', '${TARGET_EXECUTION_ARN}']
  require_all_spans: true
  span_assertion_scope:
    - attributes:
        durable.execution.arn: ${EXECUTION_ARN}
    - attributes:
        durable.execution.arn: ${TARGET_EXECUTION_ARN}
  span_assertions:
    - select:
        name: invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
      expect:
        status: OK
        service_name: invocation
        links: []
        kind:
          $any_of: [INTERNAL, SERVER]
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
        before:
          name: invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: SUCCEEDED
    - select:
        name: invocation
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
      expect:
        status: OK
        service_name: invocation
        links: []
        kind:
          $any_of: [INTERNAL, SERVER]
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.invocation.first: true
          durable.invocation.status: PENDING
        before:
          name: invocation
          attributes:
            durable.execution.arn: ${TARGET_EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: SUCCEEDED
    - select:
        name: invocation
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
      expect:
        status: OK
        service_name: invocation
        links: []
        kind:
          $any_of: [INTERNAL, SERVER]
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
        after:
          name: invocation
          attributes:
            durable.execution.arn: ${TARGET_EXECUTION_ARN}
            durable.invocation.first: true
            durable.invocation.status: PENDING
        before:
          name: invocation
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: SUCCEEDED
    - select:
        name: invocation
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
      expect:
        status: OK
        service_name: invocation
        links: []
        kind:
          $any_of: [INTERNAL, SERVER]
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
          durable.invocation.status: SUCCEEDED
        after:
          name: invocation
          attributes:
            durable.execution.arn: ${TARGET_EXECUTION_ARN}
            durable.invocation.first: false
            durable.invocation.status: SUCCEEDED
    - select:
        name: otel-long-invoke
        attributes:
          durable.operation.id: ${INVOKE1}
      count: 2
      expect:
        status:
          $any_of: [UNSET, OK]
        service_name: invocation
        links:
          $any_of:
            - []
            - - name: otel-long-invoke
                attributes:
                  durable.operation.id: ${INVOKE1}
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${INVOKE1}
          durable.operation.type: CHAINED_INVOKE
          durable.operation.name: otel-long-invoke
        parent:
          $allow_outside: true
          name: invocation
          kind:
            $any_of: [INTERNAL, SERVER]
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
    - select:
        name: otel-long-invoke-target-wait
        attributes:
          durable.operation.id: '*'
      count: 2
      expect:
        status:
          $any_of: [UNSET, OK]
        service_name: invocation
        links:
          $any_of:
            - []
            - - name: otel-long-invoke-target-wait
                attributes:
                  durable.operation.id: '*'
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.operation.id: '*'
          durable.operation.type: WAIT
          durable.operation.name: otel-long-invoke-target-wait
        parent:
          $allow_outside: true
          name: invocation
          kind:
            $any_of: [INTERNAL, SERVER]
          attributes:
            durable.execution.arn: ${TARGET_EXECUTION_ARN}
ExecutionTelemetryAssertions:
  minimum_spans: 8
  require_execution_correlation: true
  minimum_invocations: 4
  allowed_execution_arns: ['${EXECUTION_ARN}', '${TARGET_EXECUTION_ARN}']
  span_assertions:
    - select:
        name: Workflow
        status: OK
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
      expect:
        parent_span_id:
        status: OK
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.execution.status: SUCCEEDED
    - select:
        name: '${/^[Ii]nvocation$/}'
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
      expect:
        status: UNSET
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: true
        before:
          name: '${/^[Ii]nvocation$/}'
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
    - select:
        name: '${/^[Ii]nvocation$/}'
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
      expect:
        status: UNSET
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.invocation.first: false
        after:
          name: '${/^[Ii]nvocation$/}'
          attributes:
            durable.execution.arn: ${TARGET_EXECUTION_ARN}
            durable.invocation.first: false
    - select:
        name: '${/^[Ii]nvocation$/}'
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.invocation.first: true
      expect:
        status: UNSET
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.invocation.first: true
        before:
          name: '${/^[Ii]nvocation$/}'
          attributes:
            durable.execution.arn: ${TARGET_EXECUTION_ARN}
            durable.invocation.first: false
    - select:
        name: '${/^[Ii]nvocation$/}'
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.invocation.first: false
      expect:
        status: UNSET
        service_name: invocation
        links: []
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${TARGET_EXECUTION_ARN}
          durable.invocation.first: false
        after:
          name: '${/^[Ii]nvocation$/}'
          attributes:
            durable.execution.arn: ${TARGET_EXECUTION_ARN}
            durable.invocation.first: true
        before:
          name: '${/^[Ii]nvocation$/}'
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.invocation.first: false
    - select:
        name: otel-long-invoke
        attributes:
          durable.operation.id: ${INVOKE1}
      expect:
        status: OK
        service_name: invocation
        links:
          - name: invocation
        kind: INTERNAL
        attributes:
          durable.execution.arn: ${EXECUTION_ARN}
          durable.operation.id: ${INVOKE1}
          durable.operation.type: CHAINED_INVOKE
          durable.operation.subtype: ChainedInvoke
          durable.operation.name: otel-long-invoke
        parent:
          name: Workflow
          kind: INTERNAL
          attributes:
            durable.execution.arn: ${EXECUTION_ARN}
            durable.execution.status: SUCCEEDED
