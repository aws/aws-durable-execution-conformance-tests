AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: TypeScript SDK examples for the durable execution Workflow Insight conformance suite

# IAM note: functions run under the pre-created LambdaExecutionRoleArn (the
# conformance runner injects it), so SAM cannot attach policies to it here. For
# the `s3` sink (INSIGHT_SINK=s3) that role MUST grant s3:PutObject on
# arn:aws:s3:::${InsightS3Bucket}/${InsightS3Prefix}* . The default `cloudwatch`
# sink uses the built-in LambdaLogExporter (console.log to the function's own log
# group) and needs no extra permissions beyond basic Lambda logging.

Parameters:
  LambdaExecutionRoleArn:
    Type: String
    Description: Pre-created execution role for the test functions
  InsightSink:
    Type: String
    Default: cloudwatch
    AllowedValues:
      - cloudwatch
      - s3
    Description: >-
      Which insight exporter each function uses. cloudwatch = LambdaLogExporter
      (operationsByName); s3 = S3Exporter (operations array).
  InsightS3Bucket:
    Type: String
    Default: ""
    Description: S3 bucket the s3 sink writes records to (required when InsightSink=s3)
  InsightS3Prefix:
    Type: String
    Default: ""
    Description: S3 key prefix the s3 sink writes records under

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    Timeout: 60
    MemorySize: 512
    DurableConfig:
      ExecutionTimeout: 300
      RetentionPeriodInDays: 1
    Environment:
      Variables:
        INSIGHT_SINK: !Ref InsightSink
        INSIGHT_S3_BUCKET: !Ref InsightS3Bucket
        INSIGHT_S3_PREFIX: !Ref InsightS3Prefix

Resources:
  Insight1BasicSuccess:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription:
        - insight-1
    Properties:
      CodeUri: dist/
      Handler: insight_basic_success.handler
      FunctionName: !Sub "${AWS::StackName}-insight-1"
      Role: !Ref LambdaExecutionRoleArn

  Insight2ExecutionFailure:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription:
        - insight-2
