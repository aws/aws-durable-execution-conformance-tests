name: Java OpenTelemetry Suite

on:
  workflow_call:
    inputs:
      suite:
        description: OTel requirement suite to run
        required: true
        type: string
      case_count:
        description: Number of cases in the selected suite
        required: true
        type: number
      aws_region:
        description: AWS region
        required: false
        default: us-west-2
        type: string
      java_sdk_ref:
        description: Resolved commit from the Java SDK main branch
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: java-otel-examples-${{ inputs.suite }}-${{ inputs.aws_region }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.aws_region }}
  JAVA_SDK_CHECKOUT: .build/aws-durable-execution-sdk-java
  JAVA_SDK_REF: ${{ inputs.java_sdk_ref }}
  JAVA_TEST_TEMPLATE: packages/aws-durable-execution-conformance-tests-otel/examples/java/template.yaml
  OTEL_CASE_COUNT: ${{ inputs.case_count }}
  OTEL_DEPLOYMENT_SERVICE_NAME: invocation
  OTEL_QUERY_SERVICE_NAME: ${{ inputs.suite == 'otel-invocation' && 'invocation' || 'workflow' }}
  OTEL_SUITE: ${{ inputs.suite }}
  OTEL_VIEW_SUFFIX: ${{ inputs.suite == 'otel-invocation' && 'inv' || 'exec' }}
  TEST_NAME: java-xray-${{ inputs.suite == 'otel-invocation' && 'inv' || 'exec' }}

jobs:
  xray:
    name: ADOT + X-Ray
    if: >-
      github.event_name != 'pull_request' ||
      (github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Java SDK main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aws/aws-durable-execution-sdk-java
          ref: ${{ env.JAVA_SDK_REF }}
          path: ${{ env.JAVA_SDK_CHECKOUT }}

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Install Java SDK main
        run: |
          JAVA_SDK_VERSION=$(
            mvn -B -q \
              --file "$JAVA_SDK_CHECKOUT/pom.xml" \
              -Dstyle.color=never \
              -Dexpression=project.version \
              -DforceStdout \
              help:evaluate
          )
          mvn -B -q \
            --file "$JAVA_SDK_CHECKOUT/pom.xml" \
            --projects sdk,otel-plugin \
            --also-make \
            -DskipTests \
            install
          echo "Using Java SDK main version $JAVA_SDK_VERSION"
          echo "JAVA_SDK_VERSION=$JAVA_SDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.PYTHON_TEST_ROLE_ARN }}
          role-session-name: durableExecutionConformanceJavaOtelXRay
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS test account
        env:
          TEST_ACCOUNT_ID: ${{ secrets.PYTHON_TEST_ACCOUNT_ID }}
        run: |
          ACTUAL_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACTUAL_ACCOUNT_ID" != "$TEST_ACCOUNT_ID" ]; then
            echo "Expected AWS account $TEST_ACCOUNT_ID but assumed into $ACTUAL_ACCOUNT_ID"
            exit 1
          fi
          echo "Using AWS test account $ACTUAL_ACCOUNT_ID"

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3

      - name: Install Hatch
        run: python -m pip install hatch==1.16.5

      - name: Resolve latest AWS Distro for OpenTelemetry Java layer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ADOT_LAYER_ARN=$(
            gh api repos/aws-observability/aws-otel-java-instrumentation/releases/latest \
              --jq .body |
              awk -F '|' -v region="$AWS_REGION" '
                $2 ~ "^[[:space:]]*" region "[[:space:]]*$" {
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", $3)
                  print $3
                  exit
                }
              '
          )
          if [ -z "$ADOT_LAYER_ARN" ]; then
            echo "Could not resolve AWSOpenTelemetryDistroJava for $AWS_REGION"
            exit 1
          fi
          aws lambda get-layer-version-by-arn \
            --arn "$ADOT_LAYER_ARN" \
            --region "$AWS_REGION" \
            --query LayerVersionArn \
            --output text > /dev/null
          echo "Using AWSOpenTelemetryDistroJava layer $ADOT_LAYER_ARN with its Java agent disabled"
          echo "ADOT_LAYER_ARN=$ADOT_LAYER_ARN" >> "$GITHUB_ENV"

      - name: Compile Java handlers with SDK main
        run: |
          mvn -B -q -DskipTests package \
            -Ddurable.sdk.version="$JAVA_SDK_VERSION" \
            --file packages/aws-durable-execution-conformance-tests-otel/examples/java/pom.xml

      - name: Run X-Ray conformance tests
        env:
          LAMBDA_EXECUTION_ROLE_ARN: ${{ secrets.PYTHON_TEST_LAMBDA_EXECUTION_ROLE_ARN }}
        run: |
          hatch run validate \
            --template "$JAVA_TEST_TEMPLATE" \
            --language java \
            --region "$AWS_REGION" \
            --name "$TEST_NAME" \
            --no-cleanup \
            --suite "$OTEL_SUITE" \
            --history-dir "$RUNNER_TEMP/java-otel-history" \
            --report console json junit github \
            --report-file "$RUNNER_TEMP/java-otel-xray-report" \
            --fail-on failed+uncovered \
            --parameter-overrides \
              "LambdaExecutionRoleArn=$LAMBDA_EXECUTION_ROLE_ARN" \
              "OtelServiceName=$OTEL_DEPLOYMENT_SERVICE_NAME" \
              "OtelSuite=$OTEL_SUITE" \
            --otel-exporter adot \
            --otel-layer-arn "$ADOT_LAYER_ARN" \
            --otel-service-name "$OTEL_QUERY_SERVICE_NAME" \
            --otel-backend xray

      - name: Show Lambda logs
        if: failure()
        run: |
          for case_number in $(seq 1 "$OTEL_CASE_COUNT"); do
            log_group="/aws/lambda/conformance-tests-${TEST_NAME}-${OTEL_SUITE}-${case_number}"
            echo "::group::$log_group"
            aws logs tail "$log_group" --since 20m --format short || true
            echo "::endgroup::"
          done
          if [ "$OTEL_SUITE" = "otel-invocation" ] || [ "$OTEL_SUITE" = "otel-execution" ]; then
            for case_number in 11 18; do
              log_group="/aws/lambda/conformance-tests-${TEST_NAME}-${OTEL_SUITE}-${case_number}-target"
              echo "::group::$log_group"
              aws logs tail "$log_group" --since 20m --format short || true
              echo "::endgroup::"
            done
          fi

      - name: Show execution history diagnostics
        if: failure()
        run: |
          shopt -s nullglob
          for artifact in "$RUNNER_TEMP"/java-otel-history/*.json; do
            if [[ "$artifact" == *-otel.json ]]; then
              continue
            fi
            echo "::group::$artifact"
            cat "$artifact"
            echo "::endgroup::"
          done

      - name: Show normalized X-Ray trace diagnostics
        if: failure()
        run: |
          shopt -s nullglob
          for artifact in "$RUNNER_TEMP"/java-otel-history/*-otel.json; do
            echo "::group::$artifact"
            cat "$artifact"
            echo "::endgroup::"
          done

      - name: Upload reports and histories
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-otel-xray-${{ inputs.suite }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/java-otel-history/
            ${{ runner.temp }}/java-otel-xray-report.json
            ${{ runner.temp }}/java-otel-xray-report.xml
          if-no-files-found: ignore

  dash0:
    name: Community layer + Dash0
    if: >-
      github.event_name != 'pull_request' ||
      (github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DASH0_API_URL: https://api.us-west-2.aws.dash0.com
      DASH0_AUTH_TOKEN: ${{ secrets.DASH0_AUTH_TOKEN }}
      DASH0_OTLP_ENDPOINT: https://ingress.us-west-2.aws.dash0.com
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer%20${{ secrets.DASH0_AUTH_TOKEN }}
      TEST_NAME: java-dash0-${{ inputs.suite == 'otel-invocation' && 'inv' || 'exec' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Java SDK main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aws/aws-durable-execution-sdk-java
          ref: main
          path: ${{ env.JAVA_SDK_CHECKOUT }}

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Install Java SDK main
        run: |
          JAVA_SDK_VERSION=$(
            mvn -B -q \
              --file "$JAVA_SDK_CHECKOUT/pom.xml" \
              -Dstyle.color=never \
              -Dexpression=project.version \
              -DforceStdout \
              help:evaluate
          )
          mvn -B -q \
            --file "$JAVA_SDK_CHECKOUT/pom.xml" \
            --projects sdk,otel-plugin \
            --also-make \
            -DskipTests \
            install
          echo "Using Java SDK main version $JAVA_SDK_VERSION"
          echo "JAVA_SDK_VERSION=$JAVA_SDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.PYTHON_TEST_ROLE_ARN }}
          role-session-name: durableExecutionConformanceJavaOtelDash0
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS test account
        env:
          TEST_ACCOUNT_ID: ${{ secrets.PYTHON_TEST_ACCOUNT_ID }}
        run: |
          ACTUAL_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACTUAL_ACCOUNT_ID" != "$TEST_ACCOUNT_ID" ]; then
            echo "Expected AWS account $TEST_ACCOUNT_ID but assumed into $ACTUAL_ACCOUNT_ID"
            exit 1
          fi
          echo "Using AWS test account $ACTUAL_ACCOUNT_ID"

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3

      - name: Install Hatch
        run: python -m pip install hatch==1.16.5

      - name: Compile Java handlers with SDK main
        run: |
          mvn -B -q -DskipTests package \
            -Ddurable.sdk.version="$JAVA_SDK_VERSION" \
            --file packages/aws-durable-execution-conformance-tests-otel/examples/java/pom.xml

      - name: Run Dash0 conformance tests
        env:
          LAMBDA_EXECUTION_ROLE_ARN: ${{ secrets.PYTHON_TEST_LAMBDA_EXECUTION_ROLE_ARN }}
        run: |
          hatch run validate \
            --template "$JAVA_TEST_TEMPLATE" \
            --language java \
            --region "$AWS_REGION" \
            --name "$TEST_NAME" \
            --no-cleanup \
            --suite "$OTEL_SUITE" \
            --history-dir "$RUNNER_TEMP/java-otel-dash0-history" \
            --report console json junit github \
            --report-file "$RUNNER_TEMP/java-otel-dash0-report" \
            --fail-on failed+uncovered \
            --parameter-overrides \
              "LambdaExecutionRoleArn=$LAMBDA_EXECUTION_ROLE_ARN" \
              "OtelServiceName=$OTEL_DEPLOYMENT_SERVICE_NAME" \
              "OtelSuite=$OTEL_SUITE" \
            --otel-exporter community \
            --otel-endpoint "$DASH0_OTLP_ENDPOINT" \
            --otel-service-name "$OTEL_QUERY_SERVICE_NAME" \
            --otel-backend dash0

      - name: Show Lambda logs
        if: failure()
        run: |
          for case_number in $(seq 1 "$OTEL_CASE_COUNT"); do
            log_group="/aws/lambda/conformance-tests-${TEST_NAME}-${OTEL_SUITE}-${case_number}"
            echo "::group::$log_group"
            aws logs tail "$log_group" --since 20m --format short || true
            echo "::endgroup::"
          done
          if [ "$OTEL_SUITE" = "otel-invocation" ] || [ "$OTEL_SUITE" = "otel-execution" ]; then
            for case_number in 11 18; do
              log_group="/aws/lambda/conformance-tests-${TEST_NAME}-${OTEL_SUITE}-${case_number}-target"
              echo "::group::$log_group"
              aws logs tail "$log_group" --since 20m --format short || true
              echo "::endgroup::"
            done
          fi

      - name: Show execution history diagnostics
        if: failure()
        run: |
          shopt -s nullglob
          for artifact in "$RUNNER_TEMP"/java-otel-dash0-history/*.json; do
            if [[ "$artifact" == *-otel.json ]]; then
              continue
            fi
            echo "::group::$artifact"
            cat "$artifact"
            echo "::endgroup::"
          done

      - name: Show normalized Dash0 trace diagnostics
        if: failure()
        run: |
          shopt -s nullglob
          for artifact in "$RUNNER_TEMP"/java-otel-dash0-history/*-otel.json; do
            echo "::group::$artifact"
            cat "$artifact"
            echo "::endgroup::"
          done

      - name: Upload reports and histories
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-otel-dash0-${{ inputs.suite }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/java-otel-dash0-history/
            ${{ runner.temp }}/java-otel-dash0-report.json
            ${{ runner.temp }}/java-otel-dash0-report.xml
          if-no-files-found: ignore

  s3_collector:
    name: Community layer + S3 collector
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      COLLECTOR_LAYER_NAME: durable-execution-conformance-java-s3-collector
      OTEL_LAMBDA_CHECKOUT: .build/opentelemetry-lambda
      TEST_STACK_NAME: conformance-tests-java-s3-${{ inputs.suite == 'otel-invocation' && 'inv' || 'exec' }}
      TEST_NAME: java-s3-${{ inputs.suite == 'otel-invocation' && 'inv' || 'exec' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out OpenTelemetry Lambda collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-telemetry/opentelemetry-lambda
          ref: layer-collector/0.22.0
          path: ${{ env.OTEL_LAMBDA_CHECKOUT }}

      - name: Check out Java SDK main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aws/aws-durable-execution-sdk-java
          ref: ${{ env.JAVA_SDK_REF }}
          path: ${{ env.JAVA_SDK_CHECKOUT }}

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Install Java SDK main
        run: |
          JAVA_SDK_VERSION=$(
            mvn -B -q \
              --file "$JAVA_SDK_CHECKOUT/pom.xml" \
              -Dstyle.color=never \
              -Dexpression=project.version \
              -DforceStdout \
              help:evaluate
          )
          mvn -B -q \
            --file "$JAVA_SDK_CHECKOUT/pom.xml" \
            --projects sdk,otel-plugin \
            --also-make \
            -DskipTests \
            install
          echo "Using Java SDK main version $JAVA_SDK_VERSION"
          echo "JAVA_SDK_VERSION=$JAVA_SDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: ${{ env.OTEL_LAMBDA_CHECKOUT }}/collector/go.mod
          cache-dependency-path: |
            ${{ env.OTEL_LAMBDA_CHECKOUT }}/collector/go.sum
            ${{ env.OTEL_LAMBDA_CHECKOUT }}/collector/lambdacomponents/go.sum

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.PYTHON_TEST_ROLE_ARN }}
          role-session-name: durableExecutionConformanceJavaS3
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS test account
        env:
          TEST_ACCOUNT_ID: ${{ secrets.PYTHON_TEST_ACCOUNT_ID }}
        run: |
          ACTUAL_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACTUAL_ACCOUNT_ID" != "$TEST_ACCOUNT_ID" ]; then
            echo "Expected AWS account $TEST_ACCOUNT_ID but assumed into $ACTUAL_ACCOUNT_ID"
            exit 1
          fi
          echo "Using AWS test account $ACTUAL_ACCOUNT_ID"

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3

      - name: Install Hatch
        run: python -m pip install hatch==1.16.5

      - name: Test Java and collector contracts
        run: |
          hatch run test:all \
            packages/aws-durable-execution-conformance-tests-otel/tests/test_collector.py \
            packages/aws-durable-execution-conformance-tests-otel/tests/test_java_examples.py

      - name: Compile Java handlers with SDK main
        run: |
          mvn -B -q -DskipTests package \
            -Ddurable.sdk.version="$JAVA_SDK_VERSION" \
            --file packages/aws-durable-execution-conformance-tests-otel/examples/java/pom.xml

      - name: Build S3 collector Lambda layer
        run: |
          bash packages/aws-durable-execution-conformance-tests-otel/collector/build-lambda-layer.sh \
            "$OTEL_LAMBDA_CHECKOUT" \
            "$RUNNER_TEMP/opentelemetry-s3-collector-layer.zip"

      - name: Publish S3 collector Lambda layer
        run: |
          COLLECTOR_LAYER_ARN=$(
            aws lambda publish-layer-version \
              --layer-name "$COLLECTOR_LAYER_NAME" \
              --description "OpenTelemetry S3 collector for conformance run $GITHUB_RUN_ID" \
              --zip-file "fileb://$RUNNER_TEMP/opentelemetry-s3-collector-layer.zip" \
              --compatible-runtimes java21 \
              --compatible-architectures x86_64 \
              --query LayerVersionArn \
              --output text
          )
          echo "COLLECTOR_LAYER_ARN=$COLLECTOR_LAYER_ARN" >> "$GITHUB_ENV"
          aws lambda get-layer-version-by-arn \
            --arn "$COLLECTOR_LAYER_ARN" \
            --query LayerVersionArn \
            --output text > /dev/null
          echo "Using S3 collector layer $COLLECTOR_LAYER_ARN"

      - name: Prepare stable S3 telemetry bucket
        env:
          LAMBDA_EXECUTION_ROLE_ARN: ${{ secrets.PYTHON_TEST_LAMBDA_EXECUTION_ROLE_ARN }}
          TEST_ACCOUNT_ID: ${{ secrets.PYTHON_TEST_ACCOUNT_ID }}
          TEST_ROLE_ARN: ${{ secrets.PYTHON_TEST_ROLE_ARN }}
        run: |
          OTEL_S3_BUCKET="dex-otel-java-${OTEL_VIEW_SUFFIX}-${TEST_ACCOUNT_ID}-${AWS_REGION}"
          OTEL_S3_PREFIX=traces
          {
            echo "OTEL_S3_BUCKET=$OTEL_S3_BUCKET"
            echo "OTEL_S3_PREFIX=$OTEL_S3_PREFIX"
            echo "OTEL_S3_URI=s3://$OTEL_S3_BUCKET/$OTEL_S3_PREFIX"
          } >> "$GITHUB_ENV"
          if ! aws s3api head-bucket --bucket "$OTEL_S3_BUCKET" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$OTEL_S3_BUCKET"
            else
              aws s3api create-bucket \
                --bucket "$OTEL_S3_BUCKET" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
          fi
          aws s3 rm "s3://$OTEL_S3_BUCKET/$OTEL_S3_PREFIX" --recursive
          aws s3api put-public-access-block \
            --bucket "$OTEL_S3_BUCKET" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          BUCKET_POLICY=$(
            jq -n \
              --arg bucket "$OTEL_S3_BUCKET" \
              --arg prefix "$OTEL_S3_PREFIX" \
              --arg reader "$TEST_ROLE_ARN" \
              --arg writer "$LAMBDA_EXECUTION_ROLE_ARN" \
              '{
                Version: "2012-10-17",
                Statement: [
                  {
                    Sid: "CollectorWrite",
                    Effect: "Allow",
                    Principal: {AWS: $writer},
                    Action: ["s3:PutObject", "s3:AbortMultipartUpload"],
                    Resource: ("arn:aws:s3:::" + $bucket + "/" + $prefix + "/*")
                  },
                  {
                    Sid: "RunnerList",
                    Effect: "Allow",
                    Principal: {AWS: $reader},
                    Action: "s3:ListBucket",
                    Resource: ("arn:aws:s3:::" + $bucket),
                    Condition: {StringLike: {"s3:prefix": [$prefix, ($prefix + "/*")]}}
                  },
                  {
                    Sid: "RunnerRead",
                    Effect: "Allow",
                    Principal: {AWS: $reader},
                    Action: ["s3:GetObject", "s3:DeleteObject"],
                    Resource: ("arn:aws:s3:::" + $bucket + "/" + $prefix + "/*")
                  }
                ]
              }'
          )
          aws s3api put-bucket-policy \
            --bucket "$OTEL_S3_BUCKET" \
            --policy "$BUCKET_POLICY"

      - name: Delete rolled-back test stack
        run: |
          stack_status=$(
            aws cloudformation describe-stacks \
              --stack-name "$TEST_STACK_NAME" \
              --query "Stacks[0].StackStatus" \
              --output text 2>/dev/null || true
          )
          if [ "$stack_status" = "ROLLBACK_COMPLETE" ]; then
            aws cloudformation delete-stack --stack-name "$TEST_STACK_NAME"
            aws cloudformation wait stack-delete-complete --stack-name "$TEST_STACK_NAME"
          fi

      - name: Run S3 collector conformance tests
        env:
          LAMBDA_EXECUTION_ROLE_ARN: ${{ secrets.PYTHON_TEST_LAMBDA_EXECUTION_ROLE_ARN }}
        run: |
          hatch run validate \
            --template "$JAVA_TEST_TEMPLATE" \
            --language java \
            --region "$AWS_REGION" \
            --name "$TEST_NAME" \
            --no-cleanup \
            --suite "$OTEL_SUITE" \
            --history-dir "$RUNNER_TEMP/java-otel-history" \
            --report console json junit github \
            --report-file "$RUNNER_TEMP/java-otel-s3-report" \
            --fail-on failed+uncovered \
            --parameter-overrides \
              "LambdaExecutionRoleArn=$LAMBDA_EXECUTION_ROLE_ARN" \
              "OtelCollectorLayerArn=$COLLECTOR_LAYER_ARN" \
              "OtelCollectorBucket=$OTEL_S3_BUCKET" \
              "OtelCollectorPrefix=$OTEL_S3_PREFIX" \
              "OtelServiceName=$OTEL_DEPLOYMENT_SERVICE_NAME" \
              "OtelSuite=$OTEL_SUITE" \
            --otel-exporter community \
            --otel-endpoint http://localhost:4317 \
            --otel-service-name "$OTEL_QUERY_SERVICE_NAME" \
            --otel-backend collector \
            --otel-backend-endpoint "$OTEL_S3_URI" \
            --otel-poll-timeout 90 \
            --otel-poll-attempts 45

      - name: Show CloudFormation diagnostics
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "$TEST_STACK_NAME" \
            --query "StackEvents[?ResourceStatus == 'CREATE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
            --output table || true

      - name: Show Lambda logs
        if: failure()
        run: |
          for case_number in $(seq 1 "$OTEL_CASE_COUNT"); do
            log_group="/aws/lambda/conformance-tests-${TEST_NAME}-${OTEL_SUITE}-${case_number}"
            echo "::group::$log_group"
            aws logs tail "$log_group" --since 30m --format short || true
            echo "::endgroup::"
          done
          if [ "$OTEL_SUITE" = "otel-invocation" ] || [ "$OTEL_SUITE" = "otel-execution" ]; then
            for case_number in 11 18; do
              log_group="/aws/lambda/conformance-tests-${TEST_NAME}-${OTEL_SUITE}-${case_number}-target"
              echo "::group::$log_group"
              aws logs tail "$log_group" --since 30m --format short || true
              echo "::endgroup::"
            done
          fi

      - name: Show execution history diagnostics
        if: failure()
        run: |
          shopt -s nullglob
          for artifact in "$RUNNER_TEMP"/java-otel-history/*.json; do
            if [[ "$artifact" == *-otel.json ]]; then
              continue
            fi
            echo "::group::$artifact"
            cat "$artifact"
            echo "::endgroup::"
          done

      - name: Show normalized S3 trace diagnostics
        if: failure()
        run: |
          shopt -s nullglob
          for artifact in "$RUNNER_TEMP"/java-otel-history/*-otel.json; do
            echo "::group::$artifact"
            cat "$artifact"
            echo "::endgroup::"
          done

      - name: Show S3 collector objects
        if: failure() && env.OTEL_S3_BUCKET != ''
        run: |
          aws s3api list-objects-v2 \
            --bucket "$OTEL_S3_BUCKET" \
            --prefix "$OTEL_S3_PREFIX/" \
            --query "Contents[].[LastModified,Size,Key]" \
            --output table || true

      - name: Upload reports and histories
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-otel-s3-${{ inputs.suite }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/java-otel-history/
            ${{ runner.temp }}/java-otel-s3-report.json
            ${{ runner.temp }}/java-otel-s3-report.xml
          if-no-files-found: ignore
