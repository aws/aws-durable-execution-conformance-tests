name: OpenTelemetry Conformance

on:
  workflow_call:
    inputs:
      language:
        description: Stable language key used in resource and artifact names
        required: true
        type: string
      resource_prefix:
        description: Short prefix used by long-running Lambda resources
        required: true
        type: string
      sdk_repository:
        description: GitHub repository containing the language SDK
        required: true
        type: string
      sdk_ref:
        description: Full SDK commit SHA; defaults to the SDK main branch
        required: false
        default: ""
        type: string
      conformance_repository:
        description: GitHub repository containing the conformance tests
        required: false
        default: aws/aws-durable-execution-conformance-tests
        type: string
      conformance_test_ref:
        description: Optional conformance test commit SHA or branch name
        required: false
        default: ""
        type: string
      checkout_sdk:
        description: Check out the SDK before running the preparation command
        required: false
        default: true
        type: boolean
      setup_command:
        description: Shell command that installs or selects the language toolchain
        required: false
        default: ""
        type: string
      prepare_command:
        description: Shell command that prepares the language handlers
        required: false
        default: ""
        type: string
      contract_test_command:
        description: Optional shell command that validates the language example contract
        required: false
        default: ""
        type: string
      adot_release_repository:
        description: GitHub repository whose latest release lists regional ADOT layers
        required: false
        default: ""
        type: string
      adot_layer_arn:
        description: Optional fixed ADOT layer ARN, bypassing release discovery
        required: false
        default: ""
        type: string
      collector_compatible_runtime:
        description: Lambda runtime recorded on the test collector layer
        required: true
        type: string
      collector_otlp_endpoint:
        description: Local collector OTLP endpoint used by the runtime
        required: true
        type: string
      legacy_stack_prefix:
        description: Optional legacy stack prefix cleaned up only after rollback
        required: false
        default: ""
        type: string
      suite_timeout_minutes:
        description: Timeout for X-Ray, Dash0, and Datadog suite jobs
        required: false
        default: 40
        type: number
      phase:
        description: Run short tests, launch a long run, or check the active long run
        required: false
        default: short
        type: string
      delay_seconds:
        description: Durable delay in seconds
        required: false
        default: "82800"
        type: string
      aws_region:
        description: AWS region
        required: false
        default: us-west-2
        type: string
      otlp_endpoint:
        description: OTLP ingest endpoint for an optional Datadog job
        required: false
        default: ""
        type: string
    secrets:
      CONFORMANCE_TEST_ROLE_ARN:
        description: AWS role assumed by the test jobs
        required: true
      CONFORMANCE_TEST_ACCOUNT_ID:
        description: Expected AWS account ID
        required: true
      CONFORMANCE_TEST_LAMBDA_EXECUTION_ROLE_ARN:
        description: Execution role assigned to test Lambda functions
        required: true
      DASH0_AUTH_TOKEN:
        description: Dash0 API and OTLP authentication token
        required: true
      DD_API_KEY:
        description: Datadog API key
        required: false
      DD_APPLICATION_KEY:
        description: Datadog application key
        required: false
      DATADOG_OTLP_HEADERS:
        description: Datadog OTLP request headers
        required: false

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  resolve:
    name: Resolve test commits
    runs-on: ubuntu-latest
    outputs:
      conformance_test_sha: ${{ steps.resolve-conformance.outputs.sha }}
      sdk_ref: ${{ steps.resolve-sdk.outputs.ref }}
    steps:
      - name: Validate workflow inputs
        env:
          ADOT_LAYER_ARN: ${{ inputs.adot_layer_arn }}
          ADOT_RELEASE_REPOSITORY: ${{ inputs.adot_release_repository }}
          CONFORMANCE_REPOSITORY: ${{ inputs.conformance_repository }}
          LANGUAGE: ${{ inputs.language }}
          REQUESTED_PHASE: ${{ inputs.phase }}
          RESOURCE_PREFIX: ${{ inputs.resource_prefix }}
          SDK_REPOSITORY: ${{ inputs.sdk_repository }}
        run: |
          case "$REQUESTED_PHASE" in
            short|launch|check) ;;
            *)
              echo "phase must be one of: short, launch, check"
              exit 1
              ;;
          esac
          if [[ ! "$LANGUAGE" =~ ^[a-z][a-z0-9-]{0,19}$ ]]; then
            echo "language must contain 1-20 lowercase resource-safe characters"
            exit 1
          fi
          if [[ ! "$RESOURCE_PREFIX" =~ ^[a-z][a-z0-9-]{0,11}$ ]]; then
            echo "resource_prefix must contain 1-12 lowercase resource-safe characters"
            exit 1
          fi
          for required_repository in \
            "conformance_repository:$CONFORMANCE_REPOSITORY" \
            "sdk_repository:$SDK_REPOSITORY"; do
            name=${required_repository%%:*}
            repository=${required_repository#*:}
            if [ -z "$repository" ]; then
              echo "$name is required"
              exit 1
            fi
          done
          for repository in \
            "$CONFORMANCE_REPOSITORY" \
            "$SDK_REPOSITORY" \
            "$ADOT_RELEASE_REPOSITORY"; do
            if [ -n "$repository" ] && [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "Invalid GitHub repository: $repository"
              exit 1
            fi
          done
          if [ -z "$ADOT_LAYER_ARN" ] && [ -z "$ADOT_RELEASE_REPOSITORY" ]; then
            echo "adot_release_repository or adot_layer_arn is required"
            exit 1
          fi

      - name: Resolve conformance test commit
        id: resolve-conformance
        env:
          CONFORMANCE_REPOSITORY: ${{ inputs.conformance_repository }}
          REQUESTED_CONFORMANCE_TEST_REF: >-
            ${{ inputs.conformance_test_ref
              || (github.repository == inputs.conformance_repository && github.sha)
              || 'main' }}
        run: |
          CONFORMANCE_TEST_REF="$REQUESTED_CONFORMANCE_TEST_REF"
          if [[ "$CONFORMANCE_TEST_REF" =~ ^[0-9a-f]{40}$ ]]; then
            CONFORMANCE_TEST_SHA="$CONFORMANCE_TEST_REF"
          else
            if [[ "$CONFORMANCE_TEST_REF" != refs/* ]]; then
              CONFORMANCE_TEST_REF="refs/heads/$CONFORMANCE_TEST_REF"
            fi
            CONFORMANCE_TEST_SHA=$(
              git ls-remote \
                "https://github.com/$CONFORMANCE_REPOSITORY.git" \
                "$CONFORMANCE_TEST_REF" |
                awk -v ref="$CONFORMANCE_TEST_REF" '$2 == ref {print $1; exit}'
            )
          fi
          if [[ ! "$CONFORMANCE_TEST_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve conformance test ref $REQUESTED_CONFORMANCE_TEST_REF"
            exit 1
          fi
          echo "Using conformance test commit $CONFORMANCE_TEST_SHA"
          echo "sha=$CONFORMANCE_TEST_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve SDK commit
        id: resolve-sdk
        env:
          REQUESTED_SDK_REF: ${{ inputs.sdk_ref }}
          SDK_REPOSITORY: ${{ inputs.sdk_repository }}
        run: |
          SDK_REF="$REQUESTED_SDK_REF"
          if [ -z "$SDK_REF" ]; then
            SDK_REF=$(
              git ls-remote \
                "https://github.com/$SDK_REPOSITORY.git" \
                refs/heads/main |
                awk '{print $1}'
            )
          fi
          if [[ ! "$SDK_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sdk_ref must resolve to a full 40-character commit SHA"
            exit 1
          fi
          echo "Using $SDK_REPOSITORY commit $SDK_REF"
          echo "ref=$SDK_REF" >> "$GITHUB_OUTPUT"

  invocation:
    name: Invocation view
    needs: resolve
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.phase == 'short')
    uses: ./.github/workflows/opentelemetry-suite.yml
    with:
      language: ${{ inputs.language }}
      conformance_repository: ${{ inputs.conformance_repository }}
      sdk_repository: ${{ inputs.sdk_repository }}
      sdk_ref: ${{ needs.resolve.outputs.sdk_ref }}
      conformance_test_sha: ${{ needs.resolve.outputs.conformance_test_sha }}
      checkout_sdk: ${{ inputs.checkout_sdk }}
      setup_command: ${{ inputs.setup_command }}
      prepare_command: ${{ inputs.prepare_command }}
      contract_test_command: ${{ inputs.contract_test_command }}
      adot_release_repository: ${{ inputs.adot_release_repository }}
      adot_layer_arn: ${{ inputs.adot_layer_arn }}
      collector_compatible_runtime: ${{ inputs.collector_compatible_runtime }}
      collector_otlp_endpoint: ${{ inputs.collector_otlp_endpoint }}
      legacy_stack_prefix: ${{ inputs.legacy_stack_prefix }}
      suite_timeout_minutes: ${{ inputs.suite_timeout_minutes }}
      suite: otel-invocation
      case_count: 19
      aws_region: ${{ inputs.aws_region }}
      otlp_endpoint: ${{ inputs.otlp_endpoint }}
    secrets: inherit

  execution:
    name: Execution view
    needs: resolve
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.phase == 'short')
    uses: ./.github/workflows/opentelemetry-suite.yml
    with:
      language: ${{ inputs.language }}
      conformance_repository: ${{ inputs.conformance_repository }}
      sdk_repository: ${{ inputs.sdk_repository }}
      sdk_ref: ${{ needs.resolve.outputs.sdk_ref }}
      conformance_test_sha: ${{ needs.resolve.outputs.conformance_test_sha }}
      checkout_sdk: ${{ inputs.checkout_sdk }}
      setup_command: ${{ inputs.setup_command }}
      prepare_command: ${{ inputs.prepare_command }}
      contract_test_command: ${{ inputs.contract_test_command }}
      adot_release_repository: ${{ inputs.adot_release_repository }}
      adot_layer_arn: ${{ inputs.adot_layer_arn }}
      collector_compatible_runtime: ${{ inputs.collector_compatible_runtime }}
      collector_otlp_endpoint: ${{ inputs.collector_otlp_endpoint }}
      legacy_stack_prefix: ${{ inputs.legacy_stack_prefix }}
      suite_timeout_minutes: ${{ inputs.suite_timeout_minutes }}
      suite: otel-execution
      case_count: 19
      aws_region: ${{ inputs.aws_region }}
      otlp_endpoint: ${{ inputs.otlp_endpoint }}
    secrets: inherit

  long-running-invocation:
    name: Long running invocation view
    needs: resolve
    uses: ./.github/workflows/opentelemetry-long-running.yml
    with:
      language: ${{ inputs.language }}
      resource_prefix: ${{ inputs.resource_prefix }}
      conformance_repository: ${{ inputs.conformance_repository }}
      sdk_repository: ${{ inputs.sdk_repository }}
      sdk_ref: ${{ needs.resolve.outputs.sdk_ref }}
      conformance_test_sha: ${{ needs.resolve.outputs.conformance_test_sha }}
      checkout_sdk: ${{ inputs.checkout_sdk }}
      setup_command: ${{ inputs.setup_command }}
      prepare_command: ${{ inputs.prepare_command }}
      contract_test_command: ${{ inputs.contract_test_command }}
      adot_release_repository: ${{ inputs.adot_release_repository }}
      adot_layer_arn: ${{ inputs.adot_layer_arn }}
      phase: >-
        ${{ (github.event_name == 'pull_request' || github.event_name == 'push')
          && 'short' || (github.event_name == 'schedule' && 'auto' || inputs.phase) }}
      view: invocation
      delay_seconds: >-
        ${{ (github.event_name == 'pull_request' || github.event_name == 'push'
          || inputs.phase == 'short')
          && '60' || inputs.delay_seconds }}
      aws_region: ${{ inputs.aws_region }}
    secrets: inherit

  long-running-execution:
    name: Long running execution view
    needs: resolve
    uses: ./.github/workflows/opentelemetry-long-running.yml
    with:
      language: ${{ inputs.language }}
      resource_prefix: ${{ inputs.resource_prefix }}
      conformance_repository: ${{ inputs.conformance_repository }}
      sdk_repository: ${{ inputs.sdk_repository }}
      sdk_ref: ${{ needs.resolve.outputs.sdk_ref }}
      conformance_test_sha: ${{ needs.resolve.outputs.conformance_test_sha }}
      checkout_sdk: ${{ inputs.checkout_sdk }}
      setup_command: ${{ inputs.setup_command }}
      prepare_command: ${{ inputs.prepare_command }}
      contract_test_command: ${{ inputs.contract_test_command }}
      adot_release_repository: ${{ inputs.adot_release_repository }}
      adot_layer_arn: ${{ inputs.adot_layer_arn }}
      phase: >-
        ${{ (github.event_name == 'pull_request' || github.event_name == 'push')
          && 'short' || (github.event_name == 'schedule' && 'auto' || inputs.phase) }}
      view: execution
      delay_seconds: >-
        ${{ (github.event_name == 'pull_request' || github.event_name == 'push'
          || inputs.phase == 'short')
          && '60' || inputs.delay_seconds }}
      aws_region: ${{ inputs.aws_region }}
    secrets: inherit

  next-long-running-invocation:
    name: Launch next long running invocation view
    needs: [resolve, long-running-invocation]
    if: >-
      always() &&
      needs.long-running-invocation.outputs.rollover_ready == 'true'
    uses: ./.github/workflows/opentelemetry-long-running.yml
    with:
      language: ${{ inputs.language }}
      resource_prefix: ${{ inputs.resource_prefix }}
      conformance_repository: ${{ inputs.conformance_repository }}
      sdk_repository: ${{ inputs.sdk_repository }}
      sdk_ref: ${{ needs.resolve.outputs.sdk_ref }}
      conformance_test_sha: ${{ needs.resolve.outputs.conformance_test_sha }}
      checkout_sdk: ${{ inputs.checkout_sdk }}
      setup_command: ${{ inputs.setup_command }}
      prepare_command: ${{ inputs.prepare_command }}
      contract_test_command: ${{ inputs.contract_test_command }}
      adot_release_repository: ${{ inputs.adot_release_repository }}
      adot_layer_arn: ${{ inputs.adot_layer_arn }}
      phase: launch
      view: invocation
      delay_seconds: ${{ inputs.delay_seconds }}
      aws_region: ${{ inputs.aws_region }}
    secrets: inherit

  next-long-running-execution:
    name: Launch next long running execution view
    needs: [resolve, long-running-execution]
    if: >-
      always() &&
      needs.long-running-execution.outputs.rollover_ready == 'true'
    uses: ./.github/workflows/opentelemetry-long-running.yml
    with:
      language: ${{ inputs.language }}
      resource_prefix: ${{ inputs.resource_prefix }}
      conformance_repository: ${{ inputs.conformance_repository }}
      sdk_repository: ${{ inputs.sdk_repository }}
      sdk_ref: ${{ needs.resolve.outputs.sdk_ref }}
      conformance_test_sha: ${{ needs.resolve.outputs.conformance_test_sha }}
      checkout_sdk: ${{ inputs.checkout_sdk }}
      setup_command: ${{ inputs.setup_command }}
      prepare_command: ${{ inputs.prepare_command }}
      contract_test_command: ${{ inputs.contract_test_command }}
      adot_release_repository: ${{ inputs.adot_release_repository }}
      adot_layer_arn: ${{ inputs.adot_layer_arn }}
      phase: launch
      view: execution
      delay_seconds: ${{ inputs.delay_seconds }}
      aws_region: ${{ inputs.aws_region }}
    secrets: inherit
