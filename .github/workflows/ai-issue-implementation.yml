name: AI Issue Implementation

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue-number:
        description: Authorized issue number to implement
        required: true
        type: string

permissions: {}

jobs:
  implement:
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: aws/aws-durable-execution-ci/.github/workflows/ai-issue-implementation.yml@8a06a1e5c82083a9224af9d489ddd030be44d978
    with:
      runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
      issue-number: ${{ inputs['issue-number'] || '' }}
    secrets: inherit
