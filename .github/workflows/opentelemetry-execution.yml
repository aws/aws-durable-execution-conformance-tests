name: OpenTelemetry Execution View

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/opentelemetry-execution.yml
      - .github/workflows/python-opentelemetry.yml
      - .github/workflows/python-opentelemetry-long-running.yml
      - .github/workflows/typescript-opentelemetry.yml
      - .github/workflows/typescript-opentelemetry-long-running.yml
      - packages/aws-durable-execution-conformance-tests/src/**
      - packages/aws-durable-execution-conformance-tests-otel/src/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-execution/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-long-running/**
      - packages/aws-durable-execution-conformance-tests-otel/collector/**
      - packages/aws-durable-execution-conformance-tests-otel/examples/python/**
      - packages/aws-durable-execution-conformance-tests-otel/examples/typescript/**
  push:
    branches: [main]
    paths:
      - .github/workflows/opentelemetry-execution.yml
      - .github/workflows/python-opentelemetry.yml
      - .github/workflows/python-opentelemetry-long-running.yml
      - .github/workflows/typescript-opentelemetry.yml
      - .github/workflows/typescript-opentelemetry-long-running.yml
      - packages/aws-durable-execution-conformance-tests/src/**
      - packages/aws-durable-execution-conformance-tests-otel/src/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-execution/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-long-running/**
      - packages/aws-durable-execution-conformance-tests-otel/collector/**
      - packages/aws-durable-execution-conformance-tests-otel/examples/python/**
      - packages/aws-durable-execution-conformance-tests-otel/examples/typescript/**
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region
        required: true
        default: us-west-2
        type: string
      otlp_endpoint:
        description: OTLP ingest endpoint for community-layer jobs
        required: false
        type: string
      dash0_query_endpoint:
        description: Dash0 trace API endpoint
        required: false
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  python:
    name: Python
    uses: ./.github/workflows/python-opentelemetry.yml
    with:
      suite: otel-execution
      case_count: 19
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
      otlp_endpoint: ${{ inputs.otlp_endpoint || '' }}
      dash0_query_endpoint: ${{ inputs.dash0_query_endpoint || '' }}
    secrets: inherit

  typescript:
    name: TypeScript
    uses: ./.github/workflows/typescript-opentelemetry.yml
    with:
      suite: otel-execution
      case_count: 19
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
    secrets: inherit

  python-long-running:
    name: Python long running
    uses: ./.github/workflows/python-opentelemetry-long-running.yml
    with:
      phase: short
      view: execution
      delay_seconds: "600"
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
    secrets: inherit

  typescript-long-running:
    name: TypeScript long running
    uses: ./.github/workflows/typescript-opentelemetry-long-running.yml
    with:
      phase: short
      view: execution
      delay_seconds: "600"
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
    secrets: inherit
