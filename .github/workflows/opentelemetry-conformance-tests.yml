name: OpenTelemetry Conformance Tests

# Runs the Java SDK's real handlers against the requirements on the PR that
# changes them, so a requirement/runner/workflow regression fails here instead of
# in the next SDK to pull. No handlers live in this repo anymore.
#
# - Orchestrator is called by relative path so the PR's own workflow copy runs.
# - conformance_test_ref is omitted, so resolve uses github.sha (this PR's
#   requirements).
# - sdk_ref defaults to SDK main, resolved once to a commit for all test jobs.
#   Manual dispatch can select another revision. New cases remain UNCOVERED
#   until their handlers reach the selected SDK revision.

on:
  pull_request:
    branches: [main]
    paths:
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/**
      - packages/aws-durable-execution-conformance-tests-otel/src/**
      - packages/aws-durable-execution-conformance-tests/src/**
      - packages/aws-durable-execution-conformance-tests-otel/collector/**
      - .github/actions/prepare-otel-example/**
      - .github/workflows/opentelemetry-orchestrator.yml
      - .github/workflows/opentelemetry-resolve.yml
      - .github/workflows/opentelemetry-suite.yml
      - .github/workflows/opentelemetry-long-running.yml
      - .github/workflows/opentelemetry-conformance-tests.yml
  push:
    branches: [main]
    paths:
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/**
      - packages/aws-durable-execution-conformance-tests-otel/src/**
      - packages/aws-durable-execution-conformance-tests/src/**
      - packages/aws-durable-execution-conformance-tests-otel/collector/**
      - .github/actions/prepare-otel-example/**
      - .github/workflows/opentelemetry-orchestrator.yml
      - .github/workflows/opentelemetry-resolve.yml
      - .github/workflows/opentelemetry-suite.yml
      - .github/workflows/opentelemetry-long-running.yml
      - .github/workflows/opentelemetry-conformance-tests.yml
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: SDK commit or branch to test against (defaults to main)
        required: false
        default: main
        type: string
      phase:
        description: Run short tests, launch a long run, or check the active long run
        required: true
        default: short
        type: choice
        options:
          - short
          - launch
          - check
      delay_seconds:
        description: Durable delay in seconds (1-86400, launch only)
        required: true
        default: "82800"
        type: string
      aws_region:
        description: AWS region
        required: true
        default: us-west-2
        type: string

permissions: {}

jobs:
  opentelemetry:
    permissions:
      actions: write
      contents: read
      id-token: write
    uses: ./.github/workflows/opentelemetry-orchestrator.yml
    with:
      runs_on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
      # Distinct language/prefix from the Java SDK's own run (java / j) to
      # avoid sharing stacks, buckets, or concurrency groups. normalize_runtime
      # maps "jvm" to the java runtime.
      language: jvm
      resource_prefix: j-self
      sdk_repository: aws/aws-durable-execution-sdk-java
      sdk_ref: ${{ inputs.sdk_ref || 'main' }}
      checkout_sdk: true
      # Relative to the conformance workspace, where the SDK is checked out.
      examples_dir: .build/durable-sdk/conformance-tests-otel
      setup_command: |
        set -euo pipefail
        if [ -n "${JAVA_HOME_21_X64:-}" ]; then
          export JAVA_HOME="$JAVA_HOME_21_X64"
        elif [ -x /usr/lib/jvm/java-21-amazon-corretto/bin/java ]; then
          export JAVA_HOME=/usr/lib/jvm/java-21-amazon-corretto
        elif [ -z "${JAVA_HOME:-}" ]; then
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
        fi
        if [ ! -x "$JAVA_HOME/bin/java" ] || [ ! -x "$JAVA_HOME/bin/javac" ]; then
          echo "Selected JAVA_HOME=$JAVA_HOME is not a complete JDK"
          exit 1
        fi
        export PATH="$JAVA_HOME/bin:$PATH"
        java_spec=$(java -XshowSettings:properties -version 2>&1 | awk '$1 == "java.specification.version" {print $3}')
        if [ "$java_spec" != "21" ]; then
          echo "Java 21 is required; selected JAVA_HOME=$JAVA_HOME reports specification version $java_spec"
          exit 1
        fi
        javac_version=$(javac -version 2>&1)
        if [[ ! "$javac_version" =~ ^javac[[:space:]]21([.]|[[:space:]]|$) ]]; then
          echo "Java 21 javac is required; selected compiler reports $javac_version"
          exit 1
        fi
        java -version
        javac -version
        if [ -n "${GITHUB_ENV:-}" ]; then
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
        fi
        if [ -n "${GITHUB_PATH:-}" ]; then
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
        fi
      prepare_command: |
        JAVA_SDK_VERSION=$(
          mvn -B -q \
            --file "$SDK_CHECKOUT/pom.xml" \
            -Dstyle.color=never \
            -Dexpression=project.version \
            -DforceStdout \
            help:evaluate
        )
        mvn -B -q \
          --file "$SDK_CHECKOUT/pom.xml" \
          --projects sdk,otel-plugin \
          --also-make \
          -DskipTests \
          install
        echo "Using Java SDK version $JAVA_SDK_VERSION"
        echo "JAVA_SDK_VERSION=$JAVA_SDK_VERSION" >> "$GITHUB_ENV"
        mvn -B -q -DskipTests package \
          -Ddurable.sdk.version="$JAVA_SDK_VERSION" \
          --file "$EXAMPLES_DIR/pom.xml"
      adot_release_repository: aws-observability/aws-otel-java-instrumentation
      collector_compatible_runtime: java21
      collector_otlp_endpoint: http://localhost:4318
      suite_timeout_minutes: 30
      phase: ${{ inputs.phase || 'short' }}
      delay_seconds: ${{ inputs.delay_seconds || '82800' }}
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
    secrets: inherit
