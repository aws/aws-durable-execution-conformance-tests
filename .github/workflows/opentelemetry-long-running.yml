name: OpenTelemetry Long Running

# Compatibility stub: long-running tests are disabled. Keep the workflow_call
# interface so consuming repositories can continue calling this workflow.

on:
  workflow_call:
    inputs:
      language:
        description: Stable language key used in resource and artifact names
        required: true
        type: string
      resource_prefix:
        description: Short prefix used by long-running Lambda resources
        required: true
        type: string
      conformance_repository:
        description: GitHub repository containing the conformance tests
        required: true
        type: string
      sdk_repository:
        description: GitHub repository containing the language SDK
        required: true
        type: string
      sdk_ref:
        description: Full SDK commit SHA
        required: true
        type: string
      conformance_test_sha:
        description: Conformance test commit SHA to run
        required: true
        type: string
      checkout_sdk:
        description: Check out the SDK before preparing handlers
        required: false
        default: true
        type: boolean
      setup_command:
        description: Shell command that installs or selects the language toolchain
        required: false
        default: ""
        type: string
      prepare_command:
        description: Shell command that prepares the language handlers
        required: false
        default: ""
        type: string
      contract_test_command:
        description: Optional shell command that validates the language example contract
        required: false
        default: ""
        type: string
      adot_release_repository:
        description: GitHub repository whose latest release lists regional ADOT layers
        required: false
        default: ""
        type: string
      adot_layer_arn:
        description: Optional fixed ADOT layer ARN
        required: false
        default: ""
        type: string
      phase:
        description: Workflow phase
        required: false
        default: short
        type: string
      view:
        description: OTel view to verify
        required: true
        type: string
      delay_seconds:
        description: Durable delay in seconds
        required: false
        default: "60"
        type: string
      examples_dir:
        description: >-
          Directory containing the language's OTel handlers + template(s), typically a path
          inside the checked-out SDK. Each SDK repository owns its own handlers, so this repo
          bundles none and every caller must supply this path.
        required: true
        type: string
      aws_region:
        description: AWS region
        required: false
        default: us-west-2
        type: string
      runs_on:
        description: Runner label for the run job
        required: false
        default: ubuntu-latest
        type: string
    outputs:
      check_status:
        description: Always skipped because long-running tests are disabled
        value: ${{ jobs.run.outputs.check_status }}
      rollover_ready:
        description: Always false because no executions are launched or checked
        value: ${{ jobs.run.outputs.rollover_ready }}

permissions: {}

jobs:
  run:
    name: Long-running tests disabled
    runs-on: ${{ inputs.runs_on }}
    outputs:
      check_status: skipped
      rollover_ready: "false"
    steps:
      - name: No-op for caller compatibility
        run: ":"
