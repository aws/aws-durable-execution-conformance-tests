name: Java OpenTelemetry

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/java-opentelemetry.yml
      - .github/workflows/java-opentelemetry-suite.yml
      - .github/workflows/java-opentelemetry-long-running.yml
      - packages/aws-durable-execution-conformance-tests/src/**
      - packages/aws-durable-execution-conformance-tests-otel/src/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-invocation/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-execution/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-long-running/**
      - packages/aws-durable-execution-conformance-tests-otel/collector/**
      - packages/aws-durable-execution-conformance-tests-otel/examples/java/**
  push:
    branches: [main]
    paths:
      - .github/workflows/java-opentelemetry.yml
      - .github/workflows/java-opentelemetry-suite.yml
      - .github/workflows/java-opentelemetry-long-running.yml
      - packages/aws-durable-execution-conformance-tests/src/**
      - packages/aws-durable-execution-conformance-tests-otel/src/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-invocation/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-execution/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-long-running/**
      - packages/aws-durable-execution-conformance-tests-otel/collector/**
      - packages/aws-durable-execution-conformance-tests-otel/examples/java/**
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: Run short tests, launch a long run, or check the active long run
        required: true
        default: short
        type: choice
        options:
          - short
          - launch
          - check
      delay_seconds:
        description: Durable delay in seconds (1-86400, launch only)
        required: true
        default: "82800"
        type: string
      aws_region:
        description: AWS region
        required: true
        default: us-west-2
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  invocation:
    name: Invocation view
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.phase == 'short')
    uses: ./.github/workflows/java-opentelemetry-suite.yml
    with:
      suite: otel-invocation
      case_count: 19
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
    secrets: inherit

  execution:
    name: Execution view
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.phase == 'short')
    uses: ./.github/workflows/java-opentelemetry-suite.yml
    with:
      suite: otel-execution
      case_count: 19
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
    secrets: inherit

  long-running-invocation:
    name: Long running invocation view
    uses: ./.github/workflows/java-opentelemetry-long-running.yml
    with:
      phase: >-
        ${{ (github.event_name == 'pull_request' || github.event_name == 'push')
          && 'short' || (github.event_name == 'schedule' && 'auto' || inputs.phase) }}
      view: invocation
      delay_seconds: >-
        ${{ (github.event_name == 'pull_request' || github.event_name == 'push'
          || inputs.phase == 'short')
          && '600' || (inputs.delay_seconds || '82800') }}
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
    secrets: inherit

  long-running-execution:
    name: Long running execution view
    uses: ./.github/workflows/java-opentelemetry-long-running.yml
    with:
      phase: >-
        ${{ (github.event_name == 'pull_request' || github.event_name == 'push')
          && 'short' || (github.event_name == 'schedule' && 'auto' || inputs.phase) }}
      view: execution
      delay_seconds: >-
        ${{ (github.event_name == 'pull_request' || github.event_name == 'push'
          || inputs.phase == 'short')
          && '600' || (inputs.delay_seconds || '82800') }}
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
    secrets: inherit
