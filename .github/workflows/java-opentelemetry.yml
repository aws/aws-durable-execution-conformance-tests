name: Java OpenTelemetry

on:
  pull_request:
    branches: [main]
    paths:
      - .github/actions/prepare-otel-example/**
      - .github/workflows/java-opentelemetry.yml
      - .github/workflows/opentelemetry-orchestrator.yml
      - .github/workflows/opentelemetry-resolve.yml
      - .github/workflows/opentelemetry-suite.yml
      - .github/workflows/opentelemetry-long-running.yml
      - packages/aws-durable-execution-conformance-tests/src/**
      - packages/aws-durable-execution-conformance-tests-otel/src/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-invocation/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-execution/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-long-running/**
      - packages/aws-durable-execution-conformance-tests-otel/collector/**
      - packages/aws-durable-execution-conformance-tests-otel/examples/java/**
  push:
    branches: [main]
    paths:
      - .github/actions/prepare-otel-example/**
      - .github/workflows/java-opentelemetry.yml
      - .github/workflows/opentelemetry-orchestrator.yml
      - .github/workflows/opentelemetry-resolve.yml
      - .github/workflows/opentelemetry-suite.yml
      - .github/workflows/opentelemetry-long-running.yml
      - packages/aws-durable-execution-conformance-tests/src/**
      - packages/aws-durable-execution-conformance-tests-otel/src/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-invocation/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-execution/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-long-running/**
      - packages/aws-durable-execution-conformance-tests-otel/collector/**
      - packages/aws-durable-execution-conformance-tests-otel/examples/java/**
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: Run short tests, launch a long run, or check the active long run
        required: true
        default: short
        type: choice
        options:
          - short
          - launch
          - check
      delay_seconds:
        description: Durable delay in seconds (1-86400, launch only)
        required: true
        default: "82800"
        type: string
      aws_region:
        description: AWS region
        required: true
        default: us-west-2
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  conformance:
    name: Conformance
    uses: ./.github/workflows/opentelemetry-orchestrator.yml
    with:
      language: java
      resource_prefix: j
      sdk_repository: aws/aws-durable-execution-sdk-java
      checkout_sdk: true
      setup_command: |
        if [ -z "${JAVA_HOME_21_X64:-}" ]; then
          echo "The runner does not provide Java 21"
          exit 1
        fi
        export JAVA_HOME="$JAVA_HOME_21_X64"
        export PATH="$JAVA_HOME/bin:$PATH"
        java -version
      prepare_command: |
        JAVA_SDK_VERSION=$(
          mvn -B -q \
            --file "$SDK_CHECKOUT/pom.xml" \
            -Dstyle.color=never \
            -Dexpression=project.version \
            -DforceStdout \
            help:evaluate
        )
        mvn -B -q \
          --file "$SDK_CHECKOUT/pom.xml" \
          --projects sdk,otel-plugin \
          --also-make \
          -DskipTests \
          install
        echo "Using Java SDK version $JAVA_SDK_VERSION"
        echo "JAVA_SDK_VERSION=$JAVA_SDK_VERSION" >> "$GITHUB_ENV"
        mvn -B -q -DskipTests package \
          -Ddurable.sdk.version="$JAVA_SDK_VERSION" \
          --file "$EXAMPLES_DIR/pom.xml"
      contract_test_command: >-
        hatch run test:all
        packages/aws-durable-execution-conformance-tests-otel/tests/test_java_examples.py
      adot_release_repository: aws-observability/aws-otel-java-instrumentation
      collector_compatible_runtime: java21
      collector_otlp_endpoint: http://localhost:4318
      phase: ${{ inputs.phase || 'short' }}
      delay_seconds: ${{ inputs.delay_seconds || '82800' }}
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
    secrets: inherit
