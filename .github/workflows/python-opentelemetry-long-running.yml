name: Python OpenTelemetry Long Running

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: Launch a run or check the active run
        required: true
        default: launch
        type: choice
        options:
          - launch
          - check
      delay_seconds:
        description: Durable delay in seconds (1-86400, launch only)
        required: true
        default: "82800"
        type: string
      aws_region:
        description: AWS region
        required: true
        default: us-west-2
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: python-otel-long-running-${{ inputs.aws_region || 'us-west-2' }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.aws_region || 'us-west-2' }}
  PHASE: ${{ github.event_name == 'schedule' && 'auto' || inputs.phase }}
  DELAY_SECONDS: ${{ inputs.delay_seconds || '82800' }}
  STATE_FILE: /tmp/python-otel-long-running-state.json
  RESULT_FILE: /tmp/python-otel-long-running-result.json
  HISTORY_DIR: /tmp/python-otel-long-running-history
  REPORT_FILE: /tmp/python-otel-long-running-report
  TEST_TEMPLATE: packages/aws-durable-execution-conformance-tests-otel/examples/python/template-long-running.yaml

jobs:
  run:
    name: ${{ matrix.view }} / ${{ github.event_name == 'schedule' && 'Daily run' || inputs.phase }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        view:
          - invocation
          - execution
    env:
      OTEL_VIEW: ${{ matrix.view }}
      STATE_ARTIFACT: python-otel-long-running-${{ matrix.view }}-state
      TEST_NAME: python-xray-long-${{ matrix.view }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Find active run state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id=$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT&per_page=100" \
              --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .id // empty'
          )
          phase="$PHASE"
          if [ "$phase" = "auto" ]; then
            if [ -n "$artifact_id" ]; then
              phase=check
            else
              phase=launch
            fi
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          if [ "$phase" = "launch" ]; then
            if [ -n "$artifact_id" ]; then
              echo "An active Python $OTEL_VIEW long-running OTel run already exists (artifact $artifact_id)."
              exit 1
            fi
            echo "active=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$artifact_id" ]; then
            echo "No active Python $OTEL_VIEW long-running OTel run."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > "$RUNNER_TEMP/python-otel-long-running-state.zip"
          unzip -q "$RUNNER_TEMP/python-otel-long-running-state.zip" -d "$RUNNER_TEMP/state"
          mv "$RUNNER_TEMP/state/python-otel-long-running-state.json" "$STATE_FILE"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "active=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.state.outputs.active == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Configure AWS credentials
        if: steps.state.outputs.active == 'true'
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.PYTHON_TEST_ROLE_ARN }}
          role-session-name: durableExecutionPythonOtelLongRunning
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS test account
        if: steps.state.outputs.active == 'true'
        env:
          TEST_ACCOUNT_ID: ${{ secrets.PYTHON_TEST_ACCOUNT_ID }}
        run: |
          actual_account_id=$(aws sts get-caller-identity --query Account --output text)
          if [ "$actual_account_id" != "$TEST_ACCOUNT_ID" ]; then
            echo "Expected AWS account $TEST_ACCOUNT_ID but assumed into $actual_account_id"
            exit 1
          fi

      - name: Install Hatch
        if: steps.state.outputs.active == 'true'
        run: python -m pip install hatch==1.16.5

      - name: Set up SAM CLI
        if: steps.state.outputs.phase == 'launch'
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3

      - name: Resolve latest ADOT Python layer
        if: steps.state.outputs.phase == 'launch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ADOT_LAYER_ARN=$(
            gh api repos/aws-observability/aws-otel-python-instrumentation/releases/latest \
              --jq .body |
              awk -F '|' -v region="$AWS_REGION" '
                $2 ~ "^[[:space:]]*" region "[[:space:]]*$" {
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", $3)
                  print $3
                  exit
                }
              '
          )
          if [ -z "$ADOT_LAYER_ARN" ]; then
            echo "Could not resolve the latest ADOT Python layer for $AWS_REGION"
            exit 1
          fi
          echo "ADOT_LAYER_ARN=$ADOT_LAYER_ARN" >> "$GITHUB_ENV"

      - name: Launch long-running conformance executions
        if: steps.state.outputs.phase == 'launch'
        env:
          LAMBDA_EXECUTION_ROLE_ARN: ${{ secrets.PYTHON_TEST_LAMBDA_EXECUTION_ROLE_ARN }}
        run: |
          hatch run python -m aws_durable_execution_conformance_tests_otel.long_running launch \
            --template "$TEST_TEMPLATE" \
            --language python \
            --view "$OTEL_VIEW" \
            --region "$AWS_REGION" \
            --name "$TEST_NAME" \
            --state-file "$STATE_FILE" \
            --delay-seconds "$DELAY_SECONDS" \
            --lambda-execution-role-arn "$LAMBDA_EXECUTION_ROLE_ARN" \
            --otel-layer-arn "$ADOT_LAYER_ARN"

      - name: Persist active run state
        if: steps.state.outputs.phase == 'launch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.STATE_ARTIFACT }}
          path: ${{ env.STATE_FILE }}
          retention-days: 5

      - name: Check long-running conformance executions
        if: steps.state.outputs.phase == 'check' && steps.state.outputs.active == 'true'
        id: check
        run: |
          set +e
          hatch run python -m aws_durable_execution_conformance_tests_otel.long_running check \
            --state-file "$STATE_FILE" \
            --result-file "$RESULT_FILE" \
            --history-dir "$HISTORY_DIR" \
            --report-file "$REPORT_FILE" \
            --otel-backend xray
          exit_code=$?
          set -e
          if [ ! -f "$RESULT_FILE" ]; then
            echo "status=error" >> "$GITHUB_OUTPUT"
            echo "state_changed=false" >> "$GITHUB_OUTPUT"
            echo "check_exit_code=$exit_code" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=$(jq -r .status "$RESULT_FILE")" >> "$GITHUB_OUTPUT"
          echo "state_changed=$(jq -r .state_changed "$RESULT_FILE")" >> "$GITHUB_OUTPUT"
          echo "check_exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Persist updated callback state
        if: steps.check.outputs.status == 'pending' && steps.check.outputs.state_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.STATE_ARTIFACT }}
          path: ${{ env.STATE_FILE }}
          retention-days: 5

      - name: Retire previous state artifact
        if: steps.state.outputs.phase == 'check' && steps.state.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.state.outputs.artifact_id }}
          STATUS: ${{ steps.check.outputs.status }}
          STATE_CHANGED: ${{ steps.check.outputs.state_changed }}
          CHECK_EXIT_CODE: ${{ steps.check.outputs.check_exit_code }}
        run: |
          if [ "$STATUS" = "pending" ] && [ "$STATE_CHANGED" = "true" ]; then
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
          elif [ "$STATUS" = "failed" ]; then
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
          elif [ "$STATUS" = "passed" ] && [ "$CHECK_EXIT_CODE" = "0" ]; then
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
          fi

      - name: Upload reports and histories
        if: steps.state.outputs.phase == 'check' && steps.state.outputs.active == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-otel-long-running-${{ matrix.view }}-results-${{ github.run_id }}
          path: |
            ${{ env.HISTORY_DIR }}/
            ${{ env.REPORT_FILE }}.json
            ${{ env.REPORT_FILE }}.xml
          if-no-files-found: ignore

      - name: Enforce terminal result
        if: steps.state.outputs.phase == 'check' && steps.state.outputs.active == 'true' && always()
        env:
          STATUS: ${{ steps.check.outputs.status }}
          CHECK_EXIT_CODE: ${{ steps.check.outputs.check_exit_code }}
        run: |
          if [ "$CHECK_EXIT_CODE" != "0" ] || \
            [ "$STATUS" = "failed" ] || [ "$STATUS" = "error" ]; then
            exit 1
          fi
