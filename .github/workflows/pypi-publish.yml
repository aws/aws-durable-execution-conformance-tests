# Publishes one independently versioned distribution from a GitHub Release.
name: Upload PyPI Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  e2e:
    name: Runner E2E gate
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  release-build:
    name: Build selected distribution
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.package.outputs.project }}
    steps:
      # Runs before checkout so a malformed tag is rejected without first
      # fetching the ref and installing a toolchain.
      - name: Select package from release tag
        id: package
        shell: bash
        # RELEASE_TAG is attacker-influenced input and is passed via the
        # environment rather than a ${{ }} template expression, so that the
        # runner cannot substitute it into this script as executable code.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version_re='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*))?(\.post(0|[1-9][0-9]*))?(\.dev(0|[1-9][0-9]*))?'
          if [[ ! "$RELEASE_TAG" =~ ^(core|otel)-v${version_re}$ ]]; then
            echo "::error::Release tags must be core-vX.Y.Z or otel-vX.Y.Z, optionally followed by a PEP 440 pre-release, post-release or dev suffix (for example core-v1.2.3rc1). Got '$RELEASE_TAG'."
            exit 1
          fi
          case "$RELEASE_TAG" in
            core-v*)
              echo "directory=packages/aws-durable-execution-conformance-tests" >> "$GITHUB_OUTPUT"
              echo "project=aws-durable-execution-conformance-tests" >> "$GITHUB_OUTPUT"
              echo "version=${RELEASE_TAG#core-v}" >> "$GITHUB_OUTPUT"
              ;;
            otel-v*)
              echo "directory=packages/aws-durable-execution-conformance-tests-otel" >> "$GITHUB_OUTPUT"
              echo "project=aws-durable-execution-conformance-tests-otel" >> "$GITHUB_OUTPUT"
              echo "version=${RELEASE_TAG#otel-v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Unreachable: the pattern above constrains the prefix. Kept so a
              # future change to it fails here rather than silently emitting no
              # outputs and surfacing as a confusing error in a later step.
              echo "::error::Unhandled release tag prefix '$RELEASE_TAG'."
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Hatch
        run: python -m pip install hatch==1.16.5

      - name: Verify release version
        working-directory: ${{ steps.package.outputs.directory }}
        shell: bash
        # EXPECTED_VERSION derives from the release tag, so it inherits the
        # same taint and is likewise passed via the environment.
        env:
          EXPECTED_VERSION: ${{ steps.package.outputs.version }}
        run: |
          actual="$(hatch version)"
          if [[ "$actual" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Tag version $EXPECTED_VERSION does not match package version $actual."
            exit 1
          fi

      - name: Build release distribution
        working-directory: ${{ steps.package.outputs.directory }}
        run: hatch build

      - name: Upload distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: ${{ steps.package.outputs.directory }}/dist/

  pypi-publish:
    name: Publish selected distribution
    runs-on: ubuntu-latest
    needs: [release-build, e2e]
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.release-build.outputs.project }}/
    steps:
      - name: Retrieve distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
