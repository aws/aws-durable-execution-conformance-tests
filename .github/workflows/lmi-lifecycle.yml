name: Shared LMI lifecycle tests

on:
  workflow_call:
    inputs:
      conformance-ref:
        description: Full commit SHA matching the reusable workflow reference
        required: true
        type: string
      sdk-script:
        description: Caller-owned Bash script implementing the documented LMI stages
        required: true
        type: string
      runtime-label:
        required: true
        type: string
      lambda-runtime:
        required: true
        type: string
      stack-name:
        required: true
        type: string
      region:
        type: string
        default: us-west-2
      artifact-directory:
        type: string
        default: lmi_tests/artifacts
    secrets:
      TEST_ROLE_ARN:
        required: true
      TEST_ACCOUNT_ID:
        required: true
      TEST_LAMBDA_EXECUTION_ROLE_ARN:
        required: true
      CAPACITY_PROVIDER_ARN:
        required: true

permissions:
  contents: read

env:
  # Ignore the CodeBuild image's shared pip target and Python search path.
  PIP_CONFIG_FILE: /dev/null
  PYTHONPATH: ""
  CONFORMANCE_REVISION: ${{ inputs.conformance-ref }}
  LMI_SHARED_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  LMI_SDK_SCRIPT: ${{ inputs.sdk-script }}
  LMI_RUNTIME: ${{ inputs.lambda-runtime }}
  LMI_ARTIFACT_DIRECTORY: ${{ inputs.artifact-directory }}

jobs:
  harness:
    # Keep fork and Dependabot code outside the testing account.
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned shared conformance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aws/aws-durable-execution-conformance-tests
          ref: ${{ env.CONFORMANCE_REVISION }}
          path: .conformance
          persist-credentials: false
      # uv supplies Python on the CodeBuild Amazon Linux image and on Ubuntu.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          activate-environment: true
      - name: Set up SDK harness
        run: bash "$LMI_SDK_SCRIPT" setup
      - name: Validate SDK harness and local integration
        run: bash "$LMI_SDK_SCRIPT" harness
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lmi-harness-tests
          path: ${{ inputs.artifact-directory }}/

  cloud:
    name: cloud (${{ inputs.runtime-label }}, concurrency 1 and 2)
    needs: harness
    # Trusted PRs and manual runs exercise the shared lifecycle suite. SDK
    # failures remain strict; fork and Dependabot PRs run only the harness.
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    # GitHub Actions is the cross-run concurrency guard. Hold this slot through
    # cleanup and use the same group for every PR/ref targeting this provider.
    concurrency:
      group: lmi-e2e-shared-capacity-provider
      cancel-in-progress: false
      queue: max
    env:
      LMI_STACK_NAME: ${{ inputs.stack-name }}
      AWS_REGION: ${{ inputs.region }}
      CAPACITY_PROVIDER_ARN: ${{ secrets.CAPACITY_PROVIDER_ARN }}
      TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
      TEST_LAMBDA_EXECUTION_ROLE_ARN: ${{ secrets.TEST_LAMBDA_EXECUTION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned shared conformance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aws/aws-durable-execution-conformance-tests
          ref: ${{ env.CONFORMANCE_REVISION }}
          path: .conformance
          persist-credentials: false
      # uv supplies Python on the CodeBuild Amazon Linux image and on Ubuntu.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          activate-environment: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TEST_ROLE_ARN }}
          role-session-name: shared-lmi-e2e
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.TEST_ACCOUNT_ID }}
      - name: Verify test account and prerequisites
        run: |
          test -n "$CAPACITY_PROVIDER_ARN"
          test -n "$TEST_LAMBDA_EXECUTION_ROLE_ARN"
          test "$(aws sts get-caller-identity --query Account --output text)" = "$TEST_ACCOUNT_ID"
      - name: Set up SDK harness
        run: bash "$LMI_SDK_SCRIPT" setup
      - name: Build SDK checkout
        timeout-minutes: 5
        run: bash "$LMI_SDK_SCRIPT" build
      - name: Create or update persistent LMI functions
        timeout-minutes: 35
        run: bash "$LMI_SDK_SCRIPT" deploy
      - name: Refresh credentials for cloud assertions
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TEST_ROLE_ARN }}
          role-session-name: shared-lmi-assertions
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.TEST_ACCOUNT_ID }}
      - name: Run seven shared lifecycle requirements
        timeout-minutes: 60
        run: bash "$LMI_SDK_SCRIPT" run
      - name: Refresh credentials for evidence and cleanup
        if: always() && hashFiles(format('{0}/manifest.json', inputs.artifact-directory)) != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TEST_ROLE_ARN }}
          role-session-name: shared-lmi-cleanup
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.TEST_ACCOUNT_ID }}
      - name: Collect service history and runtime evidence
        if: always()
        timeout-minutes: 5
        run: |
          if test -f "$LMI_ARTIFACT_DIRECTORY/manifest.json"; then
            bash "$LMI_SDK_SCRIPT" collect
          fi
      - name: Release this run's work and retain persistent functions
        if: always()
        timeout-minutes: 5
        run: |
          if test -f "$LMI_ARTIFACT_DIRECTORY/manifest.json"; then
            bash "$LMI_SDK_SCRIPT" cleanup
          fi
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lmi-${{ inputs.lambda-runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: ${{ inputs.artifact-directory }}/
      - name: Summarize outcomes
        if: always()
        run: |
          bash "$LMI_SDK_SCRIPT" summary >> "$GITHUB_STEP_SUMMARY"
          find "$LMI_ARTIFACT_DIRECTORY/shared" -name report.json -print 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
