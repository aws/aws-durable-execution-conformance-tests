name: Issue Triage

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  triage:
    permissions:
      contents: read
      id-token: write
      issues: write
    uses: aws/aws-durable-execution-ci/.github/workflows/issue-triage.yml@fa50f83f756c3bc59d97164f3d2849c714e0498a
    with:
      runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
      labels: |
        pkg:conformance
        pkg:otel
        bug
        enhancement
        question
        documentation
        requirement
        urgent
        needs-triage
        needs-info
        good first issue
        help wanted
    secrets: inherit
