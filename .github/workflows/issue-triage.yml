name: Issue Triage

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  triage:
    permissions:
      contents: read
      id-token: write
      issues: write
    uses: aws/aws-durable-execution-ci/.github/workflows/issue-triage.yml@c28fdc7df300996309e282ee6bfe54658ba53351 # v0.7.0
    with:
      runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
      labels: |
        pkg:conformance
        pkg:otel
        bug
        enhancement
        question
        documentation
        requirement
        urgent
        needs-triage
        needs-info
        good first issue
        help wanted
    secrets: inherit
