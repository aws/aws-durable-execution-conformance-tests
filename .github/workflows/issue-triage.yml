name: Issue Triage

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  triage:
    permissions:
      contents: read
      id-token: write
      issues: write
    uses: aws/aws-durable-execution-ci/.github/workflows/issue-triage.yml@8a06a1e5c82083a9224af9d489ddd030be44d978
    with:
      labels: |
        pkg:conformance
        pkg:otel
        bug
        enhancement
        question
        documentation
        requirement
        urgent
        needs-triage
        needs-info
        good first issue
        help wanted
    secrets: inherit
