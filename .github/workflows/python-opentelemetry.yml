name: Python OpenTelemetry

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/python-opentelemetry.yml
      - .github/workflows/python-opentelemetry-suite.yml
      - .github/workflows/python-opentelemetry-long-running.yml
      - packages/aws-durable-execution-conformance-tests/src/**
      - packages/aws-durable-execution-conformance-tests-otel/src/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-invocation/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-execution/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-long-running/**
      - packages/aws-durable-execution-conformance-tests-otel/collector/**
      - packages/aws-durable-execution-conformance-tests-otel/examples/python/**
  push:
    branches: [main]
    paths:
      - .github/workflows/python-opentelemetry.yml
      - .github/workflows/python-opentelemetry-suite.yml
      - .github/workflows/python-opentelemetry-long-running.yml
      - packages/aws-durable-execution-conformance-tests/src/**
      - packages/aws-durable-execution-conformance-tests-otel/src/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-invocation/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-execution/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-long-running/**
      - packages/aws-durable-execution-conformance-tests-otel/collector/**
      - packages/aws-durable-execution-conformance-tests-otel/examples/python/**
  schedule:
    - cron: "0 7 * * *"
  workflow_call:
    inputs:
      phase:
        description: Run short tests, launch a long run, or check the active long run
        required: false
        default: short
        type: string
      delay_seconds:
        description: Durable delay in seconds
        required: false
        default: "82800"
        type: string
      aws_region:
        description: AWS region
        required: false
        default: us-west-2
        type: string
      otlp_endpoint:
        description: OTLP ingest endpoint for community-layer jobs
        required: false
        default: ""
        type: string
      python_sdk_ref:
        description: Python SDK Git ref to test
        required: true
        type: string
    secrets:
      CONFORMANCE_TEST_ROLE_ARN:
        description: AWS role assumed by the test jobs
        required: true
      CONFORMANCE_TEST_ACCOUNT_ID:
        description: Expected AWS account ID
        required: true
      CONFORMANCE_TEST_LAMBDA_EXECUTION_ROLE_ARN:
        description: Execution role assigned to test Lambda functions
        required: true
      DASH0_AUTH_TOKEN:
        description: Dash0 API and OTLP authentication token
        required: true
      DD_API_KEY:
        description: Datadog API key
        required: false
      DD_APPLICATION_KEY:
        description: Datadog application key
        required: false
      DATADOG_OTLP_HEADERS:
        description: Datadog OTLP request headers
        required: false
  workflow_dispatch:
    inputs:
      phase:
        description: Run short tests, launch a long run, or check the active long run
        required: true
        default: short
        type: choice
        options:
          - short
          - launch
          - check
      delay_seconds:
        description: Durable delay in seconds (1-86400, launch only)
        required: true
        default: "82800"
        type: string
      aws_region:
        description: AWS region
        required: true
        default: us-west-2
        type: string
      otlp_endpoint:
        description: OTLP ingest endpoint for community-layer jobs
        required: false
        type: string
permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  resolve-sdk-main:
    name: Resolve Python SDK ref
    runs-on: ubuntu-latest
    outputs:
      python_sdk_ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve Python SDK commit
        id: resolve
        env:
          REQUESTED_PYTHON_SDK_REF: ${{ inputs.python_sdk_ref }}
        run: |
          PYTHON_SDK_REF="$REQUESTED_PYTHON_SDK_REF"
          if [ -z "$PYTHON_SDK_REF" ]; then
            PYTHON_SDK_REF=$(
              git ls-remote \
                https://github.com/aws/aws-durable-execution-sdk-python.git \
                refs/heads/main |
                awk '{print $1}'
            )
          fi
          if [ -z "$PYTHON_SDK_REF" ]; then
            echo "Could not resolve an aws-durable-execution-sdk-python commit"
            exit 1
          fi
          echo "Using Python SDK commit $PYTHON_SDK_REF"
          echo "ref=$PYTHON_SDK_REF" >> "$GITHUB_OUTPUT"

  invocation:
    name: Invocation view
    needs: resolve-sdk-main
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.phase == 'short')
    uses: ./.github/workflows/python-opentelemetry-suite.yml
    with:
      suite: otel-invocation
      case_count: 19
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
      otlp_endpoint: ${{ inputs.otlp_endpoint || '' }}
      python_sdk_ref: ${{ needs.resolve-sdk-main.outputs.python_sdk_ref }}
    secrets: inherit

  execution:
    name: Execution view
    needs: resolve-sdk-main
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.phase == 'short')
    uses: ./.github/workflows/python-opentelemetry-suite.yml
    with:
      suite: otel-execution
      case_count: 19
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
      otlp_endpoint: ${{ inputs.otlp_endpoint || '' }}
      python_sdk_ref: ${{ needs.resolve-sdk-main.outputs.python_sdk_ref }}
    secrets: inherit

  long-running-invocation:
    name: Long running invocation view
    needs: resolve-sdk-main
    uses: ./.github/workflows/python-opentelemetry-long-running.yml
    with:
      phase: >-
        ${{ (github.event_name == 'pull_request' || github.event_name == 'push')
          && 'short' || (github.event_name == 'schedule' && 'auto' || inputs.phase) }}
      view: invocation
      delay_seconds: >-
        ${{ (github.event_name == 'pull_request' || github.event_name == 'push'
          || inputs.phase == 'short')
          && '60' || (inputs.delay_seconds || '82800') }}
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
      python_sdk_ref: ${{ needs.resolve-sdk-main.outputs.python_sdk_ref }}
    secrets: inherit

  long-running-execution:
    name: Long running execution view
    needs: resolve-sdk-main
    uses: ./.github/workflows/python-opentelemetry-long-running.yml
    with:
      phase: >-
        ${{ (github.event_name == 'pull_request' || github.event_name == 'push')
          && 'short' || (github.event_name == 'schedule' && 'auto' || inputs.phase) }}
      view: execution
      delay_seconds: >-
        ${{ (github.event_name == 'pull_request' || github.event_name == 'push'
          || inputs.phase == 'short')
          && '60' || (inputs.delay_seconds || '82800') }}
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
      python_sdk_ref: ${{ needs.resolve-sdk-main.outputs.python_sdk_ref }}
    secrets: inherit
