name: Python OpenTelemetry

on:
  pull_request:
    branches: [main]
    paths:
      - .github/actions/prepare-otel-example/**
      - .github/workflows/python-opentelemetry.yml
      - .github/workflows/opentelemetry-suite-orchestrator.yml
      - .github/workflows/opentelemetry-resolve.yml
      - .github/workflows/opentelemetry-suite.yml
      - .github/workflows/opentelemetry-long-running-orchestrator.yml
      - .github/workflows/opentelemetry-long-running.yml
      - packages/aws-durable-execution-conformance-tests/src/**
      - packages/aws-durable-execution-conformance-tests-otel/src/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-invocation/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-execution/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-long-running/**
      - packages/aws-durable-execution-conformance-tests-otel/collector/**
      - packages/aws-durable-execution-conformance-tests-otel/examples/python/**
  push:
    branches: [main]
    paths:
      - .github/actions/prepare-otel-example/**
      - .github/workflows/python-opentelemetry.yml
      - .github/workflows/opentelemetry-suite-orchestrator.yml
      - .github/workflows/opentelemetry-resolve.yml
      - .github/workflows/opentelemetry-suite.yml
      - .github/workflows/opentelemetry-long-running-orchestrator.yml
      - .github/workflows/opentelemetry-long-running.yml
      - packages/aws-durable-execution-conformance-tests/src/**
      - packages/aws-durable-execution-conformance-tests-otel/src/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-invocation/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-execution/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-long-running/**
      - packages/aws-durable-execution-conformance-tests-otel/collector/**
      - packages/aws-durable-execution-conformance-tests-otel/examples/python/**
  schedule:
    - cron: "0 7 * * *"
  workflow_call:
    inputs:
      phase:
        description: Run short tests, launch a long run, or check the active long run
        required: false
        default: short
        type: string
      delay_seconds:
        description: Durable delay in seconds
        required: false
        default: "82800"
        type: string
      aws_region:
        description: AWS region
        required: false
        default: us-west-2
        type: string
      otlp_endpoint:
        description: OTLP ingest endpoint for community-layer jobs
        required: false
        default: ""
        type: string
      conformance_test_ref:
        description: Optional conformance test commit SHA or branch name
        required: false
        type: string
      python_sdk_ref:
        description: Full Python SDK commit SHA to test
        required: true
        type: string
    secrets:
      CONFORMANCE_TEST_ROLE_ARN:
        description: AWS role assumed by the test jobs
        required: true
      CONFORMANCE_TEST_ACCOUNT_ID:
        description: Expected AWS account ID
        required: true
      CONFORMANCE_TEST_LAMBDA_EXECUTION_ROLE_ARN:
        description: Execution role assigned to test Lambda functions
        required: true
      DASH0_AUTH_TOKEN:
        description: Dash0 API and OTLP authentication token
        required: true
      DD_API_KEY:
        description: Datadog API key
        required: false
      DD_APPLICATION_KEY:
        description: Datadog application key
        required: false
      DATADOG_OTLP_HEADERS:
        description: Datadog OTLP request headers
        required: false
  workflow_dispatch:
    inputs:
      phase:
        description: Run short tests, launch a long run, or check the active long run
        required: true
        default: short
        type: choice
        options:
          - short
          - launch
          - check
      delay_seconds:
        description: Durable delay in seconds (1-86400, launch only)
        required: true
        default: "82800"
        type: string
      aws_region:
        description: AWS region
        required: true
        default: us-west-2
        type: string
      otlp_endpoint:
        description: OTLP ingest endpoint for community-layer jobs
        required: false
        type: string
      conformance_test_ref:
        description: Optional conformance test commit SHA or branch name
        required: false
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  resolve:
    name: Resolve test commits
    uses: ./.github/workflows/opentelemetry-resolve.yml
    with:
      language: python
      resource_prefix: p
      sdk_repository: aws/aws-durable-execution-sdk-python
      sdk_ref: ${{ inputs.python_sdk_ref || '' }}
      conformance_test_ref: ${{ inputs.conformance_test_ref || '' }}
      adot_release_repository: aws-observability/aws-otel-python-instrumentation
      phase: ${{ inputs.phase || 'short' }}

  conformance:
    name: Conformance
    needs: resolve
    uses: ./.github/workflows/opentelemetry-suite-orchestrator.yml
    with:
      language: python
      sdk_repository: aws/aws-durable-execution-sdk-python
      sdk_ref: ${{ needs.resolve.outputs.sdk_ref }}
      conformance_test_sha: ${{ needs.resolve.outputs.conformance_test_sha }}
      checkout_sdk: false
      contract_test_command: &contract_test_command >-
        hatch run test:all
        packages/aws-durable-execution-conformance-tests-otel/tests/test_python_examples.py
      adot_release_repository: aws-observability/aws-otel-python-instrumentation
      collector_compatible_runtime: python3.13
      collector_otlp_endpoint: http://localhost:4318
      suite_timeout_minutes: 30
      phase: ${{ inputs.phase || 'short' }}
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
      otlp_endpoint: ${{ inputs.otlp_endpoint || '' }}
    secrets: inherit

  long-running:
    name: Long running
    needs: resolve
    uses: ./.github/workflows/opentelemetry-long-running-orchestrator.yml
    with:
      language: python
      resource_prefix: p
      sdk_repository: aws/aws-durable-execution-sdk-python
      sdk_ref: ${{ needs.resolve.outputs.sdk_ref }}
      conformance_test_sha: ${{ needs.resolve.outputs.conformance_test_sha }}
      checkout_sdk: false
      contract_test_command: *contract_test_command
      adot_release_repository: aws-observability/aws-otel-python-instrumentation
      phase: ${{ inputs.phase || 'short' }}
      delay_seconds: ${{ inputs.delay_seconds || '82800' }}
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
    secrets: inherit
