name: JavaScript OpenTelemetry

on:
  pull_request:
    branches: [main]
    paths:
      - .github/actions/prepare-otel-example/**
      - .github/workflows/javascript-opentelemetry.yml
      - .github/workflows/opentelemetry-suite-orchestrator.yml
      - .github/workflows/opentelemetry-resolve.yml
      - .github/workflows/opentelemetry-suite.yml
      - .github/workflows/opentelemetry-long-running-orchestrator.yml
      - .github/workflows/opentelemetry-long-running.yml
      - packages/aws-durable-execution-conformance-tests/src/**
      - packages/aws-durable-execution-conformance-tests-otel/src/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-invocation/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-execution/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-long-running/**
      - packages/aws-durable-execution-conformance-tests-otel/collector/**
      - packages/aws-durable-execution-conformance-tests-otel/examples/javascript/**
  push:
    branches: [main]
    paths:
      - .github/actions/prepare-otel-example/**
      - .github/workflows/javascript-opentelemetry.yml
      - .github/workflows/opentelemetry-suite-orchestrator.yml
      - .github/workflows/opentelemetry-resolve.yml
      - .github/workflows/opentelemetry-suite.yml
      - .github/workflows/opentelemetry-long-running-orchestrator.yml
      - .github/workflows/opentelemetry-long-running.yml
      - packages/aws-durable-execution-conformance-tests/src/**
      - packages/aws-durable-execution-conformance-tests-otel/src/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-invocation/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-execution/**
      - packages/aws-durable-execution-conformance-tests-otel/test-requirements/otel-long-running/**
      - packages/aws-durable-execution-conformance-tests-otel/collector/**
      - packages/aws-durable-execution-conformance-tests-otel/examples/javascript/**
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: Run short tests, launch a long run, or check the active long run
        required: true
        default: short
        type: choice
        options:
          - short
          - launch
          - check
      delay_seconds:
        description: Durable delay in seconds (1-86400, launch only)
        required: true
        default: "82800"
        type: string
      aws_region:
        description: AWS region
        required: true
        default: us-west-2
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  resolve:
    name: Resolve test commits
    uses: ./.github/workflows/opentelemetry-resolve.yml
    with:
      language: javascript
      resource_prefix: js
      sdk_repository: aws/aws-durable-execution-sdk-js
      adot_release_repository: aws-observability/aws-otel-js-instrumentation
      phase: ${{ inputs.phase || 'short' }}

  conformance:
    name: Conformance
    needs: resolve
    uses: ./.github/workflows/opentelemetry-suite-orchestrator.yml
    with:
      language: javascript
      sdk_repository: aws/aws-durable-execution-sdk-js
      sdk_ref: ${{ needs.resolve.outputs.sdk_ref }}
      conformance_test_sha: ${{ needs.resolve.outputs.conformance_test_sha }}
      checkout_sdk: true
      setup_command: &setup_command |
        export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
        source "$NVM_DIR/nvm.sh"
        nvm install 22
        nvm use 22
        node --version
      prepare_command: &prepare_command |
        export SDK_SOURCE_DIR="$SDK_CHECKOUT"
        cd "$EXAMPLES_DIR"
        npm ci
        npm run install-sdk-main
        npm run typecheck
        npm run build
      contract_test_command: &contract_test_command >-
        hatch run test:all
        packages/aws-durable-execution-conformance-tests-otel/tests/test_javascript_examples.py
      adot_release_repository: aws-observability/aws-otel-js-instrumentation
      collector_compatible_runtime: nodejs22.x
      collector_otlp_endpoint: http://localhost:4318
      # Clean up rolled-back stacks created before the JavaScript rename.
      legacy_stack_prefix: durable-execution-conformance-tests-typescript
      phase: ${{ inputs.phase || 'short' }}
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
    secrets: inherit

  long-running:
    name: Long running
    needs: resolve
    uses: ./.github/workflows/opentelemetry-long-running-orchestrator.yml
    with:
      language: javascript
      resource_prefix: js
      sdk_repository: aws/aws-durable-execution-sdk-js
      sdk_ref: ${{ needs.resolve.outputs.sdk_ref }}
      conformance_test_sha: ${{ needs.resolve.outputs.conformance_test_sha }}
      checkout_sdk: true
      setup_command: *setup_command
      prepare_command: *prepare_command
      contract_test_command: *contract_test_command
      adot_release_repository: aws-observability/aws-otel-js-instrumentation
      phase: ${{ inputs.phase || 'short' }}
      delay_seconds: ${{ inputs.delay_seconds || '82800' }}
      aws_region: ${{ inputs.aws_region || 'us-west-2' }}
    secrets: inherit
