name: Stale Issue Closer

on:
  schedule:
    - cron: "7 12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  close-stale:
    permissions:
      contents: read
      issues: write
    uses: aws/aws-durable-execution-ci/.github/workflows/stale-issue-closer.yml@c28fdc7df300996309e282ee6bfe54658ba53351
    with:
      runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
